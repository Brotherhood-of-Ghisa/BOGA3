name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      # Docs drift guard (`docs-check` lane): generated blocks (lane matrix)
      # current, lane-name citations valid, relative .md links resolve, spec
      # ownership headers present. Pure python3/bash — runs before npm ci.
      - name: Docs check
        run: ./scripts/gen-docs.sh check
        working-directory: ${{ github.workspace }}
        timeout-minutes: 2

      # Meta-tooling self-tests (`meta-tests` lane): gen-docs / test-for
      # against fixtures. Infra-free.
      - name: Meta tests
        run: ./scripts/tests/run-meta-tests.sh
        working-directory: ${{ github.workspace }}
        timeout-minutes: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/agent-auth-web/package-lock.json
            services/boga-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Design-token guardrail (`ui-guardrails` lane). Blocks raw color
      # literals outright, and holds raw fontSize / spacing / radius counts to
      # the budgets in scripts/ui-guardrails.config.js so they can only fall.
      - name: UI guardrails
        run: npm run lint:ui-guardrails

      # Hard ceiling on the unit run. A leaked handle that keeps Jest alive
      # AFTER tests pass (the failure mode that once hung this gate silently)
      # is killed here in minutes instead of running to the default 6h job
      # timeout. Deliberately NOT `--forceExit`, which would hide the leak.
      - name: Test
        run: npm test
        timeout-minutes: 5

      - name: Agent authorization web
        run: ./scripts/test-agent-auth-web.sh
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5

      - name: MCP server
        run: ./scripts/test-boga-mcp.sh
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
