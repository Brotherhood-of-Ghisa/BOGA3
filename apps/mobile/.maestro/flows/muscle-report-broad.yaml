appId: com.dinoderek.mobile
---
# Muscle setup across screens (ios-data-smoke lane, infra-free).
#
# Proves, over one fixture session (Lat Pulldown, Barbell Back Squat, Standing
# Calf Raise) and the device's own muscle rows ([[muscle.report-groups]]):
#   1. Settings → Muscles turns Calves and Tibialis Off from the muscle list
#      and each muscle's page, then Starts from Broad (confirmed in an Alert)
#      on Combined muscles, all from full stack pages, and
#      Progress, already mounted, shows the user's muscles on return under
#      their combined keys: Chest and Back; no Serratus, Lats, Upper back or
#      Calves row; Chest, now one muscle, loses its family header
#      ([[muscle.no-breakdown]], [[muscle.untracked]]);
#   2. the completed session's muscle breakdown reports the same muscles;
#   3. the catalogue's keyboard search matches muscle names only ("lats" finds
#      nothing, "back pulldown" finds Lat Pulldown), and its editor shows Back
#      once, with Biceps and no Upper back among the secondaries;
#   4. the 3D body: a tap on the abdomen selects Core, the muscle Abs and
#      Obliques merge into;
#   5. deleting Chest and Back in their editor restores those entries' rows
#      and header, and Calves turned back On rejoins its combined muscle
#      ([[muscle.report-groups]]: Off keeps the membership).
# Why device:
#   1. real stack pages, radio rows and a native Alert writing the on-device
#      expo-sqlite, read back by a screen already mounted in the stack
#      (focus refresh and the catalogue invalidation on the native runtime),
#      and the keyboard for the muscle search;
#   2. the completed-session route pushed over the stack on the same rows;
#   3. the keyboard, and the editor sheet's panels;
#   4. the model's gesture-handler tap on the native GL view (Jest has no layout
#      and mocks the gesture);
#   5. the editor's delete Alert and its return, the other way.
# Jest counterpart: __tests__/muscle-report-settings.test.tsx (writes, dirty
#   flags, Track), __tests__/combined-muscle-settings.test.tsx (the pages), __tests__/muscle-report.test.ts (the
#   transform), __tests__/progress-muscle-report-local-data.test.tsx (Progress,
#   history, Filters, figures), __tests__/muscle-body-3d.test.tsx (shading, hit
#   test, merged selection), __tests__/completed-session-local-data.test.tsx and
#   __tests__/session-muscle-report.test.ts (session summary, comparisons, live
#   insights), __tests__/exercise-editor-screen.test.tsx and
#   __tests__/exercise-catalog-search.test.ts (editor, search),
#   __tests__/groups-link-view-model.test.ts (group searches).
#
# `reset=data` re-seeds the catalogue, so every run starts with no combined
# muscles and every muscle On; the Progress view (List / 3D) is a preference that
# survives the reset, so it is set explicitly.
- retry:
    maxRetries: 3
    commands:
      - openLink: "boga3://maestro-harness?reset=data&fixture=muscle-report&teleport=today"
      - extendedWaitUntil:
          visible:
            id: "today-screen"
          timeout: 30000

# --- Setup: the List view; no combined muscles after the reset ---
- openLink: "boga3://settings-progress"
- scrollUntilVisible:
    element:
      id: "settings-muscle-view-list"
    direction: DOWN
- tapOn:
    id: "settings-muscle-view-list"
- openLink: "boga3://progress?breakdown=muscle"
- extendedWaitUntil:
    visible:
      id: "stats-muscle-table"
    timeout: 15000
- repeat:
    while:
      notVisible:
        id: "stats-metric-chip-workingSetCount"
    times: 4
    commands:
      - tapOn:
          id: "stats-metric-chip"
- assertVisible: { id: "stats-muscle-block-serratus_anterior" }

# --- 1. Full pages: muscles Off, native target keyboard, and Broad ---------
# Added device proof: Jest cannot establish UIKit stack return, number-pad
# occlusion or lower-row scroll reachability. Target values/inheritance and
# enabled-only filtering are asserted over real data by muscle-target-settings.
- openLink: "boga3://settings"
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 15000
- scrollUntilVisible:
    element: { id: "settings-muscles-row" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "settings-muscles-row" }
- extendedWaitUntil:
    visible: { id: "settings-muscles-screen" }
    timeout: 15000
- tapOn: { id: "settings-muscle-list-row" }
- extendedWaitUntil:
    visible: { id: "settings-muscle-list-screen" }
    timeout: 15000
# Lower Legs is the last family: its rows are fully visible clear of native
# chrome at the scroll end, but cannot reach the centre (end-of-content).
- scrollUntilVisible:
    element: { id: "settings-muscle-calves" }
    direction: DOWN
- tapOn: { id: "settings-muscle-calves" }
- extendedWaitUntil:
    visible: { id: "settings-muscle-off" }
    timeout: 15000
- tapOn: { id: "settings-muscle-off" }
- takeScreenshot: "muscles-one-muscle-page"
- tapOn: { id: "BackButton" }
# iOS does not expose a radio row's checked state; the list's value is the proof.
- extendedWaitUntil:
    visible: { id: "settings-muscle-calves", text: "Calves, Off" }
    timeout: 15000
- scrollUntilVisible:
    element: { id: "settings-muscle-tibialis_anterior" }
    direction: DOWN
- tapOn: { id: "settings-muscle-tibialis_anterior" }
- extendedWaitUntil:
    visible: { id: "settings-muscle-off" }
    timeout: 15000
- tapOn: { id: "settings-muscle-off" }
- tapOn: { id: "BackButton" }
- extendedWaitUntil:
    visible: { id: "settings-muscle-tibialis_anterior", text: "Tibialis Anterior, Off" }
    timeout: 15000
- takeScreenshot: "muscles-list-page"
- tapOn: { id: "BackButton" }
- extendedWaitUntil:
    visible: { id: "settings-muscle-list-row" }
    timeout: 15000
- tapOn: { id: "settings-muscle-target-mode-per-muscle" }
- tapOn: { id: "settings-muscle-targets-row" }
- extendedWaitUntil:
    visible: { id: "settings-muscle-target-chest" }
    timeout: 15000
- assertNotVisible: { id: "settings-muscle-target-calves" }
- tapOn: { id: "settings-muscle-target-chest" }
- eraseText
- inputText: "12"
- hideKeyboard
- takeScreenshot: "muscles-targets-page"
- scrollUntilVisible:
    element: { id: "settings-muscle-target-hamstrings" }
    direction: DOWN
    centerElement: true
- tapOn: { id: "settings-muscle-target-hamstrings" }
- eraseText
- inputText: "10"
- takeScreenshot: "muscles-targets-lower-row-keyboard"
- hideKeyboard
- tapOn: "Back"
- extendedWaitUntil:
    visible: { id: "settings-muscle-targets-row" }
    timeout: 15000
- tapOn: { id: "settings-combined-muscles-row" }
- extendedWaitUntil:
    visible: { id: "settings-combined-muscles-broad" }
    timeout: 15000
- tapOn: { id: "settings-combined-muscles-broad" }
- tapOn: "Start from Broad"
- extendedWaitUntil:
    visible: { id: "settings-combined-cm_chest" }
    timeout: 15000
- takeScreenshot: "muscles-combined-page"
- tapOn: { id: "BackButton" }
- extendedWaitUntil:
    visible: { id: "settings-combined-muscles-row", text: "Combined muscles, 11" }
    timeout: 15000
- takeScreenshot: "muscles-settings-page"
- openLink: "boga3://progress?breakdown=muscle"
# Chest merges Serratus, so it is one muscle and its family has no header.
- extendedWaitUntil:
    notVisible: { id: "stats-muscle-block-serratus_anterior" }
    timeout: 15000
- assertVisible: { id: "stats-muscle-block-cm_chest" }
- assertNotVisible: { id: "stats-family-header-chest" }
- takeScreenshot: "muscle-report-03-broad-progress"
# Rows below the fold are not in the hierarchy, so the keyboard search brings
# each claim on screen: Back by its merged name, no Lats, no untracked Calves.
- tapOn: { id: "stats-muscle-search-input" }
- eraseText
- inputText: "back"
- extendedWaitUntil:
    visible: { id: "stats-muscle-history-cm_back", text: ".*Back.*" }
    timeout: 10000
- assertNotVisible: { id: "stats-muscle-block-back_upper" }
- tapOn: { id: "stats-muscle-search-input" }
- eraseText
- inputText: "lats"
- extendedWaitUntil:
    visible: { id: "stats-muscle-list-empty" }
    timeout: 10000
- tapOn: { id: "stats-muscle-search-input" }
- eraseText
- inputText: "calves"
- extendedWaitUntil:
    visible: { id: "stats-muscle-list-empty" }
    timeout: 10000
- tapOn: { id: "stats-muscle-search-input" }
- eraseText
- hideKeyboard

# --- 2. The completed session reports the same muscles ---------------------
- openLink: "boga3://completed-session/maestro_muscle_report_session"
- extendedWaitUntil:
    visible: { id: "session-completion-muscle-table" }
    timeout: 15000
- scrollUntilVisible:
    element: { id: "session-completion-muscle-cm_back", text: "Back, .*" }
    direction: DOWN
- scrollUntilVisible:
    element: { id: "session-completion-muscle-cm_quads" }
    direction: DOWN
- assertNotVisible: { id: "session-completion-muscle-back_lats" }
- assertNotVisible: { id: "session-completion-muscle-back_upper" }
- assertNotVisible: { id: "session-completion-muscle-adductors" }
- assertNotVisible: { id: "session-completion-muscle-calves" }
- takeScreenshot: "muscle-report-04-broad-session"

# --- 3. Catalogue search and editor ---------------------------------------
- openLink: "boga3://exercise-catalog"
- extendedWaitUntil:
    visible: { id: "exercise-catalog-screen" }
    timeout: 15000
- tapOn: "Exercise filter input"
- inputText: "lats"
- extendedWaitUntil:
    notVisible: "Exercise actions Lat Pulldown"
    timeout: 10000
- takeScreenshot: "muscle-report-05-broad-search-lats"
- eraseText
- inputText: "back pulldown"
- extendedWaitUntil:
    visible: "Exercise actions Lat Pulldown"
    timeout: 10000
- hideKeyboard
- tapOn: "Exercise actions Lat Pulldown"
- tapOn: { id: "exercise-action-edit" }
- extendedWaitUntil:
    visible: { id: "exercise-editor-primary-muscle-trigger" }
    timeout: 10000
- assertVisible: "Secondary: .*Biceps.*"
- assertNotVisible: "Secondary: .*Upper back.*"
- takeScreenshot: "muscle-report-06-broad-editor"
- tapOn: { id: "BackButton" }

# --- 4. The 3D body --------------------------------------------------------
- openLink: "boga3://settings-progress"
- scrollUntilVisible:
    element:
      id: "settings-muscle-view-3d"
    direction: DOWN
- tapOn: { id: "settings-muscle-view-3d" }
- openLink: "boga3://progress?breakdown=muscle"
- extendedWaitUntil:
    visible: { id: "stats-muscle-body-viewport" }
    timeout: 15000
# The model's centre is the abdomen at the front view; Abs and Obliques both
# report as Core, so the tap selects it by that name.
- tapOn: { id: "stats-muscle-body-viewport" }
- extendedWaitUntil:
    visible: { id: "stats-muscle-body-selected", text: "Core" }
    timeout: 10000
- takeScreenshot: "muscle-report-07-broad-3d"

# --- 5. Chest and Back deleted, Calves back On ------------------------------
- openLink: "boga3://settings-progress"
- scrollUntilVisible:
    element:
      id: "settings-muscle-view-list"
    direction: DOWN
- tapOn: { id: "settings-muscle-view-list" }
- openLink: "boga3://settings-combined-muscle?key=cm_chest"
- extendedWaitUntil:
    visible: { id: "settings-combined-muscle-delete" }
    timeout: 15000
- tapOn: { id: "settings-combined-muscle-delete" }
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: { id: "settings-combined-muscle-screen" }
    timeout: 15000
- openLink: "boga3://settings-combined-muscle?key=cm_back"
- scrollUntilVisible:
    element: { id: "settings-combined-muscle-delete" }
    direction: DOWN
- tapOn: { id: "settings-combined-muscle-delete" }
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: { id: "settings-combined-muscle-screen" }
    timeout: 15000
# Off kept Calves in its combined muscle: On returns it there.
- openLink: "boga3://settings-muscle?id=calves"
- extendedWaitUntil:
    visible: { id: "settings-muscle-on" }
    timeout: 15000
- tapOn: { id: "settings-muscle-on" }
- openLink: "boga3://settings-muscle-list"
- scrollUntilVisible:
    element: { id: "settings-muscle-calves", text: "Calves, Calves" }
    direction: DOWN
    timeout: 15000
- openLink: "boga3://progress?breakdown=muscle"
- extendedWaitUntil:
    visible: { id: "stats-muscle-block-serratus_anterior" }
    timeout: 15000
- assertVisible: { id: "stats-family-header-chest" }
- tapOn: { id: "stats-muscle-search-input" }
- eraseText
- inputText: "lats"
- extendedWaitUntil:
    visible: { id: "stats-muscle-history-back_lats", text: ".*Lats.*" }
    timeout: 10000
- tapOn: { id: "stats-muscle-search-input" }
- eraseText
- inputText: "calves"
- extendedWaitUntil:
    visible: { id: "stats-muscle-block-cm_calves" }
    timeout: 10000
- takeScreenshot: "muscle-report-08-entries-restored"
- tapOn: { id: "stats-muscle-search-input" }
- eraseText
- hideKeyboard
