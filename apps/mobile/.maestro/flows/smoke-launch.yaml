appId: com.dinoderek.mobile
---
# No per-openLink Open/Continue/Close dismissal taps: the URL-scheme trust dialog
# is pre-authorized in maestro-ios-launch.sh and the one-time dev-client menu
# sheet is dismissed by the warm-up before this flow runs, so neither renders
# here (this lane does NOT clearState, so the dev-client's "seen menu" state is
# preserved between warm-up and flow). Each optional tap on an absent element
# costs the full ~7s optionalLookupTimeoutMs (measured) and they were all
# WARNED/absent on every run. If pre-authorization regresses, the next assertion
# fails loudly rather than silently absorbing ~7s/tap.
- openLink: "${MAESTRO_IOS_DEV_CLIENT_URL}"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 30000
# Production launch lands on Today, and all four approved destinations switch
# through the persistent shell in canonical order.
- assertVisible:
    id: "main-bottom-tabs"
- takeScreenshot: "01-m26-today"
# The cold dev-client reopen can consume the first tab tap on iOS 26.
# Retry the real navigation, retaining a bounded destination assertion.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-train"
      - extendedWaitUntil:
          visible:
            id: "train-screen"
          timeout: 5000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "02-m26-train"
- tapOn:
    id: "top-level-tab-progress"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "03-m26-progress"
- tapOn:
    id: "top-level-tab-more"
- assertVisible:
    id: "more-screen"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "04-m26-more"
# The tray collapses to its handle and comes back (DLM-T02 frame capture). The
# handle's label names the next action, so it proves the state.
- tapOn:
    id: "bottom-tray-handle"
- extendedWaitUntil:
    visible: "Expand navigation tray"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "frame-tray-collapsed"
- tapOn:
    id: "bottom-tray-handle"
- extendedWaitUntil:
    visible: "Collapse navigation tray"
    timeout: 5000
- tapOn:
    id: "top-level-tab-today"
- assertVisible:
    id: "today-screen"
- waitForAnimationToEnd:
    timeout: 4000
# Train's Start opens the session view on a new, empty session. The tab bar
# stays on the session view (it is the way out).
- tapOn:
    id: "top-level-tab-train"
- extendedWaitUntil:
    visible:
      id: "train-start-empty-button"
    timeout: 15000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "train-start-empty-button"
      - extendedWaitUntil:
          visible:
            id: "session-view-screen"
          timeout: 30000
- assertVisible:
    id: "session-view-add-exercise"
- assertVisible:
    id: "main-bottom-tabs"
- takeScreenshot: "05-m26-session-view-empty"
