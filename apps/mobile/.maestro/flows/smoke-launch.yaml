appId: com.dinoderek.mobile
---
# Smoke: the dev-client launch and the tab shell (ios-smoke lane, infra-free).
#
# Proves:
#   1. the dev client opens the app on Today, with the tab bar;
#   2. Train, Progress and More each open from the persistent tab bar;
#   3. Train's Start opens an empty session view, and the tab bar stays on it.
# Why device:
#   1. the dev-client boot and the root layout;
#   2. real tab navigation;
#   3. the root-stack push over the tabs.
# Jest counterpart: __tests__/main-tabs.test.tsx (tabs and the one bottom
#   bar), __tests__/today-screen.test.tsx (the Progress card),
#   __tests__/today-group-card.test.tsx (the Group activity card) and
#   __tests__/train-screen.test.tsx (leading with the active session).
#
# No per-openLink Open/Continue/Close dismissal taps: the URL-scheme trust dialog
# is pre-authorized in maestro-ios-launch.sh and the one-time dev-client menu
# sheet is dismissed by the warm-up before this flow runs, so neither renders
# here (this lane does NOT clearState, so the dev-client's "seen menu" state is
# preserved between warm-up and flow). Each optional tap on an absent element
# costs the full ~7s optionalLookupTimeoutMs (measured) and they were all
# WARNED/absent on every run. If pre-authorization regresses, the next assertion
# fails loudly rather than silently absorbing ~7s/tap.
#
# Stop the app first, so the dev-client link cold-starts it. maestro-ios-launch.sh
# has already loaded the bundle, and opening the link on that running app makes
# the dev client reload it. On React Native 0.88 that reload sometimes crashes
# with a SIGSEGV in Scheduler::uiManagerDidFinishTransaction: the old JS thread
# renders once more against the scheduler the reload has just freed. The
# simulator is then left on the home screen, and today-screen never appears.
- stopApp
- openLink: "${MAESTRO_IOS_DEV_CLIENT_URL}"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 30000
# Production launch lands on Today, and all four approved destinations switch
# through the persistent shell in canonical order.
- assertVisible:
    id: "main-bottom-tabs"
- takeScreenshot: "01-m26-today"
# The cold dev-client reopen can consume the first tab tap on iOS 26.
# Retry the real navigation, retaining a bounded destination assertion.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-train"
      - extendedWaitUntil:
          visible:
            id: "train-screen"
          timeout: 5000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "02-m26-train"
- tapOn:
    id: "top-level-tab-progress"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "03-m26-progress"
- tapOn:
    id: "top-level-tab-more"
- assertVisible:
    id: "more-screen"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "04-m26-more"
- tapOn:
    id: "top-level-tab-today"
- assertVisible:
    id: "today-screen"
- waitForAnimationToEnd:
    timeout: 4000
# Train's Start opens the session view on a new, empty session. The tab bar
# stays on the session view (it is the way out).
- tapOn:
    id: "top-level-tab-train"
- extendedWaitUntil:
    visible:
      id: "train-start-empty-button"
    timeout: 15000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "train-start-empty-button"
      - extendedWaitUntil:
          visible:
            id: "session-view-screen"
          timeout: 30000
- assertVisible:
    id: "session-view-add-exercise"
- assertVisible:
    id: "main-bottom-tabs"
- takeScreenshot: "05-m26-session-view-empty"
