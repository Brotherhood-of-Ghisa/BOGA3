      id: "group-members-list"
    timeout: 15000
- takeScreenshot: "groups-members-list"
- tapOn:
    id: "group-member-row-${output.groupsCounterpartyUserId}"
- extendedWaitUntil:
    visible:
      id: "group-member-actions-sheet"
    timeout: 10000
- takeScreenshot: "groups-member-actions-sheet"
- tapOn:
    id: "group-member-action-remove"
# The native confirmation Alert's destructive button.
- extendedWaitUntil:
    visible:
      text: "Remove"
    timeout: 10000
- tapOn:
    text: "Remove"
# The feedback View carries the testID; its sentence is a child text.
- extendedWaitUntil:
    visible:
      id: "group-members-action-feedback"
    timeout: 15000
- assertVisible: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} was removed\\."
- assertVisible:
    id: "group-members-meta"
    text: "1 member · You're the owner"
- assertNotVisible:
    id: "group-member-row-${output.groupsCounterpartyUserId}"
- takeScreenshot: "groups-members-removed"
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-segment-stream"
    timeout: 15000
- tapOn:
    id: "groups-segment-stream"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} was removed"
    timeout: 15000
# What the removed member shared stays in the group record (decision #4).
# Match the whole ID: the later record session shares this prefix plus -record.
- scrollUntilVisible:
    element:
      id: "^group-stream-session-card-${output.groupsCardKey}$"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "^group-stream-session-card-${output.groupsCardKey}$"
- waitForAnimationToEnd
- takeScreenshot: "groups-08-counterparty-removed"

