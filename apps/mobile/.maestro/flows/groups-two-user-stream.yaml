appId: com.dinoderek.mobile
---
# Two-user groups end to end (docs/specs/tech/groups-contract.md §8; lane
# ios-groups-e2e). The device signs in as fixture user_c and drives the real
# group UI against local Supabase; the counterparty, fixture user_d, is
# scripted over HTTP from ../scripts/groups-counterparty.js (GoTrue sign-in,
# group_join, sync_push, group_stream, group_exercise_list, group_board) with
# the same RPCs its own app would call.
#
# Proves:
#   1. a cold, wiped launch reaches sign-in, and user_c signs in;
#   2. after the username prompt, creating a group writes it on the server
#      (`1 member · You're the owner`), and its invite code is read off screen;
#   3. the counterparty joins with that code, and the device sees `joined`
#      and two members after a refresh;
#   4. (4b) the owner adds a standard copy and a custom group exercise,
#      renames the custom one, links the copy to its own exercise, and
#      archives it; the catalogue ⋮ Link screen reads the link back over RPC;
#      the counterparty reads the same list over group_exercise_list;
#   5. the counterparty's active session reaches the device as one `Training
#      now` card with metrics; completed and edited, the same card updates;
#   6. the friend view of that session is read-only;
#   7. (7b-7d) leaderboards, the uncertified row and its detail, link-change
#      history; certifying per metric fills the Certified podium, board and
#      history; unlink (cancel, unlink, preserve, relink) round-trips sync;
#   8. shared bodyweight math keeps Weight/1RM, a rules revision invalidates
#      certifications, and a bodyweight correction invalidates again;
#   9. (8) removing the counterparty shows `was removed` and keeps shared
#      data; the former member ranks `(former)` with a read-only detail, and
#      its own read returns NOT_FOUND.
# Why device: every claim needs two real users and real round trips to local
#   Supabase (RPCs, sync_push/pull, server boards); 1 also needs the cold
#   boot and real sign-in, and 4 the keyboard and native alerts.
# Jest counterpart: app/__tests__/groups-write-screens.test.tsx (username
#   gate, create, invite, remove), groups-exercise-screens.test.tsx (exercise
#   labels), groups-exercise-link-screen.test.tsx, exercise-picker.test.tsx
#   (linked group rows), groups-screens.test.tsx (cards, friend view),
#   groups-leaderboards-screens.test.tsx, groups-metric-screens.test.tsx,
#   groups-comparison-form.test.tsx (rules preview, the 0-100% bound).
#
# ISOLATION: user_c and user_d are dedicated to this flow (docs/specs/11,
# enforced by scripts/tests/maestro-fixture-users.test.sh; the counterparty
# counts through its MAESTRO_*_COUNTERPARTY_EMAIL var). The lane runner's
# groups-fixture-reset.sh hard-deletes both users' groups and sync rows and
# clears user_c's username before every run, so the username gate always
# prompts and repeated runs in one slot need no Supabase reset.
#
# The stream and leaderboards live on the Groups screen
# (boga3://groups?groupId=<id>, Stream · Leaderboards); the group page
# (boga3://group/<id>) is management only: members, invite, exercises. Every
# "after a refresh" below leaves the Groups screen for My groups and returns,
# so the screen re-reads on focus (a synthetic swipe does not reliably fire
# pull-to-refresh on iOS 26); the counterparty script logs the sync_push ->
# card-visible time (AC4 evidence).

# --- Boot + sign in as user_c (pattern: auth-profile-happy-path.yaml) ---------
# clearState relaunches a wiped dev client that lost its Metro connection:
# re-open the dev-client URL, then dismiss the expo-dev-client intro (Continue)
# and dev menu (Close) that the wipe resurfaces. See auth-profile-happy-path.yaml
# for the iOS-26 accessibility-churn rationale behind waits and retries.
- launchApp:
    clearState: true
- openLink: "${MAESTRO_IOS_DEV_CLIENT_URL}"
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Continue"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Close"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-email-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_EMAIL}"
- tapOn:
    id: "sign-in-password-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_PASSWORD}"
- tapOn:
    id: "sign-in-submit-button"
- assertNotVisible:
    id: "sign-in-screen"
# Lift the first-sync gate and land on a normal route in one harness link.
- openLink: "boga3://maestro-harness?bootstrap=complete&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 60000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: sign-in
      SUPABASE_URL: ${MAESTRO_GROUPS_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${MAESTRO_GROUPS_SUPABASE_ANON_KEY}
      EMAIL: ${MAESTRO_GROUPS_COUNTERPARTY_EMAIL}
      PASSWORD: ${MAESTRO_GROUPS_COUNTERPARTY_PASSWORD}

# --- 1. The username prompt ---------------------------------------------------
# Open Groups by deep link: on iOS 26 a tab tap right after a harness teleport
# can land on the wrong tab.
- openLink: "boga3://groups"
- extendedWaitUntil:
    visible:
      id: "groups-empty-state"
    timeout: 30000
- tapOn:
    id: "groups-empty-create-button"
- extendedWaitUntil:
    visible:
      id: "group-username-gate"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-01-username-prompt"
- tapOn:
    id: "group-username-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_USERNAME}"
- tapOn:
    id: "group-username-save"

# --- 2. Create a group --------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "group-form-name-input"
    timeout: 15000
- tapOn:
    id: "group-form-name-input"
- inputText: "Maestro Groups E2E"
- tapOn:
    id: "group-form-submit"
- extendedWaitUntil:
    visible:
      id: "group-screen-name"
      text: "Maestro Groups E2E"
    timeout: 15000
# The member count is a press target; iOS exposes it as one
# element whose label joins its texts.
- assertVisible:
    id: "group-screen-members-link"
    text: "Members, 1 member · You're the owner"
- waitForAnimationToEnd
- takeScreenshot: "groups-02-group-created"

# --- 3. Read the invite code off the screen -------------------------------------
- tapOn:
    id: "group-screen-invite-button"
- extendedWaitUntil:
    visible:
      id: "group-invite-code"
    timeout: 15000
- copyTextFrom:
    id: "group-invite-code"
- waitForAnimationToEnd
- takeScreenshot: "groups-03-invite-code"

# --- 4. The counterparty joins; "joined" after a refresh ------------------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: join
      CODE: ${maestro.copiedText}
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- assertVisible:
    id: "groups-stream-filter-${output.groupsGroupId}"
- assertNotVisible:
    id: "groups-stream-filter-all"
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- takeScreenshot: "groups-mine-list"
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} joined"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-04-counterparty-joined"
- openLink: "boga3://group/${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "group-screen-members-link"
      text: "Members, 2 members · You're the owner"
    timeout: 15000

# --- 4b. Exercises page: the owner adds, renames, and archives -------------------
# The device (the owner) copies a standard exercise and creates a custom one,
# renames the custom one, and archives the copy, which moves it to the bottom
# marked Archived. Before archiving, it links the copy to its own seeded
# "Barbell Bench Press" through "Link your exercise" (E0.4). An owner's
# row is one pressable element, so it is found by its joined accessibility label
# ("<name>, <weight entry>[, archived], <link status>"); its testID carries the
# server-generated id.
# The group page shows its exercises under the header (no segments).
- extendedWaitUntil:
    visible:
      id: "group-exercises-add-button"
    timeout: 15000
- tapOn:
    id: "group-exercises-add-button"
- extendedWaitUntil:
    visible:
      id: "group-standard-exercise-search"
    timeout: 15000
- tapOn:
    id: "group-standard-exercise-search"
- inputText: "barbell bench"
# Picking a standard exercise dismisses the keyboard and prefills the form.
- tapOn:
    id: "group-standard-exercise-seed_barbell_bench_press"
- extendedWaitUntil:
    visible:
      id: "group-exercise-form-note"
    timeout: 10000
# The picked row stays listed above the prefilled form and its submit.
- assertVisible:
    id: "group-standard-exercise-seed_barbell_bench_press"
- scrollUntilVisible:
    element:
      id: "group-exercise-form-submit"
    direction: DOWN
    centerElement: false
    timeout: 15000
- takeScreenshot: "groups-add-exercise-catalogue"
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Rules 1.*total Weight, Not linked"
    timeout: 15000
- tapOn:
    id: "group-exercises-add-button"
- extendedWaitUntil:
    visible:
      id: "group-exercise-source-custom"
    timeout: 15000
- tapOn:
    id: "group-exercise-source-custom"
- extendedWaitUntil:
    visible:
      id: "group-exercise-form-name-input"
    timeout: 10000
- assertVisible:
    id: "group-exercise-source-custom"
    selected: true
- takeScreenshot: "groups-add-exercise-custom"
# Pick weight entry, then dismiss the name keyboard before scrolling to Save.
- tapOn:
    id: "group-exercise-form-load-mode-per_side_load"
- tapOn:
    id: "group-exercise-form-name-input"
- inputText: "Sled Push"
# A real content drag dismisses iOS decimal/text keyboards without tapping Next.
- swipe:
    start: "50%,40%"
    end: "50%,20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      id: "group-exercise-form-submit"
    direction: DOWN
    centerElement: false
    timeout: 15000
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Sled Push, Rules 1.*per-side Weight, Not linked"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-04b-1-exercises-added"
# Rename the custom exercise.
- tapOn:
    text: "Sled Push, Rules 1.*per-side Weight, Not linked"
- extendedWaitUntil:
    visible:
      id: "group-exercise-action-rename"
    timeout: 10000
- tapOn:
    id: "group-exercise-action-rename"
- extendedWaitUntil:
    visible:
      id: "group-exercise-form-name-input"
    timeout: 15000
- tapOn:
    id: "group-exercise-form-name-input"
- eraseText: 40
- inputText: "Prowler Push"
# A real content drag dismisses iOS decimal/text keyboards without tapping Next.
- swipe:
    start: "50%,40%"
    end: "50%,20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      id: "group-exercise-form-submit"
    direction: DOWN
    centerElement: false
    timeout: 15000
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Prowler Push, Rules 1.*per-side Weight, Not linked"
    timeout: 15000
# Link your exercise (E0.4): the copy suggests the device's own seeded "Barbell
# Bench Press"; Link writes the link locally and starts no session.
- tapOn:
    text: "Link your exercise to Barbell Bench Press"
- extendedWaitUntil:
    visible:
      id: "group-pick-sheet-option-suggested"
    timeout: 10000
- assertVisible:
    id: "group-pick-sheet-retroactivity"
- waitForAnimationToEnd
- takeScreenshot: "groups-04b-2-pick-sheet-link-only"
- tapOn:
    id: "group-pick-sheet-confirm"
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Rules 1.*total Weight, Linked: Barbell Bench Press"
    timeout: 15000
# The catalogue's ⋮ → "Link to group exercise…" opens the Link screen, which
# reads my groups' exercises over RPC and shows the link just made. Then back
# to the group page to archive the copy.
- openLink: "boga3://maestro-harness?teleport=exercise-catalog"
- extendedWaitUntil:
    visible: "Exercise filter input"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Exercise filter input"
- inputText: "Barbell Bench Press"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Exercise actions Barbell Bench Press"
    timeout: 15000
- tapOn: "Exercise actions Barbell Bench Press"
- tapOn:
    id: "exercise-action-link-group"
- extendedWaitUntil:
    visible:
      id: "exercise-link-linked-row-.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: "groups-link-01-link-screen"
- openLink: "boga3://group/${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Rules 1.*total Weight, Linked: Barbell Bench Press"
    timeout: 15000
# Archive the standard copy; the native confirmation Alert's destructive button.
- tapOn:
    text: "Barbell Bench Press, Rules 1.*total Weight, Linked: Barbell Bench Press"
- extendedWaitUntil:
    visible:
      id: "group-exercise-action-archive"
    timeout: 10000
- tapOn:
    id: "group-exercise-action-archive"
- extendedWaitUntil:
    visible:
      text: "Archive"
    timeout: 10000
- tapOn:
    text: "Archive"
- extendedWaitUntil:
    visible:
      id: "group-exercises-action-feedback"
    timeout: 15000
- assertVisible: "Barbell Bench Press was archived\\."
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Rules 1.*total Weight, archived, Linked: Barbell Bench Press"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-04b-3-exercise-linked-renamed-archived"
# A member (the counterparty) reads the same list over group_exercise_list.
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: assert-exercises
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000

# --- 5. Active session -> one "Training now" card with its metrics ---------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-active
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "^group-stream-session-card-${output.groupsCardKey}$"
    timeout: 15000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: latency
      LABEL: active
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-status"
    text: "Training now"
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-member"
    text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-metrics"
    text: "3 sets · 1500 kg · 2 exercises"
# The pre-join session (started a day before joining) is never shared.
- assertNotVisible:
    id: "group-stream-session-card-${output.groupsHistoryCardKey}"
- waitForAnimationToEnd
- takeScreenshot: "groups-05-training-now-card"

# --- 6. Completed, then edited -> the same card, completed + updated metrics ----
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-complete-edit
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "group-stream-session-card-${output.groupsCardKey}-metrics"
      text: "3 sets · 1512.5 kg · 2 exercises"
    timeout: 15000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: latency
      LABEL: completed-edited
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-status"
    text: "Completed · 45m"
- waitForAnimationToEnd
- takeScreenshot: "groups-06-completed-edited-card"

# --- 7. The friend's view: exercises and performed sets, no owner actions -------
# The native back arrow returns to the stream on every visit, not just the first:
# react-native-screens 4.16 on iOS 26 left it dead from the second visit on.
- repeat:
    times: 2
    commands:
      - tapOn:
          id: "^group-stream-session-card-${output.groupsCardKey}$"
      - extendedWaitUntil:
          visible:
            id: "group-session-header"
          timeout: 15000
      - tapOn: "Back"
      - extendedWaitUntil:
          visible:
            id: "groups-stream-list"
          timeout: 10000
- tapOn:
    id: "^group-stream-session-card-${output.groupsCardKey}$"
- extendedWaitUntil:
    visible:
      id: "group-session-header"
    timeout: 15000
- assertVisible:
    id: "group-session-member"
    text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- assertVisible:
    id: "group-session-status"
    text: "Completed · 45m"
# Each exercise is a session-detail card (the View Session restyle, PR C):
# its name, set count and performed sets.
- assertVisible: "Bench Press"
- assertVisible: "Barbell Row"
- assertVisible:
    id: "group-session-set-row-${output.groupsFirstSetId}"
- assertNotVisible:
    id: "completed-session-detail-options-button"
- assertNotVisible:
    id: "completed-session-detail-edit-button"
- assertNotVisible:
    id: "completed-session-detail-delete-button"
- waitForAnimationToEnd
- takeScreenshot: "groups-07-friend-view-read-only"

# --- 7b. Versioned conventional boards and preserved raw input ----------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: link-board
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible: { id: "group-mine-list" }
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible: { id: "groups-segment-leaderboards" }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-07b-6-versioned-stream-link"
- tapOn: { id: "groups-segment-leaderboards" }
- extendedWaitUntil:
    visible: { id: "group-podium-card-${output.groupsBoardExerciseId}" }
    timeout: 20000
- assertVisible: "No certified sets yet · 1 uncertified"
- waitForAnimationToEnd
- takeScreenshot: "groups-07b-1-podiums"
# Back from a board returns to the podiums on every visit (see step 7).
- repeat:
    times: 2
    commands:
      - tapOn: { id: "group-podium-card-${output.groupsBoardExerciseId}" }
      - scrollUntilVisible:
          element: { id: "group-board-see-all-button" }
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn: "Back"
      - extendedWaitUntil:
          visible: { id: "group-podium-card-${output.groupsBoardExerciseId}" }
          timeout: 10000
- tapOn: { id: "group-podium-card-${output.groupsBoardExerciseId}" }
- scrollUntilVisible:
    element: { id: "group-board-see-all-button" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-07b-2-board-certified-empty"
- tapOn: { id: "group-board-see-all-button" }
- scrollUntilVisible:
    element: { id: "group-board-row-1" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-07b-3-board-all-1rm"
# No centerElement: it starts the board, so it never moves (spec 06 rule 3).
- scrollUntilVisible:
    element: { id: "group-board-metric-weight" }
    direction: UP
    timeout: 15000
- tapOn: { id: "group-board-metric-weight" }
- scrollUntilVisible:
    element: { id: "group-board-row-1" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, Weight, 102\\.5 kg, Weight 102\\.5 kg × 5, .*, uncertified, rules revision 1"
- waitForAnimationToEnd
- takeScreenshot: "groups-07b-4-board-all-weight"
- tapOn: { id: "group-board-row-1" }
- extendedWaitUntil:
    visible: { id: "group-metric-record-raw" }
    timeout: 15000
- assertVisible: "As logged: Weight 102\\.5 kg × 5"
# No centerElement: it ends the record sheet, so it never moves (spec 06 rule 3).
- scrollUntilVisible:
    element: { id: "group-metric-record-certify" }
    direction: DOWN
    timeout: 15000
- assertVisible: "Uncertified"
- waitForAnimationToEnd
- takeScreenshot: "groups-07b-7-row-detail"
# Sheet keeps a full tap target below the status bar; its backdrop is hidden
# from the modal accessibility tree, so tap the exposed region directly.
- tapOn: { point: "50%,8%" }
- assertNotVisible: { id: "group-metric-record-sheet" }
# No centerElement: it starts the board, so it never moves (spec 06 rule 3).
- scrollUntilVisible:
    element: { id: "group-board-history-button" }
    direction: UP
    timeout: 15000
- tapOn: { id: "group-board-history-button" }
- scrollUntilVisible:
    element: { text: ".*took #1.*after a link change.*" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-07b-5-history-link"

# --- 7c. Metric-specific certification from a record, preserved in Today -------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-record
- openLink: "boga3://today"
- scrollUntilVisible:
    element: { id: "group-metric-stream-${output.groupsRecordKey}" }
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertNotVisible: { id: "group-metric-record-certify" }
- waitForAnimationToEnd
- takeScreenshot: "groups-07c-0-today-record"
- tapOn: { id: "group-metric-stream-${output.groupsRecordKey}" }
- extendedWaitUntil:
    visible: { id: "groups-segment-stream" }
    timeout: 15000
- tapOn: { id: "groups-segment-stream" }
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible: { id: "group-mine-list" }
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- scrollUntilVisible:
    element: { id: "group-metric-stream-${output.groupsRecordKey}" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-07c-1-record-card"
- tapOn: { id: "group-metric-stream-${output.groupsRecordKey}" }
- extendedWaitUntil:
    visible: { id: "group-metric-record-metric-e1rm" }
    timeout: 15000
- tapOn: { id: "group-metric-record-metric-e1rm" }
# No centerElement: it ends the record sheet, so it never moves (spec 06 rule 3).
- scrollUntilVisible:
    element: { id: "group-metric-record-certify" }
    direction: DOWN
    timeout: 15000
- tapOn: { id: "group-metric-record-certify" }
- extendedWaitUntil:
    visible: { text: "Certified by ${MAESTRO_GROUPS_DEVICE_USERNAME} · .*" }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-07c-2-certified-1rm"
# Each metric has its own dependency pin and attestation.
- scrollUntilVisible:
    element: { id: "group-metric-record-metric-weight" }
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn: { id: "group-metric-record-metric-weight" }
