appId: com.dinoderek.mobile
---
# Two-user groups end to end (M22; docs/specs/tech/groups-contract.md §8, lane
# ios-groups-e2e). The device signs in as fixture user_c and drives the real
# group UI against local Supabase. The counterparty, fixture user_d, is
# scripted over HTTP from ../scripts/groups-counterparty.js (GoTrue sign-in,
# group_join, sync_push, group_stream, group_exercise_list, group_board) — the
# same RPCs its own app would call. M25 steps: 4b group exercises (T08), 7b
# leaderboards and the row detail (T09/T10), 7c a record card certified on the
# device and the Certified boards (T11), 8b the former member's row.
#
# ISOLATION: user_c and user_d are dedicated to this flow (docs/specs/11,
# enforced by scripts/tests/maestro-fixture-users.test.sh; the counterparty
# counts through its MAESTRO_*_COUNTERPARTY_EMAIL var). The lane runner's
# groups-fixture-reset.sh hard-deletes both users' groups and sync rows and
# clears user_c's username before every run, so the username gate always
# prompts and repeated runs in one slot need no Supabase reset.
#
# The stream and leaderboards live on the Groups screen
# (boga3://groups?groupId=<id>, Stream · Leaderboards); the group page
# (boga3://group/<id>) is management only: members, invite, exercises. Every
# "after a refresh" below leaves the Groups screen for My groups and returns,
# so the screen re-reads on focus (a synthetic swipe does not reliably fire
# pull-to-refresh on iOS 26); the counterparty script logs the sync_push ->
# card-visible time (AC4 evidence).

# --- Boot + sign in as user_c (pattern: auth-profile-happy-path.yaml) ---------
# clearState relaunches a wiped dev client that lost its Metro connection:
# re-open the dev-client URL, then dismiss the expo-dev-client intro (Continue)
# and dev menu (Close) that the wipe resurfaces. See auth-profile-happy-path.yaml
# for the iOS-26 accessibility-churn rationale behind waits and retries.
- launchApp:
    clearState: true
- openLink: "${MAESTRO_IOS_DEV_CLIENT_URL}"
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Continue"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Close"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-email-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_EMAIL}"
- tapOn:
    id: "sign-in-password-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_PASSWORD}"
- tapOn:
    id: "sign-in-submit-button"
- assertNotVisible:
    id: "sign-in-screen"
# Lift the first-sync gate and land on a normal route in one harness link.
- openLink: "boga3://maestro-harness?bootstrap=complete&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 60000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: sign-in
      SUPABASE_URL: ${MAESTRO_GROUPS_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${MAESTRO_GROUPS_SUPABASE_ANON_KEY}
      EMAIL: ${MAESTRO_GROUPS_COUNTERPARTY_EMAIL}
      PASSWORD: ${MAESTRO_GROUPS_COUNTERPARTY_PASSWORD}

# --- 1. The username prompt ---------------------------------------------------
# Open Groups by deep link: on iOS 26 a tab tap right after a harness teleport
# can land on the wrong tab.
- openLink: "boga3://groups"
- extendedWaitUntil:
    visible:
      id: "groups-empty-state"
    timeout: 30000
- tapOn:
    id: "groups-empty-create-button"
- extendedWaitUntil:
    visible:
      id: "group-username-gate"
    timeout: 15000
- takeScreenshot: "groups-01-username-prompt"
- tapOn:
    id: "group-username-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_USERNAME}"
- tapOn:
    id: "group-username-save"

# --- 2. Create a group --------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "group-form-name-input"
    timeout: 15000
- tapOn:
    id: "group-form-name-input"
- inputText: "Maestro Groups E2E"
- tapOn:
    id: "group-form-submit"
- extendedWaitUntil:
    visible:
      id: "group-screen-name"
      text: "Maestro Groups E2E"
    timeout: 15000
# The member count is a press target (D14, M25-T08); iOS exposes it as one
# element whose label joins its texts.
- assertVisible:
    id: "group-screen-members-link"
    text: "Members, 1 member · You're the owner"
- takeScreenshot: "groups-02-group-created"

# --- 3. Read the invite code off the screen -------------------------------------
- tapOn:
    id: "group-screen-invite-button"
- extendedWaitUntil:
    visible:
      id: "group-invite-code"
    timeout: 15000
- copyTextFrom:
    id: "group-invite-code"
- takeScreenshot: "groups-03-invite-code"

# --- 4. The counterparty joins; "joined" after a refresh ------------------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: join
      CODE: ${maestro.copiedText}
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- assertVisible:
    id: "groups-stream-filter-${output.groupsGroupId}"
- assertNotVisible:
    id: "groups-stream-filter-all"
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- takeScreenshot: "groups-mine-list"
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} joined"
    timeout: 15000
- takeScreenshot: "groups-04-counterparty-joined"
- openLink: "boga3://group/${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "group-screen-members-link"
      text: "Members, 2 members · You're the owner"
    timeout: 15000

# --- 4b. Exercises page (M25-T08): the owner adds, renames, and archives --------
# The device (the owner) copies a standard exercise and creates a custom one,
# renames the custom one, and archives the copy, which moves it to the bottom
# marked Archived. Before archiving, it links the copy to its own seeded
# "Barbell Bench Press" through "Link your exercise" (E0.4). An owner's
# row is one pressable element, so it is found by its joined accessibility label
# ("<name>, <weight entry>[, archived], <link status>"); its testID carries the
# server-generated id.
# The group page shows its exercises under the header (no segments).
- extendedWaitUntil:
    visible:
      id: "group-exercises-add-button"
    timeout: 15000
- tapOn:
    id: "group-exercises-add-button"
- extendedWaitUntil:
    visible:
      id: "group-standard-exercise-search"
    timeout: 15000
- tapOn:
    id: "group-standard-exercise-search"
- inputText: "barbell bench"
# Picking a standard exercise dismisses the keyboard and prefills the form.
- tapOn:
    id: "group-standard-exercise-seed_barbell_bench_press"
- extendedWaitUntil:
    visible:
      id: "group-exercise-form-note"
    timeout: 10000
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Total load, Not linked"
    timeout: 15000
- tapOn:
    id: "group-exercises-add-button"
- extendedWaitUntil:
    visible:
      id: "group-exercise-source-custom"
    timeout: 15000
- tapOn:
    id: "group-exercise-source-custom"
# Pick the weight entry before typing: on iOS, dismissing the keyboard can submit the form.
- tapOn:
    id: "group-exercise-form-load-mode-per_side_load"
- tapOn:
    id: "group-exercise-form-name-input"
- inputText: "Sled Push"
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Sled Push, Per side, Not linked"
    timeout: 15000
- takeScreenshot: "groups-04b-1-exercises-added"
# Rename the custom exercise.
- tapOn:
    text: "Sled Push, Per side, Not linked"
- extendedWaitUntil:
    visible:
      id: "group-exercise-action-rename"
    timeout: 10000
- tapOn:
    id: "group-exercise-action-rename"
- extendedWaitUntil:
    visible:
      id: "group-exercise-form-name-input"
    timeout: 15000
- tapOn:
    id: "group-exercise-form-name-input"
- eraseText: 40
- inputText: "Prowler Push"
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Prowler Push, Per side, Not linked"
    timeout: 15000
# Link your exercise (E0.4): the copy suggests the device's own seeded "Barbell
# Bench Press"; Link writes the link locally and starts no session.
- tapOn:
    text: "Link your exercise to Barbell Bench Press"
- extendedWaitUntil:
    visible:
      id: "group-pick-sheet-option-suggested"
    timeout: 10000
- assertVisible:
    id: "group-pick-sheet-retroactivity"
- takeScreenshot: "groups-04b-2-pick-sheet-link-only"
- tapOn:
    id: "group-pick-sheet-confirm"
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Total load, Linked: Barbell Bench Press"
    timeout: 15000
# Archive the standard copy; the native confirmation Alert's destructive button.
- tapOn:
    text: "Barbell Bench Press, Total load, Linked: Barbell Bench Press"
- extendedWaitUntil:
    visible:
      id: "group-exercise-action-archive"
    timeout: 10000
- tapOn:
    id: "group-exercise-action-archive"
- extendedWaitUntil:
    visible:
      text: "Archive"
    timeout: 10000
- tapOn:
    text: "Archive"
- extendedWaitUntil:
    visible:
      id: "group-exercises-action-feedback"
    timeout: 15000
- assertVisible: "Barbell Bench Press was archived\\."
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Total load, archived, Linked: Barbell Bench Press"
    timeout: 15000
- takeScreenshot: "groups-04b-3-exercise-linked-renamed-archived"
# A member (the counterparty) reads the same list over group_exercise_list.
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: assert-exercises
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000

# --- 5. Active session -> one "Training now" card with its metrics ---------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-active
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "group-stream-session-card-${output.groupsCardKey}"
    timeout: 15000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: latency
      LABEL: active
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-status"
    text: "Training now"
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-member"
    text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-metrics"
    text: "3 sets · 1500 kg · 2 exercises"
# The pre-join session (started a day before joining) is never shared.
- assertNotVisible:
    id: "group-stream-session-card-${output.groupsHistoryCardKey}"
- takeScreenshot: "groups-05-training-now-card"

# --- 6. Completed, then edited -> the same card, completed + updated metrics ----
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-complete-edit
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "group-stream-session-card-${output.groupsCardKey}-metrics"
      text: "3 sets · 1512.5 kg · 2 exercises"
    timeout: 15000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: latency
      LABEL: completed-edited
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-status"
    text: "Completed · 45m"
- takeScreenshot: "groups-06-completed-edited-card"

# --- 7. The friend's view: exercises and performed sets, no owner actions -------
- tapOn:
    id: "group-stream-session-card-${output.groupsCardKey}"
- extendedWaitUntil:
    visible:
      id: "group-session-header"
    timeout: 15000
- assertVisible:
    id: "group-session-member"
    text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- assertVisible:
    id: "group-session-status"
    text: "Completed · 45m"
# Each exercise is a session-detail card (the View Session restyle, PR C):
# its name, set count and performed sets.
- assertVisible: "Bench Press"
- assertVisible: "Barbell Row"
- assertVisible:
    id: "group-session-set-row-${output.groupsFirstSetId}"
- assertNotVisible:
    id: "completed-session-detail-options-button"
- assertNotVisible:
    id: "completed-session-detail-edit-button"
- assertNotVisible:
    id: "completed-session-detail-delete-button"
- takeScreenshot: "groups-07-friend-view-read-only"

# --- 7b. Leaderboards (M25-T09): podiums, full board, history ---------------------
# The counterparty links its Bench Press to the active custom exercise (Prowler
# Push, per side); the script waits until the evaluator has written the board.
# Podium cards and board rows are one accessibility element each, found by their
# joined labels (product E1.1–E1.3).
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: link-board
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-segment-leaderboards"
    timeout: 15000
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
# The link moved the boards, so the stream gets a link item (P16, M25-T10); no
# record card, since the sets predate the link.
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} linked Bench Press to Prowler Push — now #1 on Weight and 1RM"
    timeout: 15000
- takeScreenshot: "groups-07b-6-stream-link-item"
- tapOn:
    id: "groups-segment-leaderboards"
# Certified boards are empty until M25-T06: the uncertified count shows instead.
- extendedWaitUntil:
    visible:
      text: "Prowler Push, Certified · 1RM, No certified sets yet · 1 uncertified"
    timeout: 20000
# The archived copy sits last; nothing is shared under it.
- assertVisible:
    text: "Barbell Bench Press, archived, Certified · 1RM, No sets yet"
- takeScreenshot: "groups-07b-1-podiums"
- tapOn:
    text: "Prowler Push, Certified · 1RM, No certified sets yet · 1 uncertified"
- extendedWaitUntil:
    visible:
      id: "group-board-see-all-button"
    timeout: 15000
- assertVisible: "No certified sets yet"
- takeScreenshot: "groups-07b-2-board-certified-empty"
- tapOn:
    id: "group-board-see-all-button"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 1RM [0-9.]+, 51\\.25 × 5, .*, uncertified"
    timeout: 15000
- takeScreenshot: "groups-07b-3-board-all-e1rm"
# Weight: 102.5 kg total logged, converted to 51.25 kg per side (D6).
- tapOn:
    id: "group-board-metric-weight"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 51\\.25 × 5, .*, uncertified"
    timeout: 15000
- takeScreenshot: "groups-07b-4-board-all-weight"
# The row detail (E2, M25-T10): the converted value with the as-logged one, the
# lifter's exercise, and Certify for the owner (not the lifter). Certifying is
# step 7c (M25-T11).
- tapOn:
    text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 51\\.25 × 5, .*, uncertified"
- extendedWaitUntil:
    visible:
      id: "group-record-sheet"
    timeout: 10000
- assertVisible:
    id: "group-record-sheet-logged"
    text: "Logged 102\\.5 kg total · counted as 51\\.25 kg per side"
- extendedWaitUntil:
    visible:
      id: "group-record-sheet-logged-as"
      text: "Logged as \"Bench Press\""
    timeout: 15000
- assertVisible:
    id: "group-record-sheet-status"
    text: "Not certified yet"
- assertVisible:
    id: "group-record-sheet-certify"
- takeScreenshot: "groups-07b-7-row-detail"
# No Close (G5): tap the dimmed backdrop above the sheet, by point (the
# backdrop is hidden from accessibility on iOS 26).
- tapOn:
    point: "50%,12%"
- assertNotVisible:
    id: "group-record-sheet"
- tapOn:
    id: "group-board-history-button"
- extendedWaitUntil:
    visible:
      text: ".*, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} took #1 · 51\\.25 kg \\(linked Bench Press\\)"
    timeout: 15000
- takeScreenshot: "groups-07b-5-history-link"

# --- 7c. A record card, certified on the device (M25-T11) ------------------------
# The counterparty logs a new best on the linked Bench Press (110 kg × 5 total =
# 55 kg × 5 per side) in a new session; the script waits for the final record
# item. Its set was created after the link, so it is a record, not a link effect
# (contract §2.11). Certifying must precede step 8: a former member's set can't be
# certified (§4.6).
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-record
# Today's Group activity shows the record, read-only (no Certify); it opens
# the Groups screen on the record's group.
- openLink: "boga3://today"
# centerElement is mandatory here: without it scrollUntilVisible stops as soon as
# Maestro calls the element visible — which for a card already in the view
# hierarchy can be immediately, leaving it past the fold. The assertNotVisible
# below would then pass vacuously instead of proving the read-only view has no
# Certify. (visibilityPercentage: 100 is Maestro's default; it is spelled out for
# readability and changes nothing on its own.)
- scrollUntilVisible:
    element:
      id: "group-stream-record-card-${output.groupsRecordKey}-title"
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} — group record"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 20000
- assertNotVisible:
    id: "group-stream-record-card-${output.groupsRecordKey}-certify"
- takeScreenshot: "groups-07c-0-today-record"
- tapOn:
    id: "group-stream-record-card-${output.groupsRecordKey}-open"
# The link names the group already shown (same ?groupId=), so the screen keeps
# its last segment (Leaderboards, from 7b): pick Stream explicitly.
- extendedWaitUntil:
    visible:
      id: "groups-segment-stream"
    timeout: 15000
- tapOn:
    id: "groups-segment-stream"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "group-stream-record-card-${output.groupsRecordKey}-title"
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} — group record"
    timeout: 15000
- assertVisible:
    id: "group-stream-record-card-${output.groupsRecordKey}-value"
    text: "Prowler Push\\s+55\\.0 × 5 · 1RM [0-9.]+"
- assertVisible:
    id: "group-stream-record-card-${output.groupsRecordKey}-status"
    text: "Not certified yet"
- assertVisible:
    id: "group-stream-session-card-${output.groupsRecordSessionCardKey}-records"
    text: "1 record"
- takeScreenshot: "groups-07c-1-record-card"
# Certify from the card (D3: a record set). The notice shows at once; the card
# reads the returned certification until the host's re-read agrees.
- tapOn:
    id: "group-stream-record-card-${output.groupsRecordKey}-certify"
# The notice View carries the testID; its sentence is a child text.
- extendedWaitUntil:
    visible:
      id: "group-stream-record-card-${output.groupsRecordKey}-notice"
    timeout: 15000
- assertVisible: "Certified\\. Certified boards update in a few seconds\\."
- extendedWaitUntil:
    visible:
      id: "group-stream-record-card-${output.groupsRecordKey}-status"
      text: "Certified by you"
    timeout: 15000
- assertNotVisible:
    id: "group-stream-record-card-${output.groupsRecordKey}-certify"
- takeScreenshot: "groups-07c-2-certified-card"
# The Certified entry waits for the evaluator: the script polls until it exists,
# so the board reads below never race the apply.
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: await-certified
- tapOn:
    id: "groups-segment-leaderboards"
- extendedWaitUntil:
    visible:
      text: "Prowler Push, Certified · 1RM, 1st ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} [0-9.]+ .*"
    timeout: 20000
- takeScreenshot: "groups-07c-3-podium-certified"
- tapOn:
    text: "Prowler Push, Certified · 1RM, 1st ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} [0-9.]+ .*"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 1RM [0-9.]+, 55\\.0 × 5, .*"
    timeout: 15000
- tapOn:
    id: "group-board-metric-weight"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 55\\.0 × 5, .*"
    timeout: 15000
- takeScreenshot: "groups-07c-4-board-certified-weight"
- tapOn:
    id: "group-board-history-button"
- extendedWaitUntil:
    visible:
      text: ".*, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} took #1 · 55 kg \\(certified by you\\)"
    timeout: 15000
- takeScreenshot: "groups-07c-5-history-certified"
# On All the row is marked certified; its sheet offers the certifier's withdraw,
# not Certify. Withdraw/cancel taps are covered by groups-certification.sh + jest.
- openLink: "boga3://group/${output.groupsGroupId}/leaderboards/${output.groupsBoardExerciseId}?metric=weight&scope=all"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 55\\.0 × 5, .*, certified"
    timeout: 15000
- tapOn:
    text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 55\\.0 × 5, .*, certified"
- extendedWaitUntil:
    visible:
      id: "group-record-sheet"
    timeout: 10000
- assertVisible:
    id: "group-record-sheet-status"
    text: "Certified by you · .*"
- assertVisible:
    id: "group-record-sheet-withdraw"
- assertNotVisible:
    id: "group-record-sheet-certify"
- takeScreenshot: "groups-07c-6-row-detail-certified"
# No Close (G5): tap the dimmed backdrop above the sheet, by point (the
# backdrop is hidden from accessibility on iOS 26).
- tapOn:
    point: "50%,12%"
- assertNotVisible:
    id: "group-record-sheet"

# --- 7d. Unlink my certified exercise: cancel, unlink, preserve, relink ---------
# Both mappings are the DEVICE user's; the counterparty attests its completed
# set. Only the actual unlink/relink happens through UI + normal device sync.
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: prepare-device-unlink
      EMAIL: ${MAESTRO_GROUPS_DEVICE_EMAIL}
      PASSWORD: ${MAESTRO_GROUPS_DEVICE_PASSWORD}
# Pull the fixture through real sync. A focus retry accommodates a cycle
# already in flight when Refresh is tapped; local link reads happen on focus.
- retry:
    maxRetries: 3
    commands:
      - openLink: "boga3://settings"
      - extendedWaitUntil:
          visible:
            id: "settings-screen"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "settings-sync-status-refresh-button"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "settings-sync-status-refresh-button"
      - openLink: "boga3://group/${output.groupsGroupId}"
      - extendedWaitUntil:
          visible:
            id: "group-screen-name"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "group-exercise-unlink-button-${output.unlinkGroupExerciseId}"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - assertVisible: "Unlink Bench, Total load, Linked: Bench \\(competition\\), Bench \\(training\\)"
- takeScreenshot: "groups-unlink-01-linked-row"
- tapOn:
    id: "group-exercise-unlink-button-${output.unlinkGroupExerciseId}"
- extendedWaitUntil:
    visible:
      id: "group-unlink-chooser"
    timeout: 10000
- assertVisible: "Your linked exercises"
- assertVisible: "Unlink Bench · Maestro Groups E2E"
- takeScreenshot: "groups-unlink-02-chooser"
- tapOn:
    id: "group-unlink-choice-${output.unlinkPrimaryId}"
- extendedWaitUntil:
    visible: "Unlink “Bench \\(competition\\)”\\?"
    timeout: 10000
- assertVisible: ".*both All and Certified leaderboards.*Past activity and existing certifications will be kept.*"
- takeScreenshot: "groups-unlink-03-confirmation"
- tapOn: "Cancel"
- assertVisible:
    id: "group-exercise-unlink-button-${output.unlinkGroupExerciseId}"
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: assert-unlink-cancelled
# Confirm exactly one mapping, then prove the second still appears locally.
- tapOn:
    id: "group-exercise-unlink-button-${output.unlinkGroupExerciseId}"
- tapOn:
    id: "group-unlink-choice-${output.unlinkPrimaryId}"
- extendedWaitUntil:
    visible: "Unlink “Bench \\(competition\\)”\\?"
    timeout: 10000
- tapOn: "Unlink"
- extendedWaitUntil:
    visible:
      text: "Unlink Bench, Total load, Linked: Bench \\(training\\)"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "group-exercises-action-feedback"
    direction: UP
    centerElement: true
- assertVisible: "Unlinked “Bench \\(competition\\)” from “Unlink Bench”\\."
- takeScreenshot: "groups-unlink-04-success"
- openLink: "boga3://settings"
- scrollUntilVisible:
    element:
      id: "settings-sync-status-refresh-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-sync-status-refresh-button"
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: assert-device-unlinked
# The same completed record card remains certified and opens its detail.
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- tapOn:
    id: "groups-segment-stream"
- extendedWaitUntil:
    visible:
      id: "group-stream-record-card-${output.unlinkRecordKey}-open"
    timeout: 15000
- assertVisible:
    id: "group-stream-record-card-${output.unlinkRecordKey}-status"
    text: "Certified by ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- takeScreenshot: "groups-unlink-05-preserved-record"
- tapOn:
    id: "group-stream-record-card-${output.unlinkRecordKey}-open"
- assertVisible:
    id: "group-record-sheet-status"
    text: "Certified by ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} · .*"
# No Close (G5): tap the dimmed backdrop above the sheet, by point (the
# backdrop is hidden from accessibility on iOS 26).
- tapOn:
    point: "50%,12%"
- assertNotVisible:
    id: "group-record-sheet"
# Both All and Certified have lost this exercise's contribution.
- openLink: "boga3://group/${output.groupsGroupId}/leaderboards/${output.unlinkGroupExerciseId}?metric=weight&scope=all"
- extendedWaitUntil:
    visible: "No sets yet"
    timeout: 15000
- tapOn:
    id: "group-board-scope-certified"
- assertVisible: "No certified sets yet"
- takeScreenshot: "groups-unlink-06-certified-empty"
# Relink the same personal exercise through the existing Link screen. The
# group's other mapping stays intact, so its row correctly never says Not linked.
- openLink: "boga3://exercise-link?exerciseDefinitionId=${output.unlinkPrimaryId}"
- extendedWaitUntil:
    visible:
      id: "exercise-link-link-${output.unlinkGroupExerciseId}"
    timeout: 15000
- tapOn:
    id: "exercise-link-link-${output.unlinkGroupExerciseId}"
- extendedWaitUntil:
    visible:
      id: "exercise-link-unlink-${output.unlinkGroupExerciseId}"
    timeout: 15000
- openLink: "boga3://settings"
- scrollUntilVisible:
    element:
      id: "settings-sync-status-refresh-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-sync-status-refresh-button"
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: assert-device-relinked
- openLink: "boga3://group/${output.groupsGroupId}/leaderboards/${output.unlinkGroupExerciseId}?metric=weight&scope=certified"
- extendedWaitUntil:
    visible:
      id: "group-board-row-1"
      text: "1st, You, 80\\.0 × 5, .*"
    timeout: 15000
- takeScreenshot: "groups-unlink-07-restored-certified"

# --- 8. The device removes the counterparty -> "was removed" -------------------
- openLink: "boga3://group/${output.groupsGroupId}"
# Members live behind the header's member count (D14, M25-T08).
- extendedWaitUntil:
    visible:
      id: "group-screen-members-link"
    timeout: 15000
- tapOn:
    id: "group-screen-members-link"
- extendedWaitUntil:
    visible:
      id: "group-members-list"
    timeout: 15000
- takeScreenshot: "groups-members-list"
- tapOn:
    id: "group-member-row-${output.groupsCounterpartyUserId}"
- extendedWaitUntil:
    visible:
      id: "group-member-actions-sheet"
    timeout: 10000
- takeScreenshot: "groups-member-actions-sheet"
- tapOn:
    id: "group-member-action-remove"
# The native confirmation Alert's destructive button.
- extendedWaitUntil:
    visible:
      text: "Remove"
    timeout: 10000
- tapOn:
    text: "Remove"
# The feedback View carries the testID; its sentence is a child text.
- extendedWaitUntil:
    visible:
      id: "group-members-action-feedback"
    timeout: 15000
- assertVisible: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} was removed\\."
- assertVisible:
    id: "group-members-meta"
    text: "1 member · You're the owner"
- assertNotVisible:
    id: "group-member-row-${output.groupsCounterpartyUserId}"
- takeScreenshot: "groups-members-removed"
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-segment-stream"
    timeout: 15000
- tapOn:
    id: "groups-segment-stream"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} was removed"
    timeout: 15000
# What the removed member shared stays in the group record (decision #4).
- scrollUntilVisible:
    element:
      id: "group-stream-session-card-${output.groupsCardKey}"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}"
- takeScreenshot: "groups-08-counterparty-removed"

# --- 8b. A removed member stays ranked, marked former (P7, M25-T09) -------------
- openLink: "boga3://group/${output.groupsGroupId}/leaderboards/${output.groupsBoardExerciseId}?metric=weight&scope=all"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} \\(former\\), 55\\.0 × 5, .*, certified"
    timeout: 15000
- takeScreenshot: "groups-08b-board-former-member"
# A former member's set can't be certified (§4.6 step 5): the sheet offers no
# Certify. The certification given in 7c still stands (P7: former entries stay).
- tapOn:
    text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} \\(former\\), 55\\.0 × 5, .*, certified"
- extendedWaitUntil:
    visible:
      id: "group-record-sheet"
    timeout: 10000
- assertVisible:
    id: "group-record-sheet-status"
    text: "Certified by you · .*"
- assertNotVisible:
    id: "group-record-sheet-certify"
- takeScreenshot: "groups-08b-2-row-detail-former"
# No Close (G5): tap the dimmed backdrop above the sheet, by point (the
# backdrop is hidden from accessibility on iOS 26).
- tapOn:
    point: "50%,12%"
- assertNotVisible:
    id: "group-record-sheet"

# --- 9. The removed counterparty's next read is NOT_FOUND (AC11) ----------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: assert-removed
- takeScreenshot: "groups-09-removed-member-not-found"
