appId: com.dinoderek.mobile
---
# Two-user groups end to end (M22; docs/specs/tech/groups-contract.md §8, lane
# ios-groups-e2e). The device signs in as fixture user_c and drives the real
# group UI against local Supabase. The counterparty, fixture user_d, is
# scripted over HTTP from ../scripts/groups-counterparty.js (GoTrue sign-in,
# group_join, sync_push, group_stream) — the same RPCs its own app would call.
#
# ISOLATION: user_c and user_d are dedicated to this flow (docs/specs/11,
# enforced by scripts/tests/maestro-fixture-users.test.sh; the counterparty
# counts through its MAESTRO_*_COUNTERPARTY_EMAIL var). The lane runner's
# groups-fixture-reset.sh hard-deletes both users' groups and sync rows and
# clears user_c's username before every run, so the username gate always
# prompts and repeated runs in one slot need no Supabase reset.
#
# Every "after a refresh" below is one pull-to-refresh on the group screen; the
# counterparty script logs the sync_push -> card-visible time (AC4 evidence).

# --- Boot + sign in as user_c (pattern: auth-profile-happy-path.yaml) ---------
# clearState relaunches a wiped dev client that lost its Metro connection:
# re-open the dev-client URL, then dismiss the expo-dev-client intro (Continue)
# and dev menu (Close) that the wipe resurfaces. See auth-profile-happy-path.yaml
# for the iOS-26 accessibility-churn rationale behind waits and retries.
- launchApp:
    clearState: true
- openLink: "${MAESTRO_IOS_DEV_CLIENT_URL}"
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Continue"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Close"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-email-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_EMAIL}"
- tapOn:
    id: "sign-in-password-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_PASSWORD}"
- tapOn:
    id: "sign-in-submit-button"
- assertNotVisible:
    id: "sign-in-screen"
# Lift the first-sync gate and land on a normal route in one harness link.
- openLink: "boga3://maestro-harness?bootstrap=complete&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 60000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: sign-in
      SUPABASE_URL: ${MAESTRO_GROUPS_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${MAESTRO_GROUPS_SUPABASE_ANON_KEY}
      EMAIL: ${MAESTRO_GROUPS_COUNTERPARTY_EMAIL}
      PASSWORD: ${MAESTRO_GROUPS_COUNTERPARTY_PASSWORD}

# --- 1. The username prompt ---------------------------------------------------
# Open Groups by deep link: on iOS 26 a tab tap right after a harness teleport
# can land on the wrong tab.
- openLink: "boga3://groups"
- extendedWaitUntil:
    visible:
      id: "groups-empty-state"
    timeout: 30000
- tapOn:
    id: "groups-empty-create-button"
- extendedWaitUntil:
    visible:
      id: "group-username-gate"
    timeout: 15000
- takeScreenshot: "groups-01-username-prompt"
- tapOn:
    id: "group-username-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_USERNAME}"
- tapOn:
    id: "group-username-save"

# --- 2. Create a group --------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "group-form-name-input"
    timeout: 15000
- tapOn:
    id: "group-form-name-input"
- inputText: "Maestro Groups E2E"
- tapOn:
    id: "group-form-submit"
- extendedWaitUntil:
    visible:
      id: "group-screen-name"
      text: "Maestro Groups E2E"
    timeout: 15000
# The member count is a press target (D14, M25-T08); iOS exposes it as one
# element whose label joins its texts.
- assertVisible:
    id: "group-screen-members-link"
    text: "Members, 1 member · You're the owner"
- takeScreenshot: "groups-02-group-created"

# --- 3. Read the invite code off the screen -------------------------------------
- tapOn:
    id: "group-screen-invite-button"
- extendedWaitUntil:
    visible:
      id: "group-invite-code"
    timeout: 15000
- copyTextFrom:
    id: "group-invite-code"
- takeScreenshot: "groups-03-invite-code"

# --- 4. The counterparty joins; "joined" after a refresh ------------------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: join
      CODE: ${maestro.copiedText}
- openLink: "boga3://group/${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "group-screen-stream-list"
    timeout: 15000
- swipe:
    start: "50%, 45%"
    end: "50%, 85%"
    duration: 800
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} joined"
    timeout: 15000
- assertVisible:
    id: "group-screen-members-link"
    text: "Members, 2 members · You're the owner"
- takeScreenshot: "groups-04-counterparty-joined"

# --- 4b. Exercises page (M25-T08): the owner adds, renames, and archives --------
# The device (the owner) copies a standard exercise and creates a custom one,
# renames the custom one, and archives the copy, which moves it to the bottom
# marked Archived. Before archiving, it links the copy to its own seeded
# "Barbell Bench Press" through "Link your exercise" (E0.4). An owner's
# row is one pressable element, so it is found by its joined accessibility label
# ("<name>, <weight entry>[, archived], <link status>"); its testID carries the
# server-generated id.
- tapOn:
    id: "group-screen-segment-exercises"
- extendedWaitUntil:
    visible:
      id: "group-exercises-add-button"
    timeout: 15000
- tapOn:
    id: "group-exercises-add-button"
- extendedWaitUntil:
    visible:
      id: "group-standard-exercise-search"
    timeout: 15000
- tapOn:
    id: "group-standard-exercise-search"
- inputText: "barbell bench"
# Picking a standard exercise dismisses the keyboard and prefills the form.
- tapOn:
    id: "group-standard-exercise-seed_barbell_bench_press"
- extendedWaitUntil:
    visible:
      id: "group-exercise-form-note"
    timeout: 10000
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Total load, Not linked"
    timeout: 15000
- tapOn:
    id: "group-exercises-add-button"
- extendedWaitUntil:
    visible:
      id: "group-exercise-source-custom"
    timeout: 15000
- tapOn:
    id: "group-exercise-source-custom"
# Pick the weight entry before typing: on iOS, dismissing the keyboard can submit the form.
- tapOn:
    id: "group-exercise-form-load-mode-per_side_load"
- tapOn:
    id: "group-exercise-form-name-input"
- inputText: "Sled Push"
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Sled Push, Per side, Not linked"
    timeout: 15000
- takeScreenshot: "groups-04b-1-exercises-added"
# Rename the custom exercise.
- tapOn:
    text: "Sled Push, Per side, Not linked"
- extendedWaitUntil:
    visible:
      id: "group-exercise-action-rename"
    timeout: 10000
- tapOn:
    id: "group-exercise-action-rename"
- extendedWaitUntil:
    visible:
      id: "group-exercise-form-name-input"
    timeout: 15000
- tapOn:
    id: "group-exercise-form-name-input"
- eraseText: 40
- inputText: "Prowler Push"
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Prowler Push, Per side, Not linked"
    timeout: 15000
# Link your exercise (E0.4): the copy suggests the device's own seeded "Barbell
# Bench Press"; Link writes the link locally and starts no session.
- tapOn:
    text: "Link your exercise to Barbell Bench Press"
- extendedWaitUntil:
    visible:
      id: "group-pick-sheet-option-suggested"
    timeout: 10000
- assertVisible:
    id: "group-pick-sheet-retroactivity"
- takeScreenshot: "groups-04b-2-pick-sheet-link-only"
- tapOn:
    id: "group-pick-sheet-confirm"
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Total load, Linked: Barbell Bench Press"
    timeout: 15000
# Archive the standard copy; the native confirmation Alert's destructive button.
- tapOn:
    text: "Barbell Bench Press, Total load, Linked: Barbell Bench Press"
- extendedWaitUntil:
    visible:
      id: "group-exercise-action-archive"
    timeout: 10000
- tapOn:
    id: "group-exercise-action-archive"
- extendedWaitUntil:
    visible:
      text: "Archive"
    timeout: 10000
- tapOn:
    text: "Archive"
- extendedWaitUntil:
    visible:
      id: "group-exercises-action-feedback"
    timeout: 15000
- assertVisible: "Barbell Bench Press was archived\\."
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, Total load, archived, Linked: Barbell Bench Press"
    timeout: 15000
- takeScreenshot: "groups-04b-3-exercise-linked-renamed-archived"
# A member (the counterparty) reads the same list over group_exercise_list.
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: assert-exercises
- tapOn:
    id: "group-screen-segment-stream"
- extendedWaitUntil:
    visible:
      id: "group-screen-stream-list"
    timeout: 15000

# --- 5. Active session -> one "Training now" card with its metrics ---------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-active
- swipe:
    start: "50%, 45%"
    end: "50%, 85%"
    duration: 800
- extendedWaitUntil:
    visible:
      id: "group-stream-session-card-${output.groupsCardKey}"
    timeout: 15000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: latency
      LABEL: active
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-status"
    text: "Training now"
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-member"
    text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-metrics"
    text: "3 sets · 1,500 kg · 2 exercises"
# The pre-join session (started a day before joining) is never shared.
- assertNotVisible:
    id: "group-stream-session-card-${output.groupsHistoryCardKey}"
- takeScreenshot: "groups-05-training-now-card"

# --- 6. Completed, then edited -> the same card, completed + updated metrics ----
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-complete-edit
- swipe:
    start: "50%, 45%"
    end: "50%, 85%"
    duration: 800
- extendedWaitUntil:
    visible:
      id: "group-stream-session-card-${output.groupsCardKey}-metrics"
      text: "3 sets · 1,512.5 kg · 2 exercises"
    timeout: 15000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: latency
      LABEL: completed-edited
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-status"
    text: "Completed · 45m"
- takeScreenshot: "groups-06-completed-edited-card"

# --- 7. The friend's view: exercises and performed sets, no owner actions -------
- tapOn:
    id: "group-stream-session-card-${output.groupsCardKey}"
- extendedWaitUntil:
    visible:
      id: "group-session-header"
    timeout: 15000
- assertVisible:
    id: "group-session-member"
    text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- assertVisible:
    id: "group-session-status"
    text: "Completed · 45m"
# Exercise titles sit inside the shared layout's collapse toggle, whose
# accessibility label is what iOS exposes.
- assertVisible:
    id: "exercise-collapse-toggle-1"
    text: "Collapse exercise Bench Press"
- assertVisible:
    id: "exercise-collapse-toggle-2"
    text: "Collapse exercise Barbell Row"
- assertVisible:
    id: "group-session-set-row-${output.groupsFirstSetId}"
- assertNotVisible:
    id: "completed-session-detail-action-bar"
- assertNotVisible:
    id: "completed-session-detail-edit-button"
- assertNotVisible:
    id: "completed-session-detail-delete-button"
- takeScreenshot: "groups-07-friend-view-read-only"

# --- 7b. Leaderboards (M25-T09): podiums, full board, history ---------------------
# The counterparty links its Bench Press to the active custom exercise (Prowler
# Push, per side); the script waits until the evaluator has written the board.
# Podium cards and board rows are one accessibility element each, found by their
# joined labels (product E1.1–E1.3).
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: link-board
- openLink: "boga3://group/${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "group-screen-segment-leaderboards"
    timeout: 15000
# The link moved the boards, so the stream gets a link item (P16, M25-T10); no
# record card, since the sets predate the link.
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} linked Bench Press to Prowler Push — now #1 on Weight and e1RM"
    timeout: 15000
- takeScreenshot: "groups-07b-6-stream-link-item"
- tapOn:
    id: "group-screen-segment-leaderboards"
# Certified boards are empty until M25-T06: the uncertified count shows instead.
- extendedWaitUntil:
    visible:
      text: "Prowler Push, Certified · e1RM, No certified sets yet · 1 uncertified"
    timeout: 20000
# The archived copy sits last; nothing is shared under it.
- assertVisible:
    text: "Barbell Bench Press, archived, Certified · e1RM, No sets yet"
- takeScreenshot: "groups-07b-1-podiums"
- tapOn:
    text: "Prowler Push, Certified · e1RM, No certified sets yet · 1 uncertified"
- extendedWaitUntil:
    visible:
      id: "group-board-see-all-button"
    timeout: 15000
- assertVisible: "No certified sets yet"
- takeScreenshot: "groups-07b-2-board-certified-empty"
- tapOn:
    id: "group-board-see-all-button"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, .* e1RM, 51\\.25 kg × 5, .*, uncertified"
    timeout: 15000
- takeScreenshot: "groups-07b-3-board-all-e1rm"
# Weight: 102.5 kg total logged, converted to 51.25 kg per side (D6).
- tapOn:
    id: "group-board-metric-weight"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 51\\.25 kg × 5, .*, uncertified"
    timeout: 15000
- takeScreenshot: "groups-07b-4-board-all-weight"
# The row detail (E2, M25-T10): the converted value with the as-logged one, the
# lifter's exercise, and Certify for the owner (not the lifter). Certifying is
# M25-T11's extension.
- tapOn:
    text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}, 51\\.25 kg × 5, .*, uncertified"
- extendedWaitUntil:
    visible:
      id: "group-record-sheet"
    timeout: 10000
- assertVisible:
    id: "group-record-sheet-logged"
    text: "Logged 102\\.5 kg total · counted as 51\\.25 kg per side"
- extendedWaitUntil:
    visible:
      id: "group-record-sheet-logged-as"
      text: "Logged as \"Bench Press\""
    timeout: 15000
- assertVisible:
    id: "group-record-sheet-status"
    text: "○ Not certified yet"
- assertVisible:
    id: "group-record-sheet-certify"
- takeScreenshot: "groups-07b-7-row-detail"
- tapOn:
    id: "group-record-sheet-close"
- assertNotVisible:
    id: "group-record-sheet"
- tapOn:
    id: "group-board-history-button"
- extendedWaitUntil:
    visible:
      text: ".*, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} took #1 · 51\\.25 kg \\(linked Bench Press\\)"
    timeout: 15000
- takeScreenshot: "groups-07b-5-history-link"

# --- 8. The device removes the counterparty -> "was removed" -------------------
- openLink: "boga3://group/${output.groupsGroupId}"
# Members live behind the header's member count (D14, M25-T08).
- extendedWaitUntil:
    visible:
      id: "group-screen-members-link"
    timeout: 15000
- tapOn:
    id: "group-screen-members-link"
- extendedWaitUntil:
    visible:
      id: "group-members-list"
    timeout: 15000
- tapOn:
    id: "group-member-row-${output.groupsCounterpartyUserId}"
- extendedWaitUntil:
    visible:
      id: "group-member-actions-sheet"
    timeout: 10000
- tapOn:
    id: "group-member-action-remove"
# The native confirmation Alert's destructive button.
- extendedWaitUntil:
    visible:
      text: "Remove"
    timeout: 10000
- tapOn:
    text: "Remove"
# The feedback View carries the testID; its sentence is a child text.
- extendedWaitUntil:
    visible:
      id: "group-members-action-feedback"
    timeout: 15000
- assertVisible: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} was removed\\."
- assertVisible:
    id: "group-members-meta"
    text: "1 member · You're the owner"
- assertNotVisible:
    id: "group-member-row-${output.groupsCounterpartyUserId}"
- openLink: "boga3://group/${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "group-screen-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} was removed"
    timeout: 15000
# What the removed member shared stays in the group record (decision #4).
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}"
- takeScreenshot: "groups-08-counterparty-removed"

# --- 8b. A removed member stays ranked, marked former (P7, M25-T09) -------------
- openLink: "boga3://group/${output.groupsGroupId}/leaderboards/${output.groupsBoardExerciseId}?metric=weight&scope=all"
- extendedWaitUntil:
    visible:
      text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} \\(former\\), 51\\.25 kg × 5, .*, uncertified"
    timeout: 15000
- takeScreenshot: "groups-08b-board-former-member"
# A former member's set can't be certified (§4.6 step 5): the sheet offers no Certify.
- tapOn:
    text: "1st, ${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} \\(former\\), 51\\.25 kg × 5, .*, uncertified"
- extendedWaitUntil:
    visible:
      id: "group-record-sheet"
    timeout: 10000
- assertVisible:
    id: "group-record-sheet-status"
    text: "○ Not certified yet"
- assertNotVisible:
    id: "group-record-sheet-certify"
- takeScreenshot: "groups-08b-2-row-detail-former"
- tapOn:
    id: "group-record-sheet-close"

# --- 9. The removed counterparty's next read is NOT_FOUND (AC11) ----------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: assert-removed
- takeScreenshot: "groups-09-removed-member-not-found"
