appId: com.dinoderek.mobile
---
# Two-user groups on a device (docs/specs/tech/groups-contract.md; lane
# ios-groups-e2e). The device signs in as fixture user_c and drives the real
# group UI against local Supabase; the counterparty, fixture user_d, is
# scripted over HTTP from ../scripts/groups-counterparty.js (GoTrue sign-in,
# group_join, sync_push) with the calls its own app would make.
#
# A thin pass: the server rules (share rule, stream, boards, certification,
# link effects, bodyweight, removal) are the backend lanes', and every call of
# the app's groups client against the live server is groups-api-live's. This
# flow keeps what only a device shows.
#
# Proves:
#   1. a cold, wiped launch reaches sign-in, user_c signs in, and the username
#      prompt takes a typed username;
#   2. creating a group through the keyboard form opens its page
#      (`1 member · You're the owner`), and its invite code is read off screen;
#   3. the counterparty joins with that code, and the device shows `joined` and
#      two members after a refresh on focus;
#   4. a custom group exercise is added through the form (keyboard dismissed
#      by a content drag);
#   5. the counterparty's active session reaches the device as a `Training now`
#      card; its friend view is read-only, and the native back returns to the
#      stream on every visit;
#   6. on Leaderboards, the counterparty's linked set opens from its board row
#      in a sheet, certifying it there writes `Certified by <user_c>`, and the
#      sheet closes on its backdrop;
#   7. removing the counterparty through the native confirmation alert shows
#      `was removed` and one member.
# Why device: two real users and real round trips through the app; 1 the cold
#   boot, real sign-in and keyboard; 3 the focus refresh; 4 the keyboard;
#   5 react-native-screens' native back (it went dead from the second visit on
#   iOS 26); 6 the sheet and its backdrop; 7 the native alert.
# Jest counterpart: __tests__/groups-api-live.test.ts (lane groups-api-live:
#   every groups client call against the live server),
#   groups-write-screens.test.tsx (username gate, create, invite, remove),
#   groups-exercise-screens.test.tsx, groups-exercise-link-screen.test.tsx,
#   exercise-picker.test.tsx (linked group rows), groups-screens.test.tsx
#   (cards, friend view), groups-leaderboards-screens.test.tsx,
#   groups-metric-screens.test.tsx, groups-record-set-sheet.test.tsx,
#   groups-comparison-form.test.tsx. Server rules: supabase/tests/groups-*.sh
#   (lanes groups-contract, groups-leaderboards).
#
# ISOLATION: user_c and user_d are dedicated to this flow (docs/specs/11,
# enforced by scripts/tests/maestro-fixture-users.test.sh; the counterparty
# counts through its MAESTRO_*_COUNTERPARTY_EMAIL var). The lane runner's
# groups-fixture-reset.sh hard-deletes both users' groups and sync rows and
# clears user_c's username before every run, so the username gate always
# prompts and repeated runs in one slot need no Supabase reset.
#
# The stream and leaderboards live on the Groups screen
# (boga3://groups?groupId=<id>, Stream · Leaderboards); the group page
# (boga3://group/<id>) is management only: members, invite, exercises. Every
# "after a refresh" below leaves the Groups screen for My groups and returns,
# so the screen re-reads on focus (a synthetic swipe does not reliably fire
# pull-to-refresh on iOS 26); the counterparty script logs the sync_push ->
# card-visible time.

# --- Boot + sign in as user_c (pattern: auth-profile-happy-path.yaml) ---------
# clearState relaunches a wiped dev client that lost its Metro connection:
# re-open the dev-client URL, then dismiss the expo-dev-client intro (Continue)
# and dev menu (Close) that the wipe resurfaces. See auth-profile-happy-path.yaml
# for the iOS-26 accessibility-churn rationale behind waits and retries.
- launchApp:
    clearState: true
- openLink: "${MAESTRO_DEV_CLIENT_URL}"
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Continue"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Close"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-email-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_EMAIL}"
- tapOn:
    id: "sign-in-password-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_PASSWORD}"
- tapOn:
    id: "sign-in-submit-button"
- assertNotVisible:
    id: "sign-in-screen"
# Lift the first-sync gate and land on a normal route in one harness link.
- openLink: "boga3://maestro-harness?bootstrap=complete&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 60000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: sign-in
      SUPABASE_URL: ${MAESTRO_GROUPS_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${MAESTRO_GROUPS_SUPABASE_ANON_KEY}
      EMAIL: ${MAESTRO_GROUPS_COUNTERPARTY_EMAIL}
      PASSWORD: ${MAESTRO_GROUPS_COUNTERPARTY_PASSWORD}

# --- 1. The username prompt ---------------------------------------------------
# Open Groups by deep link: on iOS 26 a tab tap right after a harness teleport
# can land on the wrong tab.
- openLink: "boga3://groups"
- extendedWaitUntil:
    visible:
      id: "groups-empty-state"
    timeout: 30000
- tapOn:
    id: "groups-empty-create-button"
- extendedWaitUntil:
    visible:
      id: "group-username-gate"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-01-username-prompt"
- tapOn:
    id: "group-username-input"
- inputText: "${MAESTRO_GROUPS_DEVICE_USERNAME}"
- tapOn:
    id: "group-username-save"

# --- 2. Create a group --------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "group-form-name-input"
    timeout: 15000
- tapOn:
    id: "group-form-name-input"
- inputText: "Maestro Groups E2E"
- tapOn:
    id: "group-form-submit"
- extendedWaitUntil:
    visible:
      id: "group-screen-name"
      text: "Maestro Groups E2E"
    timeout: 15000
# The member count is a press target; iOS exposes it as one
# element whose label joins its texts.
- assertVisible:
    id: "group-screen-members-link"
    text: "Members, 1 member · You're the owner"
- waitForAnimationToEnd
- takeScreenshot: "groups-02-group-created"

# --- 2b. Read the invite code off the screen -------------------------------------
- tapOn:
    id: "group-screen-invite-button"
- extendedWaitUntil:
    visible:
      id: "group-invite-code"
    timeout: 15000
- copyTextFrom:
    id: "group-invite-code"
- waitForAnimationToEnd
- takeScreenshot: "groups-03-invite-code"

# --- 3. The counterparty joins; "joined" after a refresh ------------------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: join
      CODE: ${maestro.copiedText}
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- assertVisible:
    id: "groups-stream-filter-${output.groupsGroupId}"
- assertNotVisible:
    id: "groups-stream-filter-all"
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- takeScreenshot: "groups-mine-list"
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} joined"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-04-counterparty-joined"
- openLink: "boga3://group/${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "group-screen-members-link"
      text: "Members, 2 members · You're the owner"
    timeout: 15000

# --- 4. A custom group exercise through the form -----------------------------
# An owner's row is one pressable element, found by its joined accessibility
# label ("<name>, <weight entry>, <link status>").
- extendedWaitUntil:
    visible:
      id: "group-exercises-add-button"
    timeout: 15000
- tapOn:
    id: "group-exercises-add-button"
- extendedWaitUntil:
    visible:
      id: "group-exercise-source-custom"
    timeout: 15000
- tapOn:
    id: "group-exercise-source-custom"
- extendedWaitUntil:
    visible:
      id: "group-exercise-form-name-input"
    timeout: 10000
- assertVisible:
    id: "group-exercise-source-custom"
    selected: true
- takeScreenshot: "groups-add-exercise-custom"
# Pick weight entry, then dismiss the name keyboard before scrolling to Save.
- tapOn:
    id: "group-exercise-form-load-mode-per_side_load"
- tapOn:
    id: "group-exercise-form-name-input"
- inputText: "Sled Push"
# A real content drag dismisses iOS decimal/text keyboards without tapping Next.
- swipe:
    start: "50%,40%"
    end: "50%,20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      id: "group-exercise-form-submit"
    direction: DOWN
    centerElement: false
    timeout: 15000
- tapOn:
    id: "group-exercise-form-submit"
- extendedWaitUntil:
    visible:
      text: "Sled Push, Per side, Rules 1.*per-side load, Not linked"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-04b-1-exercises-added"

# --- 5. Active session -> one "Training now" card with its metrics ---------------
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-active
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible:
      id: "group-mine-list"
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible:
      id: "groups-stream-list"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "^group-stream-session-card-${output.groupsCardKey}$"
    timeout: 15000
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: latency
      LABEL: active
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-status"
    text: "Training now"
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-member"
    text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- assertVisible:
    id: "group-stream-session-card-${output.groupsCardKey}-metrics"
    text: "3 sets · 2 exercises"
- waitForAnimationToEnd
- takeScreenshot: "groups-05-training-now-card"

# --- 5b. The friend's view: read-only, and the native back on every visit -----
# The counterparty completes the session (and edits a set) first, so the view
# is the completed-session detail, the one whose owner actions must be absent.
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: push-complete-edit
# The native back arrow returns to the stream on every visit, not just the first:
# react-native-screens 4.16 on iOS 26 left it dead from the second visit on.
# Its accessibility label is the previous route's title: Groups is a tab, and
# the root stack titles the `(tabs)` group "Back"
# (components/navigation/root-stack.tsx).
- repeat:
    times: 2
    commands:
      - tapOn:
          id: "^group-stream-session-card-${output.groupsCardKey}$"
      - extendedWaitUntil:
          visible:
            id: "group-session-header"
          timeout: 15000
      - tapOn: "Back"
      - extendedWaitUntil:
          visible:
            id: "groups-stream-list"
          timeout: 10000
- tapOn:
    id: "^group-stream-session-card-${output.groupsCardKey}$"
- extendedWaitUntil:
    visible:
      id: "group-session-header"
    timeout: 15000
- assertVisible:
    id: "group-session-member"
    text: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME}"
- assertVisible:
    id: "group-session-status"
    text: "Completed · 45m"
# Each exercise is a session-detail card (the View Session restyle, PR C):
# its name, set count and performed sets.
- assertVisible: "Bench Press"
- assertVisible: "Barbell Row"
- assertVisible:
    id: "group-session-set-row-${output.groupsFirstSetId}"
- assertNotVisible:
    id: "completed-session-detail-options-button"
- assertNotVisible:
    id: "completed-session-detail-edit-button"
- assertNotVisible:
    id: "completed-session-detail-delete-button"
- waitForAnimationToEnd
- takeScreenshot: "groups-07-friend-view-read-only"

# --- 6. Leaderboards: certify the counterparty's set from its board row --------
# The counterparty links its Bench Press to Sled Push; link-board waits until
# the evaluator has written the row.
- runScript:
    file: ../scripts/groups-counterparty.js
    env:
      STEP: link-board
# Refresh: leave for My groups and come back (the Groups screen re-reads on focus).
- openLink: "boga3://group/mine"
- extendedWaitUntil:
    visible: { id: "group-mine-list" }
    timeout: 15000
- openLink: "boga3://groups?groupId=${output.groupsGroupId}"
- extendedWaitUntil:
    visible: { id: "groups-segment-leaderboards" }
    timeout: 15000
- tapOn: { id: "groups-segment-leaderboards" }
- extendedWaitUntil:
    visible: { id: "group-podium-card-${output.groupsBoardExerciseId}" }
    timeout: 20000
- tapOn: { id: "group-podium-card-${output.groupsBoardExerciseId}" }
- scrollUntilVisible:
    element: { id: "group-board-see-all-button" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: { id: "group-board-see-all-button" }
- scrollUntilVisible:
    element: { id: "group-board-row-1" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: { id: "group-board-row-1" }
- extendedWaitUntil:
    visible: { id: "group-metric-record-raw" }
    timeout: 15000
# No centerElement: it ends the record sheet, so it never moves (spec 06 rule 3).
- scrollUntilVisible:
    element: { id: "group-metric-record-certify" }
    direction: DOWN
    timeout: 15000
- tapOn: { id: "group-metric-record-certify" }
- extendedWaitUntil:
    visible: { id: "group-metric-record-status", text: "Certified by ${MAESTRO_GROUPS_DEVICE_USERNAME} · .*" }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: "groups-06-certified-from-board"
# Sheet keeps a full tap target below the status bar; its backdrop is hidden
# from the modal accessibility tree, so tap the exposed region directly.
- tapOn: { point: "50%,8%" }
- assertNotVisible: { id: "group-metric-record-sheet" }

# --- 7. The device removes the counterparty -> "was removed" -------------------
- openLink: "boga3://group/${output.groupsGroupId}"
# Members live behind the header's member count.
- extendedWaitUntil:
    visible:
      id: "group-screen-members-link"
    timeout: 15000
- tapOn:
    id: "group-screen-members-link"
- extendedWaitUntil:
    visible:
      id: "group-members-list"
    timeout: 15000
- takeScreenshot: "groups-members-list"
- tapOn:
    id: "group-member-row-${output.groupsCounterpartyUserId}"
- extendedWaitUntil:
    visible:
      id: "group-member-actions-sheet"
    timeout: 10000
- takeScreenshot: "groups-member-actions-sheet"
- tapOn:
    id: "group-member-action-remove"
# The native confirmation Alert's destructive button.
- extendedWaitUntil:
    visible:
      text: "Remove"
    timeout: 10000
- tapOn:
    text: "Remove"
# The feedback View carries the testID; its sentence is a child text.
- extendedWaitUntil:
    visible:
      id: "group-members-action-feedback"
    timeout: 15000
- assertVisible: "${MAESTRO_GROUPS_COUNTERPARTY_USERNAME} was removed\\."
- assertVisible:
    id: "group-members-meta"
    text: "1 member · You're the owner"
- assertNotVisible:
    id: "group-member-row-${output.groupsCounterpartyUserId}"
- takeScreenshot: "groups-members-removed"
