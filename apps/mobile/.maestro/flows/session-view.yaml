appId: com.dinoderek.mobile
---
# The session view (`components/session-view/session-view-screen.tsx`, on the
# Train tab while a workout is in progress) on the session-view fixture
# (src/maestro/session-view-fixture.ts; ios-session-view lane, infra-free).
#
# Proves:
#   1. the Train tab, with a workout in progress, is its session view, and
#      stays it across a switch to another tab and back (the tab bar's own);
#   2. a card opens its exercise page, and the page's back returns here;
#   3. the Gym stat's sheet → Manage gyms pushes the Gyms screen; a gym typed
#      there is saved, and the native back returns to the session view with
#      the sheet reopened and the new gym listed, ready to pick;
#   4. `+ Add exercise` opens the picker's page-sheet route; a keyboard
#      search and `Add empty set` add a card and close it;
#   5. Finish's cleanup prompt leads to the completion screen over the tabs,
#      and its Done to Progress;
#   6. ⋮ → Abandon asks for confirmation, then lands on Train with Start and
#      no Resume.
#   7. completed detail's native options modal → Resume returns the just-finished
#      workout to Train with its saved cards, then Finish works again.
#   8. the AI robot opens the existing native Session modal, its Abandon stays
#      locked, and the timer remains usable across tab navigation.
# Why device:
#   1., 2. and 6. root-stack and tab navigation (Jest mocks the tab
#      navigator, so only the device shows the workout kept on Train);
#   3. a stack push from a sheet, the keyboard, the native back, and the sheet
#      re-presented on focus;
#   4. a native page-sheet route over the session view, and the keyboard;
#   5. the summary pushed over the tabs after Finish, and a native alert.
#   7. the modal-to-tab handoff and deferred Train focus after Finish need the
#      native navigator; Jest replaces it and proves the persistence/timer rules.
#   8. native modal presentation, dismissal and timer/tab wiring are not
#      exercised by Jest's router/modal stand-ins; ownership rules stay in Jest/SQL.
# Jest counterpart: __tests__/session-view-screen.test.tsx (summary and
#   cards, record band, live comparison, ⋮ sheet, gym picking and
#   suggestions, the Gyms round trip, the picker add, cleanup prompts, abandon
#   confirmation), __tests__/session-view-model.test.ts,
#   __tests__/exercise-picker.test.tsx, __tests__/gyms-screen.test.tsx,
#   __tests__/train-screen.test.tsx, __tests__/train-tab-entry.test.tsx.
#
# Hermetic: starts from `reset=data` and ends with a data reset. Infra-free
# (no sign-in).

- retry:
    maxRetries: 3
    commands:
      - openLink: "boga3://maestro-harness?reset=data&fixture=session-view&teleport=session-list"
      - extendedWaitUntil:
          visible:
            id: "stats-history-screen"
          timeout: 30000

# A conflicting Resume must leave the completed workout intact, and its link
# must cross from completed detail back into the actual current Train tab.
- openLink: "boga3://maestro-harness?teleport=completed-session&sessionId=maestro_m24_completion_one_pr"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-options-button"
    timeout: 20000
- tapOn:
    id: "completed-session-detail-options-button"
- tapOn:
    id: "completed-session-detail-resume-button"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-open-active"
    timeout: 10000
- takeScreenshot: "00-resume-conflict"
- tapOn:
    id: "completed-session-detail-open-active"

# --- 1. The Train tab lands on the workout in progress ---
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-train"
      - extendedWaitUntil:
          visible:
            id: "session-view-screen"
          timeout: 15000
# The cards load after the screen; wait for them before tapping one.
- extendedWaitUntil:
    visible:
      text: "Incline Dumbbell Press, 3 of 3 sets done"
    timeout: 15000
- takeScreenshot: "01-session-view"
# A tab switch away and back keeps the workout on Train.
- tapOn:
    id: "top-level-tab-today"
- extendedWaitUntil:
    notVisible:
      id: "session-view-screen"
    timeout: 10000
- tapOn:
    id: "top-level-tab-train"
- extendedWaitUntil:
    visible:
      text: "Incline Dumbbell Press, 3 of 3 sets done"
    timeout: 10000

# --- 2. A card is a link to its exercise page ---
- tapOn:
    text: "Incline Dumbbell Press, 3 of 3 sets done"
- extendedWaitUntil:
    visible:
      id: "exercise-page-title"
      text: "Incline Dumbbell Press"
    timeout: 15000
- tapOn:
    id: "exercise-page-back"
- extendedWaitUntil:
    visible:
      id: "session-view-screen"
    timeout: 15000

# --- 3. Gym sheet → Manage gyms → Gyms → add → back → the sheet reopens ---
- tapOn:
    id: "session-view-summary-gym-button"
- extendedWaitUntil:
    visible:
      id: "session-view-gym-manage"
    timeout: 10000
- tapOn:
    id: "session-view-gym-manage"
- extendedWaitUntil:
    visible:
      id: "gyms-add"
    timeout: 15000
- takeScreenshot: "02c-gyms-screen"
- tapOn:
    id: "gyms-add"
- extendedWaitUntil:
    visible:
      id: "gym-editor-name"
    timeout: 10000
- tapOn:
    id: "gym-editor-name"
- inputText: "Canal Street Gym"
# The keyboard covers `Add gym` (gym-editor-save); hide it before the tap.
- hideKeyboard:
    optional: true
- tapOn:
    id: "gym-editor-save"
- extendedWaitUntil:
    visible:
      text: "Edit gym Canal Street Gym"
    timeout: 10000
# The native back item is arrow-only; its accessibility label depends on the
# iOS runtime ("Back" on iOS 27, the previous route's title "Session" on iOS
# 26), so tap it by UIKit's stable `BackButton` identifier instead.
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible:
      text: "Select gym Canal Street Gym"
    timeout: 15000
- tapOn:
    text: "Select gym Canal Street Gym"
- extendedWaitUntil:
    visible:
      text: "Gym Canal Street Gym"
    timeout: 10000

# --- 4. + Add exercise, through the exercise picker's page sheet ---
- scrollUntilVisible:
    element:
      id: "session-view-add-exercise"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "session-view-add-exercise"
- extendedWaitUntil:
    visible:
      id: "exercise-family-group-chest"
    timeout: 15000
- takeScreenshot: "picker-default"
- tapOn: "Exercise filter input"
- inputText: "Lat Pulldown"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Select exercise Lat Pulldown"
    timeout: 15000
- tapOn:
    text: "Select exercise Lat Pulldown"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- scrollUntilVisible:
    element:
      text: "Lat Pulldown, 0 of 1 sets done"
    direction: DOWN
    centerElement: true
- takeScreenshot: "03-session-view-exercise-added"

# --- 5. Finish → completion → Done → Stats ---
# One cleanup prompt covers the added exercise's empty set and the exercises
# left with no sets.
- tapOn:
    id: "session-view-finish-button"
- extendedWaitUntil:
    visible:
      text: "Remove incomplete sets and empty exercises?"
    timeout: 10000
- tapOn:
    text: "Remove and submit"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 20000
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 20000

# --- 7. Resume the workout just finished: no reset or replacement graph ---
- openLink: "boga3://maestro-harness?teleport=completed-session&sessionId=maestro_session_view_active"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-options-button"
    timeout: 20000
- tapOn:
    id: "completed-session-detail-options-button"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-resume-button"
    timeout: 10000
- takeScreenshot: "04-completed-session-resume-options"
- tapOn:
    id: "completed-session-detail-resume-button"
- extendedWaitUntil:
    visible:
      text: "Incline Dumbbell Press, 3 of 3 sets done"
    timeout: 20000
- assertNotVisible:
    id: "train-start-empty-button"
- takeScreenshot: "05-resumed-session-on-train"
- tapOn:
    id: "session-view-finish-button"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 20000
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 20000

# --- 6. Abandon, on a freshly seeded active session ---
- openLink: "boga3://maestro-harness?reset=data&fixture=session-view&teleport=session-view&sessionId=maestro_session_view_active"
# Stats has no session-view options button; wait for it (spec 06 rule 4).
- extendedWaitUntil:
    visible:
      id: "session-view-options-button"
    timeout: 30000
- tapOn:
    id: "session-view-options-button"
- extendedWaitUntil:
    visible:
      id: "session-view-abandon"
    timeout: 10000
- tapOn:
    id: "session-view-abandon"
- extendedWaitUntil:
    visible:
      text: "Abandon session?"
    timeout: 10000
- tapOn:
    text: "Abandon"
- extendedWaitUntil:
    visible:
      id: "train-start-empty-button"
    timeout: 15000
- assertNotVisible:
    id: "train-resume-session-button"
- takeScreenshot: "02-abandoned-back-on-train"

# --- 8. Robot-only AI control, the native options modal and working timer ---
- openLink: "boga3://maestro-harness?reset=data&fixture=session-view-ai&teleport=session-view&sessionId=maestro_session_view_active"
- extendedWaitUntil:
    visible:
      id: "session-view-ai-control"
    timeout: 30000
- assertNotVisible:
    id: "session-view-finish-button"
- assertNotVisible:
    id: "session-view-add-exercise"
- takeScreenshot: "04-ai-controlled-session"
- tapOn:
    id: "session-view-rest-timer-button"
- extendedWaitUntil:
    visible:
      id: "rest-timer-bar"
    timeout: 10000
- takeScreenshot: "05-ai-controlled-timer"
- tapOn:
    id: "top-level-tab-progress"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 15000
- tapOn:
    id: "top-level-tab-train"
- extendedWaitUntil:
    visible:
      id: "session-view-ai-control"
    timeout: 15000
- assertVisible:
    id: "rest-timer-bar"
- tapOn:
    id: "session-view-ai-control"
- extendedWaitUntil:
    visible:
      id: "session-view-control-action"
    timeout: 10000
- assertVisible: "Take over logging"
- takeScreenshot: "06-ai-control-options"
- assertVisible:
    id: "session-view-abandon"
    enabled: false
- assertNotVisible: '^Abandon session\?$'
- assertVisible:
    id: "session-view-options-sheet"
- tapOn:
    id: "session-view-control-action"
- extendedWaitUntil:
    visible:
      id: "session-control-notice"
    timeout: 10000
- takeScreenshot: "07-ai-control-unavailable"
- swipe:
    from:
      id: "session-view-options-sheet-drag-zone"
    direction: DOWN
- extendedWaitUntil:
    notVisible:
      id: "session-view-options-sheet"
    timeout: 10000

# --- 9. Dated completed AI history has native takeover and a read-only exit ---
# Device proof: completed-page robot -> native control sheet -> dismiss -> Done
# crosses navigator/modal boundaries that Jest replaces; SQL proves takeover.
- openLink: "boga3://maestro-harness?reset=data&fixture=session-view-ai-history&teleport=completed-session&sessionId=maestro_session_view_active"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-edit-button"
    timeout: 30000
- tapOn:
    id: "completed-session-detail-edit-button"
- extendedWaitUntil:
    visible:
      id: "session-view-done-button"
    timeout: 15000
- assertVisible:
    id: "session-view-ai-control"
- assertNotVisible:
    id: "session-view-add-exercise"
- takeScreenshot: "08-dated-ai-history"
- tapOn:
    id: "session-view-ai-control"
- extendedWaitUntil:
    visible:
      id: "session-view-control-action"
    timeout: 10000
- assertVisible: "Take over logging"
- assertNotVisible:
    id: "session-view-abandon"
- takeScreenshot: "09-dated-history-takeover"
# Dismiss the short two-row sheet through its backdrop; its drag zone cannot
# produce the same native swipe travel as the taller active-session sheet.
- tapOn:
    point: "50%,25%"
- extendedWaitUntil:
    notVisible:
      id: "session-view-options-sheet"
    timeout: 10000
- tapOn:
    id: "session-view-done-button"
- extendedWaitUntil:
    notVisible:
      id: "session-view-done-button"
    timeout: 15000

# Leave the simulator as this flow found it: data reset.
- openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
