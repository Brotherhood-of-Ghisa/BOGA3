appId: com.dinoderek.mobile
---
# The session view (`ux-rules` §14b). Proves, on device:
#   1. Train's Resume opens the session view;
#   2. the summary card and one read-only card per exercise, with its done
#      count and — for the bench, whose RIR 2 set beats its completed history —
#      the 1RM record band (fixture: src/maestro/session-view-fixture.ts);
#   3. a card links to its exercise page (step 4), and its back returns here;
#   4. the ⋮ menu sheet opens and a backdrop tap dismisses it; tapping the
#      Gym stat picks a gym; the sheet's Manage gyms opens the Gyms screen,
#      where a new gym is added, and back on the session view the sheet
#      reopens with it listed, ready to pick (the GPS suggestion row is jest
#      only: the simulator cannot fake a location reliably);
#   5. + Add exercise adds a card through the exercise picker;
#   6. Finish asks one cleanup prompt for the empty set and the exercises left
#      with no sets, and opens the completion screen.
#
# Hermetic: starts from `reset=data` and ends with a data reset. Infra-free
# (no sign-in).

- retry:
    maxRetries: 3
    commands:
      - openLink: "boga3://maestro-harness?reset=data&fixture=session-view&teleport=session-list"
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "stats-history-screen"
          timeout: 30000

# 1. Train -> Resume lands on the session view.
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-train"
      - extendedWaitUntil:
          visible:
            id: "train-resume-session-button"
          timeout: 15000
- tapOn:
    id: "train-resume-session-button"
- extendedWaitUntil:
    visible:
      id: "session-view-screen"
    timeout: 15000

# 2. Summary and cards (their accessibility labels carry the counts and record).
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, 3 of 5 sets done, new 1RM record 204.3"
    timeout: 15000
- assertVisible:
    text: "Gym Maestro Block History Gym"
- assertVisible:
    text: "Sets 6"
- assertVisible:
    text: "Volume 4200"
- assertVisible:
    text: "Incline Dumbbell Press, 3 of 3 sets done"
- assertVisible:
    text: "Cable Flys, 0 of 3 sets done"
- takeScreenshot: "01-session-view"

# 3. A card is a link to its exercise page.
- tapOn:
    text: "Incline Dumbbell Press, 3 of 3 sets done"
- extendedWaitUntil:
    visible:
      id: "exercise-page-title"
      text: "Incline Dumbbell Press"
    timeout: 15000
- tapOn:
    id: "exercise-page-back"
- extendedWaitUntil:
    visible:
      id: "session-view-screen"
    timeout: 15000

# 4. The ⋮ menu, dismissed by the backdrop.
- tapOn:
    id: "session-view-options-button"
- extendedWaitUntil:
    visible:
      id: "session-view-abandon"
    timeout: 10000
- takeScreenshot: "02-session-options-sheet"
# The backdrop is hidden from VoiceOver while the sheet is modal (it dismisses
# with the escape gesture instead), so tap the dimmed page above the panel.
- tapOn:
    point: "50%,20%"
- extendedWaitUntil:
    notVisible:
      id: "session-view-abandon"
    timeout: 10000

# 4b. Tapping the Gym stat opens the gym picker; choosing a gym saves it.
- tapOn:
    id: "session-view-summary-gym-button"
- extendedWaitUntil:
    visible:
      id: "session-view-gym-option-downtown-iron-temple"
    timeout: 10000
- takeScreenshot: "02b-session-gym-sheet"
- tapOn:
    id: "session-view-gym-option-downtown-iron-temple"
- extendedWaitUntil:
    visible:
      text: "Gym Downtown Iron Temple"
    timeout: 10000

# 4c. Manage gyms -> Gyms screen -> add a gym -> back -> the sheet reopens
# with it listed -> pick it.
- tapOn:
    id: "session-view-summary-gym-button"
- extendedWaitUntil:
    visible:
      id: "session-view-gym-manage"
    timeout: 10000
- tapOn:
    id: "session-view-gym-manage"
- extendedWaitUntil:
    visible:
      id: "gyms-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "gyms-add"
    timeout: 15000
- assertNotVisible:
    id: "back-to-more-button"
- takeScreenshot: "02c-gyms-screen"
- tapOn:
    id: "gyms-add"
- extendedWaitUntil:
    visible:
      id: "gym-editor-name"
    timeout: 10000
- tapOn:
    id: "gym-editor-name"
- inputText: "Canal Street Gym"
- hideKeyboard:
    optional: true
- takeScreenshot: "02d-gyms-add-editor"
- tapOn:
    id: "gym-editor-save"
- extendedWaitUntil:
    visible:
      text: "Edit gym Canal Street Gym"
    timeout: 10000
- takeScreenshot: "02e-gyms-added"
# The native back item is arrow-only; its accessibility label is the session
# view's stack title, "Session".
- tapOn: "Session"
- extendedWaitUntil:
    visible:
      text: "Select gym Canal Street Gym"
    timeout: 15000
- takeScreenshot: "02f-session-gym-sheet-reloaded"
- tapOn:
    text: "Select gym Canal Street Gym"
- extendedWaitUntil:
    visible:
      text: "Gym Canal Street Gym"
    timeout: 10000

# 5. + Add exercise, through the exercise picker.
- scrollUntilVisible:
    element:
      id: "session-view-add-exercise"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "session-view-add-exercise"
- extendedWaitUntil:
    visible:
      id: "exercise-family-group-chest"
    timeout: 15000
- takeScreenshot: "picker-default"
- assertVisible: "Favourite"
- assertVisible: "Name A–Z"
- assertVisible: "Show never-done"
- takeScreenshot: "picker-options"
- tapOn: "Exercise filter input"
- inputText: "Barbell Bench Press"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Select exercise Barbell Bench Press"
    timeout: 15000
- tapOn:
    text: "Select exercise Barbell Bench Press"
- extendedWaitUntil:
    visible:
      id: "exercise-picker-plan-set-row-1"
    timeout: 15000
- assertVisible:
    id: "exercise-picker-append-plan-button"
- takeScreenshot: "picker-preselection"
# A new search clears the preselection.
- tapOn: "Exercise filter input"
- eraseText: 40
- inputText: "Lat Pulldown"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Select exercise Lat Pulldown"
    timeout: 15000
- tapOn:
    text: "Select exercise Lat Pulldown"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- scrollUntilVisible:
    element:
      text: "Lat Pulldown, 0 of 1 sets done"
    direction: DOWN
    centerElement: true
- takeScreenshot: "03-session-view-exercise-added"

# The live comparison reads completed history and switches grouping without leaving the session.
- scrollUntilVisible:
    element:
      id: "session-insight-mode-muscle"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "session-insight-mode-muscle"
- scrollUntilVisible:
    element:
      id: "session-insight-muscle-comparison-chest"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "session-insight-muscle-comparison-chest-distribution"
- takeScreenshot: "session-live-muscle-comparison"

# 6. Finish: ONE cleanup prompt removes the added exercise's empty set and the
# exercises left with no sets together, then the completion screen.
- tapOn:
    id: "session-view-finish-button"
- extendedWaitUntil:
    visible:
      text: "Remove incomplete sets and empty exercises?"
    timeout: 10000
- tapOn:
    text: "Remove and submit"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 20000
- takeScreenshot: "04-session-view-finished"

# 7. Today lists the finished session under Recent sessions (DLM-T03 capture).
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 20000
- tapOn:
    id: "top-level-tab-today"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "today-recents-section"
    direction: DOWN
- assertNotVisible:
    id: "today-recents-empty"
- assertVisible:
    id: "today-recent-session-summary-.*-start"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "today-recents"

# Leave the simulator as this flow found it: data reset.
- openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
