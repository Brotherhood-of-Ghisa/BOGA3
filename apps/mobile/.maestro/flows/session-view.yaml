appId: com.dinoderek.mobile
---
# The session view (`ux-rules` §14b) on the session-view fixture
# (src/maestro/session-view-fixture.ts; ios-session-view lane, infra-free).
#
# Proves:
#   1. Train's Resume opens the session view;
#   2. a card opens its exercise page, and the page's back returns here;
#   3. the Gym stat's sheet → Manage gyms pushes the Gyms screen; a gym typed
#      there is saved, and the native back returns to the session view with
#      the sheet reopened and the new gym listed, ready to pick;
#   4. `+ Add exercise` opens the picker sheet; a keyboard search and
#      `Add empty set` add a card;
#   5. Finish's cleanup prompt leads to the completion screen, its Done to
#      Stats, and the Today tab then lists the finished session under its
#      recents;
#   6. ⋮ → Abandon asks for confirmation, then lands on Train with Start and
#      no Resume.
# Why device:
#   1., 2. and 6. root-stack and tab navigation;
#   3. a stack push from a sheet, the keyboard, the native back, and the sheet
#      re-presented on focus;
#   4. a real sheet and the keyboard;
#   5. the stack replace after Finish, a native alert, and the tab's re-read
#      of the device's SQLite on focus.
# Jest counterpart: app/__tests__/session-view-screen.test.tsx (summary and
#   cards, record band, live comparison, ⋮ sheet, gym picking and
#   suggestions, the Gyms round trip, the picker add, cleanup prompts, abandon
#   confirmation), app/__tests__/session-view-model.test.ts,
#   app/__tests__/exercise-picker.test.tsx, app/__tests__/gyms-screen.test.tsx,
#   app/__tests__/train-screen.test.tsx, app/__tests__/today-screen.test.tsx.
#
# Hermetic: starts from `reset=data` and ends with a data reset. Infra-free
# (no sign-in).

- retry:
    maxRetries: 3
    commands:
      - openLink: "boga3://maestro-harness?reset=data&fixture=session-view&teleport=session-list"
      - extendedWaitUntil:
          visible:
            id: "stats-history-screen"
          timeout: 30000

# --- 1. Train → Resume lands on the session view ---
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-train"
      - extendedWaitUntil:
          visible:
            id: "train-resume-session-button"
          timeout: 15000
- tapOn:
    id: "train-resume-session-button"
- extendedWaitUntil:
    visible:
      id: "session-view-screen"
    timeout: 15000
# The cards load after the screen; wait for them before tapping one.
- extendedWaitUntil:
    visible:
      text: "Incline Dumbbell Press, 3 of 3 sets done"
    timeout: 15000
- takeScreenshot: "01-session-view"

# --- 2. A card is a link to its exercise page ---
- tapOn:
    text: "Incline Dumbbell Press, 3 of 3 sets done"
- extendedWaitUntil:
    visible:
      id: "exercise-page-title"
      text: "Incline Dumbbell Press"
    timeout: 15000
- tapOn:
    id: "exercise-page-back"
- extendedWaitUntil:
    visible:
      id: "session-view-screen"
    timeout: 15000

# --- 3. Gym sheet → Manage gyms → Gyms → add → back → the sheet reopens ---
- tapOn:
    id: "session-view-summary-gym-button"
- extendedWaitUntil:
    visible:
      id: "session-view-gym-manage"
    timeout: 10000
- tapOn:
    id: "session-view-gym-manage"
- extendedWaitUntil:
    visible:
      id: "gyms-add"
    timeout: 15000
- takeScreenshot: "02c-gyms-screen"
- tapOn:
    id: "gyms-add"
- extendedWaitUntil:
    visible:
      id: "gym-editor-name"
    timeout: 10000
- tapOn:
    id: "gym-editor-name"
- inputText: "Canal Street Gym"
# The keyboard covers `Add gym` (gym-editor-save); hide it before the tap.
- hideKeyboard:
    optional: true
- tapOn:
    id: "gym-editor-save"
- extendedWaitUntil:
    visible:
      text: "Edit gym Canal Street Gym"
    timeout: 10000
# The native back item is arrow-only; its accessibility label is the session
# view's stack title, "Session".
- tapOn: "Session"
- extendedWaitUntil:
    visible:
      text: "Select gym Canal Street Gym"
    timeout: 15000
- tapOn:
    text: "Select gym Canal Street Gym"
- extendedWaitUntil:
    visible:
      text: "Gym Canal Street Gym"
    timeout: 10000

# --- 4. + Add exercise, through the exercise picker ---
- scrollUntilVisible:
    element:
      id: "session-view-add-exercise"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "session-view-add-exercise"
- extendedWaitUntil:
    visible:
      id: "exercise-family-group-chest"
    timeout: 15000
- takeScreenshot: "picker-default"
- tapOn: "Exercise filter input"
- inputText: "Lat Pulldown"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Select exercise Lat Pulldown"
    timeout: 15000
- tapOn:
    text: "Select exercise Lat Pulldown"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- scrollUntilVisible:
    element:
      text: "Lat Pulldown, 0 of 1 sets done"
    direction: DOWN
    centerElement: true
- takeScreenshot: "03-session-view-exercise-added"

# --- 5. Finish → completion → Done → Stats; Today lists the session ---
# One cleanup prompt covers the added exercise's empty set and the exercises
# left with no sets.
- tapOn:
    id: "session-view-finish-button"
- extendedWaitUntil:
    visible:
      text: "Remove incomplete sets and empty exercises?"
    timeout: 10000
- tapOn:
    text: "Remove and submit"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 20000
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 20000
- tapOn:
    id: "top-level-tab-today"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "today-recents-section"
    direction: DOWN
- assertVisible:
    id: "today-recent-session-summary-.*-start"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "today-recents"

# --- 6. Abandon, on a freshly seeded active session ---
- openLink: "boga3://maestro-harness?reset=data&fixture=session-view&teleport=session-view&sessionId=maestro_session_view_active"
# Today has no session-view options button; wait for it (spec 06 rule 4).
- extendedWaitUntil:
    visible:
      id: "session-view-options-button"
    timeout: 30000
- tapOn:
    id: "session-view-options-button"
- extendedWaitUntil:
    visible:
      id: "session-view-abandon"
    timeout: 10000
- tapOn:
    id: "session-view-abandon"
- extendedWaitUntil:
    visible:
      text: "Abandon session?"
    timeout: 10000
- tapOn:
    text: "Abandon"
- extendedWaitUntil:
    visible:
      id: "train-start-empty-button"
    timeout: 15000
- assertNotVisible:
    id: "train-resume-session-button"
- takeScreenshot: "02-abandoned-back-on-train"

# Leave the simulator as this flow found it: data reset.
- openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
