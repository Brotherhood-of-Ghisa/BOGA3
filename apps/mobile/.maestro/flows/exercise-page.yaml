appId: com.dinoderek.mobile
---
# The exercise page (`docs/specs/ui/ux-rules.md` §14a) on its `exercise-page`
# fixture: an active session whose Barbell Bench Press has two performed sets
# and three planned ones, plus two completed Bench Press sessions for the
# records panel (ios-exercise-page lane, infra-free).
#
# Proves:
#   1. the records panel's `History` pushes Exercise history, which lists the
#      newer fixture session, and the native back returns to the page;
#   2. the logger takes reps on the keyboard, commits set 3 as `82.5 × 5`, and
#      marks it performed.
# Why device:
#   1. a stack push and the native back button;
#   2. the keyboard.
# Jest counterpart: __tests__/exercise-page-screen.test.tsx (the page over
#   the same fixture: records, Last, effort cycle and sheet, menu, swap,
#   `+ Add set`, Complete's warning, discarded planned sets read back from the
#   database), __tests__/exercise-page-model.test.ts (effort inheritance),
#   __tests__/exercise-history-screen.test.tsx (periods, bests, cards).

- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-page&teleport=exercise-page&sessionId=maestro_exercise_page_session&sessionExerciseId=maestro_exercise_page_bench"
- extendedWaitUntil:
    visible:
      id: "exercise-page"
    timeout: 30000
# The records load in above the logger; wait for them before tapping
# (spec 06 rule 4).
- extendedWaitUntil:
    visible:
      id: "exercise-records-1rm"
      text: "1RM 102.1"
    timeout: 15000
- takeScreenshot: "exercise-page-v5-quiet"

# --- 1. Records → History → back ---
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "exercise-records-history"
- extendedWaitUntil:
    visible:
      id: "exercise-history-session-card-maestro_exercise_page_history_2_bench"
    timeout: 10000
- takeScreenshot: "exercise-history-default"
# The screen draws its own back arrow (the native item can stop dispatching).
- tapOn:
    id: "exercise-history-back"
- extendedWaitUntil:
    visible:
      id: "exercise-page"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000

# --- 2. Log set 3 on the keyboard: 82.5 × 5 ---
- tapOn:
    id: "exercise-set-logger-reps"
- eraseText: 3
- inputText: "5"
# The logger's commit sits above the keyboard and the page scroll has
# keyboardShouldPersistTaps="handled", so the tap lands with the keyboard up
# (a hideKeyboard here cost ~4.3s).
- tapOn:
    id: "exercise-set-logger-commit"
- extendedWaitUntil:
    visible:
      id: "exercise-set-3-toggle"
      text: "Mark set 3 not performed"
    timeout: 5000
- assertVisible:
    id: "exercise-set-3-values"
    text: "82.5 × 5"
