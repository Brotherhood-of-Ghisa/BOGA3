appId: com.dinoderek.mobile
---
# The exercise page (`components/exercise-page/`) on its `exercise-page`
# fixture: an active session whose Barbell Bench Press has two performed sets
# and three planned ones, plus two completed Bench Press sessions for the
# records panel (ios-exercise-page lane, infra-free).
#
# Proves:
#   1. the records panel's `Progress` pushes exercise Progress, whose ⋮ History
#      lists the newer fixture session; Back returns through Progress to the page;
#   2. the logger takes reps on the keyboard, commits set 3 as `82.5 × 5`, and
#      marks it performed;
#   3. the ⋮ menu (a `Sheet`) dismisses from a drag of its title row
#      and its rows still tap after reopening; Swap opens a page sheet that closes on a swipe
#      down and presents again afterwards.
#   4. exercise-first quick entry dismisses a native sheet, starts or continues
#      the workout on Train, opens the added row and returns to Train.
# Why device:
#   1. a stack push and the native back button;
#   2. the keyboard;
#   3. the drag runs as a UI-thread worklet, which Jest's reanimated mock runs
#      on JS (a worklet calling JS crashed only on device), and a swiped native
#      page sheet must be re-created to present again.
#   4. native Modal dismissal, tab focus, stacked navigation and keyboard input.
# Jest counterpart: __tests__/exercise-session-entry.test.ts,
#   __tests__/exercise-session-entry-sheet.test.tsx,
#   __tests__/main-tab-navigation.test.tsx, __tests__/train-screen.test.tsx,
#   plus __tests__/exercise-page-screen.test.tsx (the page over
#   the same fixture: records, Last, effort cycle and sheet, menu, swap,
#   `+ Add set`, Complete's warning, the sets it keeps read back from the
#   database), __tests__/ui-sheet-drag.test.tsx, __tests__/ui-page-sheet.test.tsx,
#   __tests__/exercise-page-model.test.ts (effort inheritance),
#   __tests__/exercise-history-screen.test.tsx (periods, bests, cards).

- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-page&teleport=exercise-page&sessionId=maestro_exercise_page_session&sessionExerciseId=maestro_exercise_page_bench"
# A wiped seasonal launch can show UIKit's icon confirmation over the page.
# Jest cannot dismiss that native alert; acknowledge only this known message.
- extendedWaitUntil:
    visible: "Barbell Bench Press|You have changed the icon.*"
    timeout: 30000
- runFlow:
    when:
      visible: "You have changed the icon.*"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "exercise-page"
    timeout: 30000
# The records load in above the logger; wait for them before tapping
# (spec 06 rule 4).
- extendedWaitUntil:
    visible:
      id: "exercise-records-1rm"
      text: "1RM 102.1"
    timeout: 15000
- takeScreenshot: "exercise-page-v5-quiet"

# --- 1. Records → Progress → ⋮ History → back through Progress ---
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "exercise-records-progress"
- extendedWaitUntil:
    visible:
      id: "progress-history-options-button"
    timeout: 10000
- takeScreenshot: "exercise-progress"
- tapOn:
    id: "progress-history-options-button"
- assertVisible:
    id: "progress-history-exercise-history"
- takeScreenshot: "exercise-progress-options"
- tapOn:
    id: "progress-history-exercise-history"
- extendedWaitUntil:
    visible:
      id: "exercise-history-session-card-maestro_exercise_page_history_2_bench"
    timeout: 10000
- takeScreenshot: "exercise-history-default"
# The screen draws its own back arrow (the native item can stop dispatching).
- tapOn:
    id: "exercise-history-back"
- extendedWaitUntil:
    visible:
      id: "progress-history-screen"
    timeout: 10000
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible:
      id: "exercise-page"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000

# --- 2. Log set 3 on the keyboard: 82.5 × 5 ---
- tapOn:
    id: "exercise-set-logger-reps"
- eraseText: 3
- inputText: "5"
# The logger's commit sits above the keyboard and the page scroll has
# keyboardShouldPersistTaps="handled", so the tap lands with the keyboard up
# (a hideKeyboard here cost ~4.3s).
- tapOn:
    id: "exercise-set-logger-commit"
- extendedWaitUntil:
    visible:
      id: "exercise-set-3-toggle"
      text: "Mark set 3 not performed"
    timeout: 5000
- assertVisible:
    id: "exercise-set-3-values"
    text: "82.5 × 5"

# --- 3. ⋮ menu: drag dismisses; Swap's page sheet swipes closed and reopens ---
- tapOn:
    id: "exercise-page-options"
- extendedWaitUntil:
    visible:
      id: "exercise-options-sheet-header"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 4000
# Anchor to the title: the same sheet starts higher on a small phone.
- swipe:
    from: { id: "exercise-options-sheet-header" }
    direction: DOWN
    duration: 900
- extendedWaitUntil:
    notVisible: { id: "exercise-options-sheet-header" }
    timeout: 5000
- tapOn: { id: "exercise-page-options" }
- extendedWaitUntil:
    visible: { id: "exercise-options-sheet-header" }
    timeout: 5000
- tapOn:
    id: "exercise-options-swap"
- extendedWaitUntil:
    visible:
      id: "exercise-swap-sheet-header"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "exercise-swap-page-sheet"
- swipe:
    start: "50%,12%"
    end: "50%,92%"
    duration: 500
- extendedWaitUntil:
    notVisible:
      id: "exercise-swap-sheet-header"
    timeout: 10000
- tapOn:
    id: "exercise-page-options"
- tapOn:
    id: "exercise-options-swap"
- extendedWaitUntil:
    visible:
      id: "exercise-swap-sheet-header"
    timeout: 10000
- tapOn:
    id: "exercise-swap-sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "exercise-swap-sheet-header"
    timeout: 10000
- assertVisible:
    id: "exercise-page-title"
    text: "Barbell Bench Press"

# --- 4. Timed holds: approved native keyboard/confirmation proof ---
# Jest counterparts: manual-holds-data/semantics, exercise-editor-screen and
# exercise-page-screen. This uses the real editor rather than altering seeds.
- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-page&teleport=session-view&sessionId=maestro_exercise_page_session"
- extendedWaitUntil:
    visible: { id: "session-view-add-exercise" }
    timeout: 30000

# Native proof for the approved hold editor/logger: keyboard focus, long-press
# Effort selection, explicit confirmation with the number pad up, and native
# navigation/autosave. Validation/counting math stays in Jest.
- scrollUntilVisible:
    element: { id: "session-view-add-exercise" }
    direction: DOWN
- tapOn: { id: "session-view-add-exercise" }
- extendedWaitUntil:
    visible: { id: "exercise-picker-create-button" }
    timeout: 15000
- tapOn: { id: "exercise-picker-create-button" }
- extendedWaitUntil:
    visible: { id: "exercise-editor-name-input" }
    timeout: 10000
- tapOn: { id: "exercise-editor-name-input" }
- inputText: "Plank"
- pressKey: Enter
- tapOn: { id: "exercise-editor-primary-muscle-trigger" }
- scrollUntilVisible:
    element: { id: "exercise-editor-muscle-option-abs_rectus" }
    direction: DOWN
- tapOn: { id: "exercise-editor-muscle-option-abs_rectus" }
- tapOn: { point: "50%,8%" }
- extendedWaitUntil:
    notVisible: { id: "exercise-editor-muscle-selector-list" }
    timeout: 10000
- scrollUntilVisible:
    element: { id: "exercise-editor-recording-mode-hold" }
    direction: DOWN
- tapOn: { id: "exercise-editor-recording-mode-hold" }
- takeScreenshot: "hold-0-editor"
- scrollUntilVisible:
    element: { id: "exercise-editor-save" }
    direction: DOWN
- tapOn: { id: "exercise-editor-save" }
- extendedWaitUntil:
    visible: { text: "Plank, 0 of 1 sets done" }
    timeout: 15000
- tapOn: { text: "Plank, 0 of 1 sets done" }
- extendedWaitUntil:
    visible: { id: "exercise-set-logger-duration" }
    timeout: 15000
- assertVisible: "Change effort, currently RIR 0"
- assertNotVisible: { id: "exercise-set-logger-reps" }
- assertNotVisible: { id: "exercise-records-panel" }
- tapOn: { id: "exercise-set-logger-weight" }
- inputText: "0"
- tapOn: { id: "exercise-set-logger-duration" }
- inputText: "301"
- assertVisible: "Enter whole seconds from 1 to 300."
- assertVisible: { id: "exercise-set-logger-commit", enabled: false }
- takeScreenshot: "hold-0-invalid-keyboard"
- eraseText
- inputText: "38"
- takeScreenshot: "hold-0-unchecked-keyboard"
- longPressOn: { id: "exercise-set-logger-effort" }
- tapOn: { id: "exercise-effort-option-none" }
- extendedWaitUntil:
    notVisible: { id: "exercise-effort-sheet" }
    timeout: 10000
- tapOn: { id: "exercise-set-logger-commit" }
- extendedWaitUntil:
    visible: { id: "exercise-set-1-toggle", text: "Mark set 1 not performed" }
    timeout: 10000
- assertVisible: { id: "exercise-set-1-values", text: "0.0 × 38 s" }
- assertNotVisible: { id: "exercise-set-1-1rm" }
- assertNotVisible: { id: "exercise-set-1-vol" }
- takeScreenshot: "hold-0-confirmed"
- tapOn: { id: "exercise-page-back" }
- extendedWaitUntil:
    visible: { text: "Plank, 1 of 1 sets done" }
    timeout: 15000
- tapOn: { text: "Plank, 1 of 1 sets done" }
- extendedWaitUntil:
    visible: { id: "exercise-set-1-values", text: "0.0 × 38 s" }
    timeout: 15000
- tapOn: { id: "exercise-set-1-open" }
- assertVisible: { id: "exercise-set-logger-duration", text: "38" }
- assertVisible: "Change effort, currently none"
- takeScreenshot: "hold-0-reopened"
- tapOn: { id: "exercise-page-back" }

# Native proof for the approved hold editor/logger: keyboard focus, long-press
# Effort selection, explicit confirmation with the number pad up, and native
# navigation/autosave. Validation/counting math stays in Jest.
- scrollUntilVisible:
    element: { id: "session-view-add-exercise" }
    direction: DOWN
- tapOn: { id: "session-view-add-exercise" }
- extendedWaitUntil:
    visible: { id: "exercise-picker-create-button" }
    timeout: 15000
- tapOn: { id: "exercise-picker-create-button" }
- extendedWaitUntil:
    visible: { id: "exercise-editor-name-input" }
    timeout: 10000
- tapOn: { id: "exercise-editor-name-input" }
- inputText: "Hollow Hold"
- pressKey: Enter
- tapOn: { id: "exercise-editor-primary-muscle-trigger" }
- scrollUntilVisible:
    element: { id: "exercise-editor-muscle-option-abs_rectus" }
    direction: DOWN
- tapOn: { id: "exercise-editor-muscle-option-abs_rectus" }
- tapOn: { point: "50%,8%" }
- extendedWaitUntil:
    notVisible: { id: "exercise-editor-muscle-selector-list" }
    timeout: 10000
- scrollUntilVisible:
    element: { id: "exercise-editor-recording-mode-hold" }
    direction: DOWN
- tapOn: { id: "exercise-editor-recording-mode-hold" }
- takeScreenshot: "hold-5-editor"
- scrollUntilVisible:
    element: { id: "exercise-editor-save" }
    direction: DOWN
- tapOn: { id: "exercise-editor-save" }
- extendedWaitUntil:
    visible: { text: "Hollow Hold, 0 of 1 sets done" }
    timeout: 15000
- tapOn: { text: "Hollow Hold, 0 of 1 sets done" }
- extendedWaitUntil:
    visible: { id: "exercise-set-logger-duration" }
    timeout: 15000
- assertVisible: "Change effort, currently RIR 0"
- assertNotVisible: { id: "exercise-set-logger-reps" }
- assertNotVisible: { id: "exercise-records-panel" }
- tapOn: { id: "exercise-set-logger-weight" }
- inputText: "5"
- tapOn: { id: "exercise-set-logger-duration" }
- inputText: "301"
- assertVisible: "Enter whole seconds from 1 to 300."
- assertVisible: { id: "exercise-set-logger-commit", enabled: false }
- takeScreenshot: "hold-5-invalid-keyboard"
- eraseText
- inputText: "38"
- takeScreenshot: "hold-5-unchecked-keyboard"
- longPressOn: { id: "exercise-set-logger-effort" }
- tapOn: { id: "exercise-effort-option-none" }
- extendedWaitUntil:
    notVisible: { id: "exercise-effort-sheet" }
    timeout: 10000
- tapOn: { id: "exercise-set-logger-commit" }
- extendedWaitUntil:
    visible: { id: "exercise-set-1-toggle", text: "Mark set 1 not performed" }
    timeout: 10000
- assertVisible: { id: "exercise-set-1-values", text: "5.0 × 38 s" }
- assertNotVisible: { id: "exercise-set-1-1rm" }
- assertNotVisible: { id: "exercise-set-1-vol" }
- takeScreenshot: "hold-5-confirmed"
- tapOn: { id: "exercise-page-back" }
- extendedWaitUntil:
    visible: { text: "Hollow Hold, 1 of 1 sets done" }
    timeout: 15000
- tapOn: { text: "Hollow Hold, 1 of 1 sets done" }
- extendedWaitUntil:
    visible: { id: "exercise-set-1-values", text: "5.0 × 38 s" }
    timeout: 15000
- tapOn: { id: "exercise-set-1-open" }
- assertVisible: { id: "exercise-set-logger-duration", text: "38" }
- assertVisible: "Change effort, currently none"
- takeScreenshot: "hold-5-reopened"
- tapOn: { id: "exercise-page-back" }

# Native long-content acceptance: editing metadata keeps the saved measurement.
- tapOn: { text: "Hollow Hold, 1 of 1 sets done" }
- tapOn: { id: "exercise-page-options" }
- tapOn: { id: "exercise-options-edit" }
- extendedWaitUntil:
    visible: { id: "exercise-editor-name-input" }
    timeout: 10000
- tapOn: { id: "exercise-editor-name-input" }
- eraseText
- inputText: "Hollow Hold with arms overhead and legs fully extended"
- takeScreenshot: "hold-long-name-editor-keyboard"
- pressKey: Enter
- scrollUntilVisible:
    element: { id: "exercise-editor-save" }
    direction: DOWN
- tapOn: { id: "exercise-editor-save" }
- extendedWaitUntil:
    visible: { id: "exercise-page-title", text: "Hollow Hold with arms overhead and legs fully extended" }
    timeout: 15000
- assertVisible: { id: "exercise-set-1-values", text: "5.0 × 38 s" }
- takeScreenshot: "hold-long-name-saved-seconds"


# --- 5. Exercise-first start and continue: real sheets, tab focus and Back ---
# Written justification: native Modal dismissal and tab/stack parenting are not
# implemented by Jest's router/Modal mocks; arithmetic and write failures stay there.
- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-block-history&teleport=exercise-catalog"
- extendedWaitUntil:
    visible: { id: "exercise-catalog-screen" }
    timeout: 30000
- tapOn: "Search exercises or muscles"
- inputText: "Barbell Back Squat"
- tapOn: "Exercise actions Barbell Back Squat"
- tapOn: { id: "exercise-action-add-to-session" }
- extendedWaitUntil:
    visible: { id: "exercise-picker-plan-source" }
    timeout: 10000
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: "quick-entry-repeat-choice"
- tapOn: { id: "exercise-picker-add-empty-set-button" }
- extendedWaitUntil:
    visible: { id: "exercise-set-logger-reps" }
    timeout: 15000
- assertVisible: { id: "exercise-page-title", text: "Barbell Back Squat" }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: "quick-entry-empty-logger"
- tapOn: { id: "exercise-set-logger-weight" }
- inputText: "100"
- tapOn: { id: "exercise-set-logger-reps" }
- inputText: "5"
- tapOn: { id: "exercise-set-logger-commit" }
- tapOn: { id: "exercise-page-back" }
- extendedWaitUntil:
    visible: { id: "session-view-add-exercise" }
    timeout: 10000
- assertVisible: "Barbell Back Squat, 1 of 1 sets done.*"
- takeScreenshot: "quick-entry-back-to-train"

# Continue the same exercise from its History header: this appends a row to
# the existing card, rather than editing history or starting another workout.
- openLink: "boga3://exercise-history?exerciseDefinitionId=seed_barbell_back_squat"
- extendedWaitUntil:
    visible: { id: "exercise-history-add-to-session" }
    timeout: 10000
- tapOn: { id: "exercise-history-add-to-session" }
- extendedWaitUntil:
    visible: { id: "exercise-picker-repeat-last-button", enabled: true }
    timeout: 10000
- tapOn: { id: "exercise-picker-repeat-last-button" }
- extendedWaitUntil:
    visible: { id: "exercise-set-logger" }
    timeout: 15000
- assertVisible: { id: "exercise-set-logger-header", text: "Set 2, in progress" }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: "quick-entry-repeat-logger"
- tapOn: { id: "exercise-page-back" }
- extendedWaitUntil:
    visible: { id: "session-view-add-exercise" }
    timeout: 10000
- takeScreenshot: "quick-entry-continued-workout"

# Visual counterpart to Jest's no-history state; dismissal leaves training intact.
- openLink: "boga3://exercise-history?exerciseDefinitionId=seed_lat_pulldown"
- extendedWaitUntil:
    visible: { id: "exercise-history-add-to-session" }
    timeout: 10000
- tapOn: { id: "exercise-history-add-to-session" }
- extendedWaitUntil:
    visible: "No earlier workout to repeat."
    timeout: 10000
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: "quick-entry-no-history"
- swipe:
    from: { id: "exercise-session-entry-sheet-header" }
    direction: DOWN
    duration: 900
- extendedWaitUntil:
    notVisible: { id: "exercise-session-entry-sheet-header" }
    timeout: 5000
