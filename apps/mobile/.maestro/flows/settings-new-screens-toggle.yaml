appId: com.dinoderek.mobile
---
# The "New exercise & session screens" preference on the Settings screen, and
# the harness hook the new screens' own flows use to opt in before navigating.
#
# Proves, on device with the real SecureStore-backed preference:
#   1. `newScreens=on` on the maestro-harness link switches it on (the row
#      renders On selected);
#   2. the Settings Off/On row flips it;
#   3. `reset=data` restores it to its default (Off), so a flow that opted in
#      cannot leak the setting into a later flow on the same simulator.
#
# Hermetic: starts from `reset=data` and ends with the setting Off. Infra-free
# (no sign-in), so it runs in the ui-regression lane.

- openLink: "boga3://maestro-harness?reset=data&newScreens=on&teleport=session-list"
# The dev-client "Open in <App>?" URL-scheme trust dialog and expo-dev-client's
# developer-menu onboarding sheet can appear on top of the freshly-loaded app;
# dismiss them. Each tap is an optional no-op when its target is absent.
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000

# More -> Settings, then scroll the Preferences row into the accessibility tree
# (iOS exposes only the rendered slice of a ScrollView; centerElement is what
# makes the scroll actually bring it in).
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-more"
      - extendedWaitUntil:
          visible:
            id: "more-screen"
          timeout: 15000
- scrollUntilVisible:
    element:
      id: "more-settings-row"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "more-settings-row"
- assertVisible:
    id: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-new-screens-on"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "settings-new-screens-on"
    selected: true
- assertVisible:
    id: "settings-new-screens-off"
    selected: false
- takeScreenshot: "01-new-screens-on-via-harness"

# The row flips it off, and back on.
- tapOn:
    id: "settings-new-screens-off"
- assertVisible:
    id: "settings-new-screens-off"
    selected: true
- assertVisible:
    id: "settings-new-screens-on"
    selected: false
- tapOn:
    id: "settings-new-screens-on"
- assertVisible:
    id: "settings-new-screens-on"
    selected: true
- takeScreenshot: "02-new-screens-toggled-in-settings"

# A data reset restores the default, leaving the simulator as this flow found it.
- openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-more"
      - extendedWaitUntil:
          visible:
            id: "more-screen"
          timeout: 15000
- scrollUntilVisible:
    element:
      id: "more-settings-row"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "more-settings-row"
- assertVisible:
    id: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-new-screens-on"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "settings-new-screens-off"
    selected: true
- assertVisible:
    id: "settings-new-screens-on"
    selected: false
- takeScreenshot: "03-new-screens-off-after-data-reset"
