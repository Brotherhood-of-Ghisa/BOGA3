appId: com.dinoderek.mobile
---
# Developer "Wipe local & re-bootstrap" on Settings (ios-ui-regression lane,
# infra-free).
#
# Proves:
#   1. More → Settings is reachable from the tab shell;
#   2. the developer-tools card renders on the dev-client build;
#   3. Wipe local drops the device's database and re-bootstraps it, with the
#      success feedback;
#   4. Developer tools → Logs pushes the logs viewer, and the native back
#      returns to Settings;
#   5. after the wipe, a data screen still renders against the fresh store.
# Why device:
#   1. tab and stack navigation, with a scroll past the minimised tab bar;
#   2. the real developer-mode gate of the installed build;
#   3. and 5. the on-device expo-sqlite reset and boot data layer;
#   4. a stack push and the native back button.
# Jest counterpart: app/__tests__/settings-dev-wipe.test.tsx (card gating,
#   wipe feedback), app/__tests__/dev-affordances.test.ts,
#   app/__tests__/settings-profile-navigation.test.tsx (date format),
#   app/__tests__/more-screen.test.tsx (the logs push).
#
# The maestro-harness deep link teleports straight to a data screen without a
# sign-in.

# Reset the local data layer to a known clean state and land on the tabbed shell.
- openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- takeScreenshot: "01-dev-wipe-local-start"

# Open More -> Settings and confirm the developer-tools card is present. Its
# visibility proves the developer-mode gate evaluates true on this build.
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-more"
      - extendedWaitUntil:
          visible:
            id: "more-screen"
          timeout: 15000
# One swipe, not a centring scroll: the row ends the list, so after the first
# swipe a centring scroll adds five no-op swipes (~7s). Left where it first
# shows, the row rests over the minimised tab bar and the tap misses; the swipe
# lifts it clear (spec 06 rule 3).
- scroll
- tapOn:
    id: "more-settings-row"
- assertVisible:
    id: "settings-screen"
# Developer tools is the LAST section of Settings, below Account / AI coaching /
# Preferences / Data & sync / About. iOS exposes only the rendered slice of a
# ScrollView to the accessibility hierarchy, so the card is absent from the tree
# until scrolled to -- waiting for it from the top of Settings can never succeed
# (the same trap PR #308 hit on settings-sync-status-card). centerElement is the
# flag that does the work -- without it the scroll stops as soon as Maestro calls
# the element visible, which for anything already in the hierarchy can be
# immediately. Scroll to the BUTTON, not to the card: the card holds three
# paragraphs and three buttons, so on a small phone it can be taller than the
# viewport and "centre it" would never be satisfiable. Centring the button
# brings its parent card into the tree, which is what the gate assertion needs.
- scrollUntilVisible:
    element:
      id: "settings-dev-wipe-local-button"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "settings-dev-tools-card"
- assertVisible:
    id: "settings-dev-wipe-local-button"
- takeScreenshot: "02-dev-wipe-local-settings"

# Drive the wipe: drop the local database and re-bootstrap the data layer.
- tapOn:
    id: "settings-dev-wipe-local-button"
# Success feedback confirms the wipe + re-bootstrap completed without error.
- extendedWaitUntil:
    visible:
      id: "settings-dev-wipe-local-feedback"
    timeout: 30000
- assertVisible:
    text: "Local database wiped and re-bootstrapped. Sync will re-pull from the server."
- takeScreenshot: "03-dev-wipe-local-feedback"

# Logs (dev-only; captured for information, DLM-T04): open the viewer from
# Developer tools, assert its level filter, then return by the native back
# arrow (its accessibility label is "Back").
- scrollUntilVisible:
    element:
      id: "settings-dev-logs-button"
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn:
    id: "settings-dev-logs-button"
- extendedWaitUntil:
    visible:
      id: "dev-logs-filter-row"
    timeout: 15000
- takeScreenshot: "dev-logs"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

# After the wipe the data layer is re-bootstrapped, so navigating back to a data
# screen must still render against the fresh local store (a broken re-bootstrap
# would leave the app unable to reach a data screen here).
- openLink: "boga3://maestro-harness?teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- takeScreenshot: "04-dev-wipe-local-rebootstrapped"
