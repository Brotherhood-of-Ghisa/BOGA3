appId: com.dinoderek.mobile
---
# First-run end-to-end round trip: the REAL sync cycle against local Supabase
# (ios-sync-e2e lane).
#
# Proves:
#   1. a new user's first sign-in, on an empty server, runs the real
#      bootstrapper (seed → push → pull) and lifts the first-sync gate on its
#      own;
#   2. a reading entered on the device, and the muscle setup chosen in
#      Settings → Progress → Muscles (Broad, Calves switched off), are pushed:
#      Settings' Pending changes reaches 0;
#   3. after a full wipe (clearState) and a fresh sign-in, the bootstrapper
#      pulls instead of re-seeding: the reading is back, and the account still
#      reads Broad with Calves off ([[muscle.report-groups]]), so the boot
#      catalogue seed did not reset the pulled rows.
# Why device:
#   1. real GoTrue sign-in, the auth → sync trigger, `expo/fetch` and the
#      on-device expo-sqlite against a real server, and the root stack's
#      access switch from the gate to the app;
#   2. a write on the device reaching the server through the scheduler's own
#      cycle (nothing taps Refresh), from a real sheet and switch;
#   3. clearState wipes SQLite; clearKeychain drops the SecureStore session
#      to simulate a fresh device. Reinstall alone preserves iOS Keychain data.
# Jest counterpart: __tests__/sync/cycle-round-trip.test.ts (live server:
#   the gym → session → exercise → set chain and kg readings pushed, then
#   restored on a wiped client), __tests__/sync-bootstrapper.test.ts (seed
#   decision), __tests__/sync-status-panel.test.tsx (every status field,
#   Refresh), __tests__/bodyweight-screen.test.tsx (the reading editor),
#   __tests__/completed-session-local-data.test.tsx (a session shows no
#   body-weight UI when a reading applies), __tests__/sync/** and the
#   sync-cycle-*.test.ts family (cycle, push/pull, drift),
#   __tests__/muscle-report-settings.test.tsx (the preset and Track writes,
#   dirty flags, derived preset), __tests__/sync/muscle-groups-*.test.ts (the
#   two columns on the wire; a re-seed keeps them).
#
# HERMETIC — the flow signs in as its DEDICATED fixture user (user_b, passed in
# as MAESTRO_ROUNDTRIP_EMAIL/PASSWORD by the lane runner; one user per flow,
# docs/specs/11, enforced by scripts/tests/maestro-fixture-users.test.sh), and
# the lane runner first empties user_b's server data
# (supabase/scripts/sync-e2e-fixture-reset.sh). So the first sign-in always
# finds an empty server and takes the bootstrapper's SEED branch, and the only
# reading on the server after the wipe is the one this run entered. The seeded
# catalog alone cannot prove claim 3: a failed push would leave the server
# empty and the second sign-in would re-seed the same catalog.

# === 1. First sign-in on an empty server: seed, push, gate lifts ===
# `clearState` relaunches the dev client with a wiped sandbox, dropping its Metro
# connection, so re-open the dev-client deep link (carrying this worktree's Metro
# port, exported by maestro-ios-launch.sh) to reload the app bundle into the
# wiped sandbox. clearState reinstalled the app, so the expo-dev-client menu
# reappears over the app and BLOCKS sign-in: wait for the onboarding intro and
# dismiss it (Continue -> dev menu, Close -> app). The URL-scheme trust dialog is
# pre-authorized in maestro-ios-launch.sh, so there is no "Open" tap. See
# auth-profile-happy-path for the failure screenshots that proved the dev menu is
# load-bearing after clearState.
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: "${MAESTRO_DEV_CLIENT_URL}"
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible:
            text: "Continue"
          timeout: 30000
# Settle the sheet, then retry each dismissal tap. iOS 26 can return
# `kAXErrorInvalidUIElement` during the post-clearState reload; retrying the
# wait and taps covers the same transient. Each tap remains idempotent because
# its element stays present until the tap succeeds.
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Continue"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Close"
# The route guard itself (no data screen before sign-in) is auth-profile's
# claim and root-stack-routing's Jest.
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 60000
- takeScreenshot: "16-first-run-roundtrip-signed-out"

# The auth layer fires a real requestSync() on a live session
# (src/auth/service.ts). The root stack's access levels are exclusive
# (components/navigation/root-stack.tsx), so the data screen appearing means the
# first-sync gate lifted — from real sync progress, with no harness stamp.
- tapOn:
    id: "sign-in-email-input"
- inputText: "${MAESTRO_ROUNDTRIP_EMAIL}"
- tapOn:
    id: "sign-in-password-input"
- inputText: "${MAESTRO_ROUNDTRIP_PASSWORD}"
- tapOn:
    id: "sign-in-submit-button"
- extendedWaitUntil:
    notVisible:
      id: "sign-in-screen"
    timeout: 60000
# Decline only iOS credential saving; leave notification and other alerts intact.
- runFlow:
    when:
      visible:
        text: "Save Password\\?"
    commands:
      - tapOn:
          text: "Not Now"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 90000
- takeScreenshot: "17-first-run-roundtrip-bootstrapped"

# === 2. A reading entered on the device reaches the server ===
# Add opens the editor empty and focused (components/bodyweight/
# body-weight-screen.tsx), so the value goes straight in; the precise default
# date stays.
- openLink: "boga3://body-weight"
- extendedWaitUntil:
    visible: { id: "body-weight-add" }
    timeout: 30000
- tapOn: { id: "body-weight-add" }
- extendedWaitUntil:
    visible: { id: "weight-entry-value" }
    timeout: 15000
- inputText: "80"
# Tap Save in place, never scroll to it: the keyboard-avoiding Sheet keeps it
# on screen with the keyboard up or minimised (a sim that has seen the Mac
# keyboard), and a scroll swipes from mid-screen, which with the panel low is
# the backdrop, so the swipe lands as a tap there and dismisses the sheet.
- tapOn: { id: "weight-entry-save" }
- extendedWaitUntil:
    notVisible: { id: "weight-entry-sheet" }
    timeout: 15000

# Detailed enablement plus Broad reporting: writes remain synced muscle rows.
- openLink: "boga3://settings-muscles"
- extendedWaitUntil:
    visible: { id: "settings-muscles-screen" }
    timeout: 15000
- tapOn: { id: "settings-muscle-preset-detailed" }
- extendedWaitUntil:
    visible: { id: "settings-enabled-muscles-row" }
    timeout: 15000
- tapOn: { id: "settings-enabled-muscles-row" }
- extendedWaitUntil:
    visible: { id: "settings-enabled-muscles-screen" }
    timeout: 15000
# Final two-row card: Calves is fully visible clear of native chrome at the
# scroll end, but cannot reach the centre (the end-of-content exception).
- scrollUntilVisible:
    element: { id: "settings-track-calves" }
    direction: DOWN
    timeout: 15000
- tapOn: { id: "settings-track-calves" }
- extendedWaitUntil:
    visible: { id: "settings-track-calves", checked: false }
    timeout: 15000
# Last row: fully visible clear of chrome, but cannot reach viewport centre.
- scrollUntilVisible:
    element: { id: "settings-track-tibialis_anterior" }
    direction: DOWN
- tapOn: { id: "settings-track-tibialis_anterior" }
- extendedWaitUntil:
    visible: { id: "settings-track-tibialis_anterior", checked: false }
    timeout: 15000
- tapOn: "Back"
- extendedWaitUntil:
    visible: { id: "settings-enabled-muscles-row" }
    timeout: 15000
- tapOn: { id: "settings-muscle-preset-broad" }
- extendedWaitUntil:
    visible: { id: "settings-muscle-preset-broad", selected: true }
    timeout: 15000
- takeScreenshot: "18a-first-run-roundtrip-muscles-broad"

# The saves nudge the scheduler (src/sync/write-nudge.ts), whose cycle pushes
# the reading and the muscle rows. Pending changes reaching 0 is the upload
# proof AND the barrier for the wipe below: without it clearState can beat the
# push. The id+text matcher targets the dirty-count field, so an unrelated "0"
# cannot satisfy it. The count is on Settings → Data & sync.
- openLink: "boga3://settings-data-sync"
- extendedWaitUntil:
    visible:
      id: "settings-sync-status-dirty-count"
      text: "0"
    timeout: 60000
- takeScreenshot: "18-first-run-roundtrip-reading-synced"

# === 3. Full wipe + fresh sign-in: the reading comes back from the server ===
# Same dev-menu dismissal as step 1.
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: "${MAESTRO_DEV_CLIENT_URL}"
- retry:
    maxRetries: 3
    commands:
      - extendedWaitUntil:
          visible:
            text: "Continue"
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Continue"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Close"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-email-input"
- inputText: "${MAESTRO_ROUNDTRIP_EMAIL}"
- tapOn:
    id: "sign-in-password-input"
- inputText: "${MAESTRO_ROUNDTRIP_PASSWORD}"
- tapOn:
    id: "sign-in-submit-button"
- extendedWaitUntil:
    notVisible:
      id: "sign-in-screen"
    timeout: 60000
# Decline only iOS credential saving; leave notification and other alerts intact.
- runFlow:
    when:
      visible:
        text: "Save Password\\?"
    commands:
      - tapOn:
          text: "Not Now"
- extendedWaitUntil:
    visible:
      id: "today-screen"
    timeout: 90000
# After the wipe the server is the only place this reading exists.
- openLink: "boga3://body-weight"
- extendedWaitUntil:
    visible: { id: "body-weight-reading-.*", text: "Edit 80, .*" }
    timeout: 30000
- takeScreenshot: "19-first-run-roundtrip-reading-restored"
# Restored reporting is Broad; inspect preserved entry enablement on its page.
- openLink: "boga3://settings-muscles"
- extendedWaitUntil:
    visible: { id: "settings-muscle-preset-broad", selected: true }
    timeout: 15000
- assertNotVisible: { id: "settings-enabled-muscles-row" }
- openLink: "boga3://settings-enabled-muscles"
- extendedWaitUntil:
    visible: { id: "settings-enabled-muscles-screen" }
    timeout: 15000
# Final two-row card: Calves is fully visible clear of native chrome at the
# scroll end, but cannot reach the centre (the end-of-content exception).
- scrollUntilVisible:
    element: { id: "settings-track-calves" }
    direction: DOWN
    timeout: 15000
- assertVisible: { id: "settings-track-calves", checked: false }
# Last row; fully visible is sufficient and clear of the native header.
- scrollUntilVisible:
    element: { id: "settings-track-tibialis_anterior" }
    direction: DOWN
- assertVisible: { id: "settings-track-tibialis_anterior", checked: false }
- takeScreenshot: "20-first-run-roundtrip-muscles-restored"

# === 4. Native destructive merge and stale-edit recovery ===
# Proves menu -> page sheet -> native Alert ordering, keyboard dismissal,
# Cancel writes nothing, confirmation conversion copy, and native review actions.
# Jest cannot prove iOS modal/Alert presentation or the scheduler-to-review wiring.
- runScript:
    file: ../scripts/exercise-merge-device.js
    env:
      STEP: seed
      SUPABASE_URL: ${MAESTRO_ROUNDTRIP_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${MAESTRO_ROUNDTRIP_SUPABASE_ANON_KEY}
      EMAIL: ${MAESTRO_ROUNDTRIP_EMAIL}
      PASSWORD: ${MAESTRO_ROUNDTRIP_PASSWORD}
- runScript:
    file: ../scripts/exercise-merge-device.js
    env: { STEP: invalid }
- openLink: "boga3://settings-data-sync"
- tapOn: { id: "settings-sync-status-refresh-button" }
- extendedWaitUntil:
    visible: { id: "settings-sync-status-dirty-count", text: "0" }
    timeout: 60000
- openLink: "boga3://exercise-catalog"
- extendedWaitUntil:
    visible: "Exercise filter input"
    timeout: 30000
- tapOn: "Exercise filter input"
- inputText: "Maestro Merge Source"
- extendedWaitUntil:
    visible: "Exercise actions Maestro Merge Source"
    timeout: 60000
- tapOn: "Exercise actions Maestro Merge Source"
- extendedWaitUntil:
    visible: { id: "exercise-action-merge" }
    timeout: 15000
- takeScreenshot: "21-merge-danger-action"
- tapOn: { id: "exercise-action-merge" }
- extendedWaitUntil:
    visible: { id: "exercise-merge-search" }
    timeout: 15000
- takeScreenshot: "22-merge-picker"
- tapOn: { id: "exercise-merge-search" }
- inputText: "Maestro Merge Destination"
- tapOn: "Select exercise Maestro Merge Destination"
- extendedWaitUntil:
    visible: "Correct stored weights in the session on .* before merging."
    timeout: 60000
- takeScreenshot: "22a-merge-validation-error"
- runScript:
    file: ../scripts/exercise-merge-device.js
    env: { STEP: repair }
- tapOn: "Retry"
- extendedWaitUntil:
    visible: "Merge exercises?"
    timeout: 60000
- assertVisible: ".*Move 1 set from Maestro Merge Source to Maestro Merge Destination.*Weights will be halved.*"
- takeScreenshot: "23-merge-confirmation"
- tapOn: "Cancel"
- assertVisible: "Exercise actions Maestro Merge Source"
- tapOn: "Exercise actions Maestro Merge Source"
- tapOn: { id: "exercise-action-merge" }
- extendedWaitUntil:
    visible: { id: "exercise-merge-search" }
    timeout: 15000
- tapOn: { id: "exercise-merge-search" }
- inputText: "Maestro Merge Destination"
- tapOn: "Select exercise Maestro Merge Destination"
- extendedWaitUntil:
    visible: "Merge exercises?"
    timeout: 60000
- tapOn: { text: "Merge", index: 0 }
- extendedWaitUntil:
    notVisible: "Exercise actions Maestro Merge Source"
    timeout: 60000
- assertNotVisible: "Exercise merged."
- takeScreenshot: "24-merge-completed-catalogue"
- runScript:
    file: ../scripts/exercise-merge-device.js
    env: { STEP: stale }
- openLink: "boga3://settings-data-sync"
- tapOn: { id: "settings-sync-status-refresh-button" }
- extendedWaitUntil:
    visible: { id: "settings-merge-review" }
    timeout: 60000
- takeScreenshot: "25-merge-pending-review"
- tapOn: { id: "settings-merge-review" }
- extendedWaitUntil:
    visible: "Apply saved changes"
    timeout: 30000
- assertVisible: "Maestro Merge Destination"
- assertVisible: "20"
- assertVisible: "25"
- takeScreenshot: "26-merge-review"
- tapOn: "Apply saved changes"
- extendedWaitUntil:
    visible: "No changes need review."
    timeout: 60000
- takeScreenshot: "27-merge-review-resolved"
- runScript:
    file: ../scripts/exercise-merge-device.js
    env: { STEP: verify }
