appId: com.dinoderek.mobile
---
# Exercise catalogue: create an exercise (ios-data-smoke lane, infra-free).
#
# Proves:
#   1. `+` opens the exercise editor page; a name typed on the keyboard and a
#      muscles picked in both picker sheets save to the device's SQLite,
#      the page goes back, and the catalogue shows `Exercise created.`.
#   2. Both detailed lists reach the bottom and return to the top, keep the
#      title fixed, and accept off-screen choices without dismissing the sheet.
# Why device:
#   1. a pushed page with a sheet over it, the keyboard, and the on-device
#      expo-sqlite write.
#   2. Native bounded layout, touch scrolling and sheet gesture isolation cannot
#      run in the Jest renderer.
# Jest counterpart: __tests__/exercise-catalog-screen.test.tsx (the
#   catalogue over the browser fixture: the create read back from the database
#   and listed, grouping, sort and never-done controls, Manage and row sheets,
#   bounded scroll composition, both role selections and persistence, empty
#   muscle lists, editor validation, search, no matches, history failure
#   and Retry), __tests__/exercise-list-controls.test.tsx,
#   __tests__/exercise-picker.test.tsx (shared preferences, preselection,
#   plan suggestions, swap, results tappable with the keyboard up),
#   __tests__/exercise-page-screen.test.tsx (swap).

- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-browser&teleport=exercise-catalog"
# Wait for the fixture's catalogue, not the previous screen (spec 06 rule 4).
- extendedWaitUntil:
    visible: "Chest exercises 25"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000

- tapOn:
    id: "create-new-exercise-button"
- extendedWaitUntil:
    visible:
      id: "exercise-editor-name-input"
    timeout: 10000
- tapOn:
    id: "exercise-editor-name-input"
- inputText: "Maestro Catalogue Press"
- pressKey: Enter
- tapOn:
    id: "exercise-editor-primary-muscle-trigger"
- extendedWaitUntil:
    visible:
      id: "exercise-editor-muscle-selector-list"
    timeout: 10000
- takeScreenshot: "primary-muscles-top"
# Tibialis is the last row: it cannot centre, and the sheet's bottom padding
# keeps its first fully visible position clear of chrome.
- scrollUntilVisible:
    element: { id: "exercise-editor-muscle-option-tibialis_anterior" }
    direction: DOWN
- assertVisible: "Primary muscles"
- tapOn: { id: "exercise-editor-muscle-option-tibialis_anterior" }
- assertVisible: "Primary muscles"
- takeScreenshot: "primary-muscles-bottom"
# Pectoralis starts the content, clear of the fixed title; no centring needed.
- scrollUntilVisible:
    element: { id: "exercise-editor-muscle-option-chest" }
    direction: UP
- tapOn: { id: "exercise-editor-muscle-option-chest" }
- assertVisible: "Primary muscles"
# Both modes retain the existing stay-open multiselect. Dismiss via backdrop.
- tapOn: { point: "50%,8%" }
- extendedWaitUntil:
    notVisible: { id: "exercise-editor-muscle-selector-list" }
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "exercise-editor-secondary-muscle-trigger"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: { id: "exercise-editor-secondary-muscle-trigger" }
- extendedWaitUntil:
    visible: "Secondary muscles"
    timeout: 10000
- takeScreenshot: "secondary-muscles-top"
# The primary Tibialis is excluded, making Calves the final eligible row.
- scrollUntilVisible:
    element: { id: "exercise-editor-muscle-option-calves" }
    direction: DOWN
- assertVisible: "Secondary muscles"
- tapOn: { id: "exercise-editor-muscle-option-calves" }
- assertVisible: "Secondary muscles"
- takeScreenshot: "secondary-muscles-bottom"
# Serratus starts this list (Pectoralis is primary), clear of the fixed title.
- scrollUntilVisible:
    element: { id: "exercise-editor-muscle-option-serratus_anterior" }
    direction: UP
- tapOn: { id: "exercise-editor-muscle-option-serratus_anterior" }
- assertVisible: "Secondary muscles"
- tapOn: { point: "50%,8%" }
- extendedWaitUntil:
    notVisible: { id: "exercise-editor-muscle-selector-list" }
    timeout: 10000
- takeScreenshot: "editor-filled"
- scrollUntilVisible:
    element:
      id: "exercise-editor-save"
    direction: DOWN
    centerElement: true
- tapOn: "Save exercise definition"
- extendedWaitUntil:
    visible:
      text: "Exercise created."
    timeout: 10000
- takeScreenshot: "catalogue-created-notice"

# Native error/Retry stays in the picker; an unsigned infra-free install cannot merge.
# Why device: action-sheet dismissal and a keyboard-up picker must remain interactive.
- tapOn: "Exercise filter input"
- inputText: "Barbell Bench Press"
- extendedWaitUntil:
    visible: "Exercise actions Barbell Bench Press"
    timeout: 15000
- tapOn: "Exercise actions Barbell Bench Press"
- tapOn: { id: "exercise-action-merge" }
- extendedWaitUntil:
    visible: { id: "exercise-merge-search" }
    timeout: 15000
- tapOn: { id: "exercise-merge-search" }
- inputText: "Cable Bench Press"
- tapOn: "Select exercise Cable Bench Press"
- extendedWaitUntil:
    visible: "Sign in to merge exercises."
    timeout: 15000
- takeScreenshot: "merge-picker-sign-in-error"
- tapOn: { id: "exercise-merge-sheet-close" }
- assertVisible: "Exercise actions Barbell Bench Press"
