appId: com.dinoderek.mobile
---
# Exercise catalogue: create an exercise (ios-data-smoke lane, infra-free).
#
# Proves:
#   1. `+` opens the exercise editor page; a name typed on the keyboard and a
#      primary muscle picked in its picker sheet save to the device's SQLite,
#      the page goes back, and the catalogue shows `Exercise created.`.
# Why device:
#   1. a pushed page with a sheet over it, the keyboard, and the on-device
#      expo-sqlite write.
# Jest counterpart: __tests__/exercise-catalog-screen.test.tsx (the
#   catalogue over the browser fixture: the create read back from the database
#   and listed, grouping, sort and never-done controls, Manage and row sheets,
#   editor validation and muscle selection, search, no matches, history failure
#   and Retry), __tests__/exercise-list-controls.test.tsx,
#   __tests__/exercise-picker.test.tsx (shared preferences, preselection,
#   plan suggestions, swap, results tappable with the keyboard up),
#   __tests__/exercise-page-screen.test.tsx (swap).

- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-browser&teleport=exercise-catalog"
# Wait for the fixture's catalogue, not the previous screen (spec 06 rule 4).
- extendedWaitUntil:
    visible: "Chest exercises 25"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000

- tapOn:
    id: "create-new-exercise-button"
- extendedWaitUntil:
    visible:
      id: "exercise-editor-name-input"
    timeout: 10000
- tapOn:
    id: "exercise-editor-name-input"
- inputText: "Maestro Catalogue Press"
- pressKey: Enter
- tapOn:
    id: "exercise-editor-primary-muscle-trigger"
- extendedWaitUntil:
    visible:
      id: "exercise-editor-muscle-selector-list"
    timeout: 10000
- tapOn:
    id: "exercise-editor-muscle-option-chest"
- extendedWaitUntil:
    visible:
      id: "exercise-editor-secondary-muscle-trigger"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "editor-filled"
- scrollUntilVisible:
    element:
      id: "exercise-editor-save"
    direction: DOWN
- tapOn: "Save exercise definition"
- extendedWaitUntil:
    visible:
      text: "Exercise created."
    timeout: 10000
- takeScreenshot: "catalogue-created-notice"

# Native error/Retry stays in the picker; an unsigned infra-free install cannot merge.
# Why device: action-sheet dismissal and a keyboard-up picker must remain interactive.
- tapOn: "Exercise filter input"
- inputText: "Barbell Bench Press"
- extendedWaitUntil:
    visible: "Exercise actions Barbell Bench Press"
    timeout: 15000
- tapOn: "Exercise actions Barbell Bench Press"
- tapOn: { id: "exercise-action-merge" }
- extendedWaitUntil:
    visible: { id: "exercise-merge-search" }
    timeout: 15000
- tapOn: { id: "exercise-merge-search" }
- inputText: "Cable Bench Press"
- tapOn: "Select exercise Cable Bench Press"
- extendedWaitUntil:
    visible: "Sign in to merge exercises."
    timeout: 15000
- takeScreenshot: "merge-picker-sign-in-error"
- tapOn: { id: "exercise-merge-sheet-close" }
- assertVisible: "Exercise actions Barbell Bench Press"
