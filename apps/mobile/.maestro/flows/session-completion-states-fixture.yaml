appId: com.dinoderek.mobile
---
- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_m24_completion_one_pr&presentation=completion"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
- assertVisible: "Session complete"
- assertVisible: "Personal records"
- assertVisible:
    id: "session-completion-pr-seed_barbell_back_squat"
- assertNotVisible:
    id: "session-completion-pr-pager"
- scrollUntilVisible:
    element:
      id: "session-completion-context"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "session-completion-sets"
- assertVisible:
    id: "session-completion-muscle-quads"
- scrollUntilVisible:
    element:
      id: "session-completion-exercise-maestro_m24_completion_one_pr_squat"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- takeScreenshot: "session-completion-one-pr"

- openLink: "boga3://maestro-harness?fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_m24_completion_no_pr&presentation=completion&maestroCatalog=fail-once"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
- assertVisible: "Session complete"
- assertNotVisible: "Personal records"
- assertVisible:
    id: "session-completion-muscle-empty-state"
- assertVisible: "Muscle breakdown unavailable."
- assertNotVisible: "Retry session muscle load"
- assertNotVisible:
    id: "session-completion-view-muscle-load"
- takeScreenshot: "session-completion-catalog-error"
- scrollUntilVisible:
    element:
      id: "session-completion-done"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- takeScreenshot: "session-completion-safe-done"

- openLink: "boga3://maestro-harness?fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_m24_completion_unmapped&presentation=completion"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
- assertVisible: "Session complete"
- assertNotVisible: "Personal records"
- assertVisible: "No mapped working sets for this session."
- assertNotVisible:
    id: "session-completion-view-muscle-load"
- takeScreenshot: "session-completion-unmapped"

# A completion target that does not exist: the top bar without Done, and one
# safe exit back to Progress.
- openLink: "boga3://maestro-harness?fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_missing_session&presentation=completion"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-completion-safe-exit"
    timeout: 30000
- assertNotVisible:
    id: "session-completion-done"
- takeScreenshot: "session-completion-unavailable"

# Completed edit (redesign step 6b-1): a completed session's `Edit` opens the
# session view on it — Start/End in place of Time, `Done` in place of Finish.
# A set changes on the exercise page, an invalid Start pauses autosave with a
# notice, a valid one clears it, and Done returns to the completed session,
# which reads the edits back without replaying completion.
- openLink: "boga3://maestro-harness?fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_m24_completion_one_pr"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-screen"
    timeout: 30000
- tapOn:
    id: "completed-session-detail-edit-button"
- extendedWaitUntil:
    visible:
      id: "session-view-done-button"
    timeout: 30000
- assertVisible: "Edit session"
- assertVisible:
    id: "session-view-start-time"
- assertVisible:
    id: "session-view-end-time"
- assertNotVisible:
    id: "session-view-finish-button"
- assertNotVisible:
    id: "session-view-options-button"
- takeScreenshot: "completed-edit-session-view"

# Change the set on the exercise page: 275 × 5 becomes 275 × 6.
- tapOn:
    id: "session-view-exercise-maestro_m24_completion_one_pr_squat"
- extendedWaitUntil:
    visible:
      id: "exercise-page"
    timeout: 15000
- tapOn:
    id: "exercise-set-1-open"
- extendedWaitUntil:
    visible:
      id: "exercise-set-logger"
    timeout: 5000
- tapOn:
    id: "exercise-set-logger-reps"
- eraseText: 3
- inputText: "6"
- hideKeyboard:
    optional: true
- tapOn:
    id: "exercise-set-logger-commit"
- extendedWaitUntil:
    visible:
      id: "exercise-set-1-values"
      text: "275.0 × 6"
    timeout: 5000
- takeScreenshot: "completed-edit-exercise-page"
- tapOn:
    id: "exercise-page-back"
- extendedWaitUntil:
    visible:
      id: "session-view-done-button"
    timeout: 15000
- assertVisible:
    id: "session-view-exercise-maestro_m24_completion_one_pr_squat-set-1"

# An invalid Start: its error and the autosave-paused notice.
- tapOn:
    id: "session-view-start-time"
- eraseText: 20
- inputText: "2026-02-30 10:00"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "session-view-start-time-error"
    timeout: 5000
- assertVisible:
    id: "session-view-times-notice"
    text: "Autosave paused until Start/End times are valid."
- takeScreenshot: "completed-edit-times-invalid"

# A valid Start clears both; Done saves and goes back to the completed session.
- tapOn:
    id: "session-view-start-time"
- eraseText: 20
- inputText: "2026-01-05 07:30"
- pressKey: Enter
- assertNotVisible:
    id: "session-view-start-time-error"
- assertNotVisible:
    id: "session-view-times-notice"
- takeScreenshot: "completed-edit-times-valid"
- tapOn:
    id: "session-view-done-button"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-screen"
    timeout: 30000
- assertVisible:
    id: "completed-session-detail-times-start"
    text: "Start 2026-01-05 07:30"
# The squat's first row reads the edit back: 275.0 × 6, not the fixture's × 5.
- assertVisible:
    id: "completed-session-detail-exercise-maestro_m24_completion_one_pr_squat-set-1-values"
    text: "275.0 × 6"
- assertNotVisible:
    id: "session-completion-presentation"
- takeScreenshot: "completed-edit-read-back"

# View Session in the design language (View Session restyle): the summary card,
# the squat's record band (its 1RM beats every other session), the exercise ⋮
# with Append, and the session ⋮ deleting and undeleting — a band while
# deleted, and no Edit (the session view only edits a live session).
- assertVisible:
    id: "completed-session-detail-summary"
- assertVisible:
    id: "completed-session-detail-exercise-maestro_m24_completion_one_pr_squat-record"
- takeScreenshot: "view-session-detail"
- tapOn:
    id: "completed-session-detail-exercise-options-maestro_m24_completion_one_pr_squat"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-append-exercise-button-maestro_m24_completion_one_pr_squat"
    timeout: 5000
- takeScreenshot: "view-session-exercise-options"
# The design-language sheet has no Cancel: tap the backdrop above it.
- tapOn:
    point: "50%,20%"
- extendedWaitUntil:
    notVisible:
      id: "completed-session-detail-exercise-sheet"
    timeout: 5000
- tapOn:
    id: "completed-session-detail-options-button"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-options-sheet"
    timeout: 5000
- takeScreenshot: "view-session-options"
- tapOn:
    id: "completed-session-detail-delete-button"
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-deleted-band"
    timeout: 10000
- assertNotVisible:
    id: "completed-session-detail-edit-button"
- takeScreenshot: "view-session-deleted"
- tapOn:
    id: "completed-session-detail-options-button"
- extendedWaitUntil:
    visible: "Undelete session"
    timeout: 5000
- tapOn:
    id: "completed-session-detail-delete-button"
- extendedWaitUntil:
    notVisible:
      id: "completed-session-detail-deleted-band"
    timeout: 10000
- assertVisible:
    id: "completed-session-detail-edit-button"

# A session that does not exist: the in-route state, with the top bar's back.
- openLink: "boga3://maestro-harness?fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_missing_session"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "completed-session-detail-empty"
    timeout: 30000
- assertVisible:
    id: "completed-session-detail-back"
- takeScreenshot: "view-session-not-found"

# Two PRs, the share preview and the share-image failure (moved here from the
# deleted exercise-block-history flow, redesign 6b-3). The fixture's
# newest completed session beats both the squat and the bench history, so the
# completion screen lists two PRs side by side. `maestroShare=fail-once` makes
# the first share-image render fail, so the preview shows its inline error; the
# second opens the native share sheet, which is dismissed without a target.
- openLink: "boga3://maestro-harness?fixture=completion-two-prs&teleport=completed-session&sessionId=maestro_m24_completion_two_prs&presentation=completion&maestroShare=fail-once"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
- assertVisible: "Session complete"
- assertVisible: "Personal records"
- assertVisible:
    id: "session-completion-pr-seed_barbell_back_squat"
- assertVisible:
    id: "session-completion-pr-seed_barbell_bench_press"
- assertNotVisible:
    id: "session-completion-pr-pager"
- takeScreenshot: "session-completion-multiple-prs-all"
- scrollUntilVisible:
    element:
      id: "session-completion-context"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "session-completion-sets"
- scrollUntilVisible:
    element:
      id: "session-completion-exercise-volume"
    direction: DOWN
    visibilityPercentage: 80
    centerElement: true
- assertVisible: "Exercise volume"
- takeScreenshot: "session-completion-exercise-volume"
- scrollUntilVisible:
    element:
      id: "session-completion-share-session"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "session-completion-share-session"
- waitForAnimationToEnd
- takeScreenshot: "session-share-preview-all-prs"
- tapOn:
    id: "session-share-image"
- extendedWaitUntil:
    visible:
      id: "session-share-error"
    timeout: 10000
- takeScreenshot: "session-share-image-error"
- tapOn:
    id: "session-share-image"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- takeScreenshot: "session-share-platform-share-sheet"
# Dismiss without selecting a destination; this proves image launch/cancel only.
- swipe:
    start: "50%,55%"
    end: "50%,95%"
    duration: 500
- extendedWaitUntil:
    notVisible: "Copy"
    timeout: 10000
# The share sheet has no Cancel: tap the backdrop above it.
- tapOn:
    point: "50%,8%"
- extendedWaitUntil:
    notVisible:
      id: "session-share-preview"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "session-completion-context"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "session-completion-muscle-breakdown"
- assertVisible: "No mapped working sets for this session."
- assertNotVisible:
    id: "session-completion-view-muscle-load"
- takeScreenshot: "session-completion-consolidated-summary"
- scrollUntilVisible:
    element:
      id: "session-completion-done"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- takeScreenshot: "session-completion-done"
