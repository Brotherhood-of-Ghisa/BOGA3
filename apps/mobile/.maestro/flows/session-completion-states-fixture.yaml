appId: com.dinoderek.mobile
---
# Completed-session share (ios-data-smoke lane, infra-free).
#
# Proves:
#   1. the completion screen's share preview opens the native share sheet,
#      which dismisses without a destination, and the preview's backdrop
#      closes it.
# Why device:
#   1. the native share sheet (the preview captured to an image and handed to
#      expo-sharing in the installed binary) and a real sheet backdrop.
# Jest counterpart: __tests__/completed-session-local-data.test.tsx
#   (every completion and detail state over the fixtures: records, grouping,
#   no-history and unmapped copy, missing sessions, delete/undelete, append,
#   share preview, edit read-back), __tests__/completed-session-detail-screen.test.tsx
#   (the capture and share calls, share failure and retry, backdrop dismissal),
#   __tests__/session-view-screen.test.tsx ("editing a completed session":
#   Start/End validation, autosave pause, an exercise-page edit saved by Done).

# The completion-two-prs fixture's newest session beats both histories.
- openLink: "boga3://maestro-harness?reset=data&fixture=completion-two-prs&teleport=completed-session&sessionId=maestro_m24_completion_two_prs&presentation=completion"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
# No centerElement: this target ends its scroll content, so it can never be
# centred; Maestro would add 5 no-op swipes (~9s) and pass anyway (spec 06 rule 3).
- scrollUntilVisible:
    element:
      id: "session-completion-share-session"
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: "session-completion-share-session"
- extendedWaitUntil:
    visible:
      id: "session-share-image"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: "session-share-preview-all-prs"
- tapOn:
    id: "session-share-image"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- takeScreenshot: "session-share-platform-share-sheet"
# Dismiss without selecting a destination; this proves image launch/cancel only.
- swipe:
    start: "50%,55%"
    end: "50%,95%"
    duration: 500
- extendedWaitUntil:
    notVisible: "Copy"
    timeout: 10000
# The share preview is a page sheet: its X closes it.
- tapOn:
    id: "session-share-preview-close"
- extendedWaitUntil:
    notVisible:
      id: "session-share-preview"
    timeout: 10000
