appId: com.dinoderek.mobile
---
- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_m24_completion_one_pr&presentation=completion"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
- assertVisible: "Session complete"
- assertVisible: "Personal records"
- assertVisible:
    id: "session-completion-pr-seed_barbell_back_squat"
- assertNotVisible:
    id: "session-completion-pr-pager"
- scrollUntilVisible:
    element:
      id: "session-completion-context"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "session-completion-working-sets"
- scrollUntilVisible:
    element:
      id: "session-completion-exercise-maestro_m24_completion_one_pr_squat"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- takeScreenshot: "session-completion-one-pr"

- openLink: "boga3://maestro-harness?fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_m24_completion_no_pr&presentation=completion&maestroCatalog=fail-once"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
- assertVisible: "Session complete"
- assertNotVisible: "Personal records"
- assertVisible:
    id: "session-muscle-load-row"
- assertVisible: "Unavailable · 1 set (1 working)"
- takeScreenshot: "session-completion-catalog-error"
- tapOn:
    id: "session-muscle-load-row"
- extendedWaitUntil:
    visible: "Muscle load unavailable"
    timeout: 10000
- assertVisible: ".*Workout logging, autosave, and submission are unaffected.*"
- takeScreenshot: "session-completion-catalog-error-detail"
- tapOn: "Close session muscle load"
- tapOn: "Retry session muscle load"
- extendedWaitUntil:
    visible: "4 muscles · 1 set (1 working)"
    timeout: 10000
- takeScreenshot: "session-completion-no-pr"
- scrollUntilVisible:
    element:
      id: "session-completion-done"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- takeScreenshot: "session-completion-safe-done"

- openLink: "boga3://maestro-harness?fixture=exercise-block-history&teleport=completed-session&sessionId=maestro_m24_completion_unmapped&presentation=completion"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
- assertVisible: "Session complete"
- assertNotVisible: "Personal records"
- assertVisible: "No mapped muscle load · 1 set (1 working)"
- takeScreenshot: "session-completion-unmapped"
- tapOn:
    id: "session-muscle-load-row"
- extendedWaitUntil:
    visible: "Close session muscle load"
    timeout: 10000
- assertVisible: "The performed exercises do not currently contribute to muscle analytics."
- takeScreenshot: "session-completion-unmapped-detail"
