appId: com.dinoderek.mobile
---
# --- Seed exercise history data and land on Stats/History screen ---
- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-block-history&teleport=session-list"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000

# --- 01: Exercise view is shown by default ---
- assertVisible: "Time range"
- assertVisible: "Breakdown"
- assertVisible:
    id: "stats-period-chip-7"
- assertVisible:
    id: "stats-period-chip-30"
- assertVisible:
    id: "stats-view-mode-chip-exercise"
- assertVisible:
    id: "stats-view-mode-chip-muscle"
- assertVisible:
    id: "stats-exercise-list"
- assertVisible:
    id: "stats-card-sessions"
- assertVisible:
    id: "stats-card-sets"
- assertVisible:
    text: ".*W/SETS.*"
- takeScreenshot: "01-exercise-view-default"

# --- Switch to muscle view via its explicit option ---
- tapOn:
    id: "stats-view-mode-chip-muscle"
- extendedWaitUntil:
    visible:
      id: "stats-scroll"
    timeout: 10000

# --- 02: Muscle view shows summary cards ---
- assertVisible:
    id: "stats-card-sessions"
- assertVisible:
    id: "stats-card-sets"
- scrollUntilVisible:
    element:
      id: "stats-family-header-legs"
    direction: DOWN
- assertVisible:
    text: ".*6 sets, 4 near-failure sets.*"
- assertVisible:
    id: "stats-family-header-legs"
- assertVisible:
    id: "stats-muscle-row-quads"
- takeScreenshot: "02-muscle-failure-backgrounds-7-days"

# --- 03: The same counts rescale for the 30-day period ---
- tapOn:
    id: "stats-period-chip-30"
- extendedWaitUntil:
    visible:
      text: ".*10 sets, 7 near-failure sets.*"
    timeout: 10000
- assertVisible:
    id: "stats-muscle-row-quads"
- takeScreenshot: "03-muscle-failure-backgrounds-30-days"

# --- Switch back to exercise view via its explicit option ---
- tapOn:
    id: "stats-view-mode-chip-exercise"
- extendedWaitUntil:
    visible:
      id: "stats-exercise-list"
    timeout: 10000

# --- 04: Exercise list is restored ---
- assertVisible:
    id: "stats-exercise-list"
- assertVisible:
    id: "stats-exercise-row-seed_barbell_back_squat"
- takeScreenshot: "04-back-to-exercise-view"

# --- 05: Tap seeded exercise row to open heatmap overlay ---
- tapOn:
    id: "stats-exercise-row-seed_barbell_back_squat"
- extendedWaitUntil:
    visible:
      id: "stats-exercise-history-close"
    timeout: 15000
- assertVisible:
    text: "Weekly training load"
- tapOn:
    id: "stats-exercise-history-view-chip-daily"
- extendedWaitUntil:
    visible:
      text: "Last 12 months"
    timeout: 3000
- takeScreenshot: "05-exercise-heatmap-daily"
- tapOn:
    id: "stats-exercise-history-view-chip-weekly"
- extendedWaitUntil:
    visible:
      text: "Weekly training load"
    timeout: 3000
- takeScreenshot: "05-exercise-heatmap-overlay"

# Dismiss exercise overlay via its accessible close control
- tapOn:
    id: "stats-exercise-history-close"
- extendedWaitUntil:
    notVisible:
      id: "stats-exercise-history-close"
    timeout: 5000

# --- Switch to muscle view for muscle overlay test ---
- tapOn:
    id: "stats-view-mode-chip-muscle"
- extendedWaitUntil:
    visible:
      id: "stats-scroll"
    timeout: 10000

# --- 06: Tap Chest muscle to open muscle heatmap overlay ---
- scrollUntilVisible:
    element:
      id: "stats-family-header-button-chest"
    direction: UP
- tapOn:
    id: "stats-family-header-button-chest"
- extendedWaitUntil:
    visible:
      id: "stats-muscle-history-close"
    timeout: 15000
- assertVisible:
    text: "Weekly training load"
- tapOn:
    id: "stats-muscle-history-view-chip-daily"
- extendedWaitUntil:
    visible:
      text: "Last 12 months"
    timeout: 3000
- takeScreenshot: "06-muscle-heatmap-daily"
- tapOn:
    id: "stats-muscle-history-view-chip-weekly"
- extendedWaitUntil:
    visible:
      text: "Weekly training load"
    timeout: 3000
- takeScreenshot: "06-muscle-heatmap-overlay"

# Close muscle overlay via close button
- tapOn:
    id: "stats-muscle-history-close"
- extendedWaitUntil:
    notVisible:
      id: "stats-muscle-history-close"
    timeout: 5000

# --- 07: Overlay dismissed, back to muscle view ---
- assertVisible:
    id: "stats-scroll"
- takeScreenshot: "07-overlay-dismissed"
