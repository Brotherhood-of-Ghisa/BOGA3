appId: com.dinoderek.mobile
---
# Data runtime smoke (ios-data-smoke lane, infra-free).
#
# Proves:
#   1. the harness `reset=data` runs the migrations on the device's
#      expo-sqlite and the backend-less build seeds its starter catalogue;
#   2. Train's Start opens an empty session; the picker sheet's keyboard search
#      finds the seeded Barbell Back Squat and adds it with an empty set;
#   3. the exercise page's logger takes weight and reps on the keyboard, one
#      tap cycles the first set's default `W-Up` to no effort (a working set,
#      so Stats counts it), and it commits `135.0 × 8`;
#   4. Finish (one confirmed set, no prompt) opens the completion screen, and
#      Done replaces it with Stats;
#   5. Progress → Exercise reads back the session just written: the only
#      on-device check of the Stats queries (their values over the harness
#      fixtures are stats-screen-local-data.test.tsx). Its filter row is
#      remembered on the device, so reopening Progress returns to Exercise.
#   6. history's page sheet snaps back after a short drag of its header, leaves
#      chart scrolling independent, and closes on a deliberate downward swipe.
# Why device:
#   1. and 5. the on-device expo-sqlite runtime and boot data layer;
#   2. and 3. a real sheet and the keyboard;
#   4. the root-stack replace after Finish.
#   6. the UIKit page-sheet swipe and the chart's own scroll inside it.
# Jest counterpart: __tests__/exercise-picker.test.tsx,
#   __tests__/exercise-page-screen.test.tsx (logger),
#   __tests__/set-effort-defaults.test.ts (first-set warm-up),
#   __tests__/session-view-model.test.ts (Finish prompts),
#   __tests__/completed-session-local-data.test.tsx (Done → Stats),
#   __tests__/stats-screen-local-data.test.tsx, __tests__/sessions-screen.test.tsx.
#   __tests__/ui-page-sheet.test.tsx (swipe, X and re-presentation decisions).
#
# maestro-ios-launch.sh has already opened the dev-client URL and blocks until
# Metro serves the entry bundle. Opening that URL again here races the harness
# navigation below: the delayed reload can replace an in-progress session with
# the initial Stats route. The smoke lane owns explicit dev-client launch
# coverage; this data lane starts with its app-owned reset + teleport deep link.
# The launch script pre-seeds the dev-menu onboarding off (spec 06 rule 4), so
# no sheet needs dismissing. Retry the reset link itself: iOS can occasionally
# remain on SpringBoard while the newly installed scheme is still registering.
- retry:
    maxRetries: 3
    commands:
      - openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
      - extendedWaitUntil:
          visible:
            id: "stats-history-screen"
          timeout: 30000
- takeScreenshot: "03-data-runtime-smoke-start"
# Train's Start opens the session view on a new, empty session.
- tapOn:
    id: "top-level-tab-train"
- extendedWaitUntil:
    visible:
      id: "train-start-empty-button"
    timeout: 15000
- tapOn:
    id: "train-start-empty-button"
- extendedWaitUntil:
    visible:
      id: "session-view-add-exercise"
    timeout: 30000
- tapOn:
    id: "session-view-add-exercise"
- tapOn: "Exercise filter input"
- inputText: "Barbell Back Squat"
- pressKey: Enter
# Pick the seeded "Barbell Back Squat" exercise by its accessibility label
# ("Select exercise <name>", exercise-picker.tsx) rather than a fragile
# coordinate tap. On a cold sim the picker list can render a beat later than on
# a warm one, so a coordinate tap raced the row layout and landed on empty
# space. Filtering by the exact seeded name yields a deterministic seeded row.
# Search expands matching families automatically; collapse/search
# behavior is covered by focused tests.
- extendedWaitUntil:
    visible:
      text: "Select exercise Barbell Back Squat"
    timeout: 15000
- tapOn:
    text: "Select exercise Barbell Back Squat"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- extendedWaitUntil:
    visible:
      text: "Barbell Back Squat, 0 of 1 sets done"
    timeout: 15000
# The card links to the exercise page, whose logger sits on the empty set.
- tapOn:
    text: "Barbell Back Squat, 0 of 1 sets done"
- extendedWaitUntil:
    visible:
      id: "exercise-set-logger"
    timeout: 15000
- takeScreenshot: "set-logger-empty"
- tapOn:
    id: "exercise-set-logger-weight"
- inputText: "135"
- tapOn:
    id: "exercise-set-logger-reps"
- inputText: "8"
# The first set defaults to W-Up; a warm-up-only exercise has no Stats
# footprint, so one tap cycles it to no effort, a working set.
- tapOn:
    id: "exercise-set-logger-effort"
- assertVisible:
    text: "Change effort, currently none"
# The logger's commit sits above the keyboard and the page scroll has
# keyboardShouldPersistTaps="handled", so the tap lands with the keyboard up
# (a hideKeyboard here cost ~4.3s).
- tapOn:
    id: "exercise-set-logger-commit"
- extendedWaitUntil:
    visible:
      id: "exercise-set-1-toggle"
      text: "Mark set 1 not performed"
    timeout: 10000
- assertVisible:
    id: "exercise-set-1-values"
    text: "135.0 × 8"
- takeScreenshot: "set-logger-confirmed"
- tapOn:
    id: "exercise-page-back"
- extendedWaitUntil:
    visible:
      text: "Barbell Back Squat, 1 of 1 sets done"
    timeout: 15000
# The session has one explicitly confirmed set, so Finish goes straight through
# with no incomplete, unconfirmed, or empty-row confirmation dialog.
- tapOn:
    id: "session-view-finish-button"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
# Completion is a mandatory post-submit presentation. Exercise the
# explicit Done exit before continuing this lane's history persistence checks.
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
# 5. The pinned switch opens exercise browsing without leaving Progress. Enter
# on the breakdown this step starts from rather than on whatever the last run
# of this lane left stored: the deep link overrides the remembered filter.
- openLink: "boga3://progress?breakdown=muscle"
- extendedWaitUntil:
    visible:
      id: "stats-muscle-table"
    timeout: 15000
- tapOn:
    id: "stats-view-mode-chip"
- extendedWaitUntil:
    visible:
      id: "stats-exercise-list"
    timeout: 15000
- assertVisible:
    id: "stats-exercise-row-seed_barbell_back_squat"
- assertNotVisible:
    id: "stats-exercise-list-empty"
- takeScreenshot: "05-data-runtime-smoke-exercise-list"
# One native gesture scenario; disclosure and browsing state remain Jest.
# Establish its Daily/window preconditions: data reset preserves saved preferences.
# This is setup for scrolling, not a new Settings claim (settings-progress.test.tsx).
- openLink: "boga3://settings"
- scrollUntilVisible:
    element:
      id: "settings-history-lookback"
    direction: DOWN
- tapOn:
    id: "settings-history-lookback"
- eraseText
- inputText: "52"
- hideKeyboard
- tapOn:
    id: "settings-heatmap-view-daily"
- openLink: "boga3://progress"
# Progress reopens on the breakdown chosen above: the filter row is remembered,
# so this returns to the exercise list without touching the switch again.
- extendedWaitUntil:
    visible:
      id: "stats-exercise-list"
    timeout: 15000
- tapOn:
    id: "stats-exercise-row-seed_barbell_back_squat"
- extendedWaitUntil:
    visible:
      id: "stats-exercise-history-header"
    timeout: 15000
- tapOn:
    id: "stats-exercise-history-metric-chip-workingSetCount"
- swipe:
    start: "50%,10%"
    end: "50%,14%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: "stats-exercise-history-header"
- takeScreenshot: "06-history-short-drag-restored"
# The month calendar scrolls vertically inside the native sheet. A month three
# months earlier starts below the viewport; centring it proves body scrolling
# without dismissing the sheet. Read-only tiles and calendar arithmetic remain Jest.
- evalScript: ${output.historyOlderMonthKey = (function() { var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 3); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); })()}
- scrollUntilVisible:
    element:
      id: "stats-exercise-history-heatmap-month-title-${output.historyOlderMonthKey}"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "stats-exercise-history-heatmap-month-title-${output.historyOlderMonthKey}"
- assertVisible:
    id: "stats-exercise-history-header"
- takeScreenshot: "07-history-chart-scrolled"
- swipe:
    from:
      id: "stats-exercise-history-header"
    direction: DOWN
    duration: 600
- extendedWaitUntil:
    notVisible:
      id: "stats-exercise-history-header"
    timeout: 10000
- assertVisible:
    id: "stats-exercise-row-seed_barbell_back_squat"
- takeScreenshot: "08-history-swipe-dismissed"
