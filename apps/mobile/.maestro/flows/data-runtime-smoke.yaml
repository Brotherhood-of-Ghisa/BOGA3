appId: com.dinoderek.mobile
---
# maestro-ios-launch.sh has already opened the dev-client URL and blocks until
# Metro serves the entry bundle. Opening that URL again here races the harness
# navigation below: the delayed reload can replace an in-progress recorder with
# the initial Stats route and surface the one-time developer menu. The smoke lane
# owns explicit dev-client launch coverage; this data lane starts with its
# app-owned reset + teleport deep link.
# A fresh dev-client install can defer its one-time onboarding sheet until the
# first post-launch app interaction. Retry the whole cold-start handshake: iOS
# can occasionally remain on SpringBoard while the newly installed scheme is
# still registering. `Continue` advances into the developer menu, whose
# accessible `Close` control returns to the app.
- retry:
    maxRetries: 3
    commands:
      - openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "stats-history-screen"
          timeout: 30000
- takeScreenshot: "03-data-runtime-smoke-start"
- openLink: "boga3://maestro-harness?reset=data&teleport=session-recorder"
- extendedWaitUntil:
    visible:
      id: "start-session-button"
    timeout: 30000
- tapOn:
    id: "start-session-button"
- extendedWaitUntil:
    visible:
      id: "session-recorder-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "No exercises logged yet."
    timeout: 30000
- tapOn: "Log new exercise"
- tapOn: "Exercise picker options"
- tapOn: "Turn grouping off"
- tapOn: "Exercise picker options"
- tapOn: "Exercise filter input"
- inputText: "Barbell Back Squat"
- hideKeyboard:
    optional: true
- tapOn: "Select Exercise"
# Pick the seeded "Barbell Back Squat" exercise by its accessibility label
# ("Select exercise <name>", session-recorder.tsx) rather than a fragile
# `point: "50%,26%"` coordinate tap. On a cold sim the picker list can render a
# beat later than on a warm one, so a coordinate tap raced the row layout and
# landed on empty space — leaving no exercise selected and failing the later
# "Weight for exercise 1 set 1" step. Filtering by the exact seeded name yields a
# deterministic seeded row. This smoke flow turns grouping off explicitly above;
# grouped collapse/search behavior is covered by focused tests.
- extendedWaitUntil:
    visible:
      text: "Select exercise Barbell Back Squat"
    timeout: 15000
- tapOn:
    text: "Select exercise Barbell Back Squat"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- assertVisible: "Quality for exercise 1 set 1: W-Up"
- takeScreenshot: "set-performance-normal-invalid"
- tapOn:
    id: "set-quality-button-1-1"
- assertVisible: "Quality for exercise 1 set 1: none"
- takeScreenshot: "effort-blank"
- tapOn:
    id: "set-quality-button-1-1"
- assertVisible: "Quality for exercise 1 set 1: RIR 3"
- takeScreenshot: "effort-rir3"
- longPressOn:
    id: "set-quality-button-1-1"
- tapOn: "Choose W-Up set type"

- tapOn: "Weight for exercise 1 set 1"
- inputText: "135"
- tapOn: "Reps for exercise 1 set 1"
- inputText: "8"
- hideKeyboard:
    optional: true
- takeScreenshot: "set-performance-normal-unconfirmed"
- assertNotVisible:
    id: "session-muscle-load-row"
- tapOn:
    id: "set-performance-control-1-1"
- takeScreenshot: "set-performance-normal-confirmed"
- scrollUntilVisible:
    element:
      id: "session-muscle-load-row"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- assertVisible: "4 muscles · 1 set (0 working)"
- takeScreenshot: "session-muscle-load-populated"
- tapOn:
    id: "session-muscle-load-row"
- extendedWaitUntil:
    visible:
      text: "Close session muscle load"
    timeout: 10000
- assertVisible:
    id: "session-muscle-load-muscle-quads"
- takeScreenshot: "session-muscle-load-sheet"
- tapOn: "Close session muscle load"
- scrollUntilVisible:
    element:
      id: "set-performance-control-1-1"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "set-performance-control-1-1"
- assertNotVisible:
    id: "session-muscle-load-row"
- takeScreenshot: "session-muscle-load-reversed"
- tapOn:
    id: "set-performance-control-1-1"
# The session has one explicitly confirmed set, so Submit goes straight through
# with no incomplete, unconfirmed, or empty-row confirmation dialog.
- scrollUntilVisible:
    element:
      id: "session-recorder-submit-button"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "session-recorder-submit-button"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
# M24 makes completion a mandatory post-submit presentation. Exercise the
# explicit Done exit before continuing this lane's history persistence checks.
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
# The workout this flow just logged through the recorder must show up in the
# Stats exercise list. This is the only on-device check of the recorder-write ->
# exercise-analytics read-back path: stats-screen-ux.yaml covers the same list,
# but from fixture rows inserted straight into SQLite, which bypass the recorder
# entirely. A change to how sets or session-exercises are persisted would leave
# that flow green and break this one.
- extendedWaitUntil:
    visible:
      id: "stats-exercise-list"
    timeout: 15000
- assertVisible:
    id: "stats-exercise-row-seed_barbell_back_squat"
- assertNotVisible:
    id: "stats-exercise-list-empty"
- takeScreenshot: "05-data-runtime-smoke-exercise-list"
- tapOn:
    id: "stats-card-sessions"
- extendedWaitUntil:
    visible:
      id: "sessions-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "session-list-loading-state"
    timeout: 10000
- assertVisible: "Sessions"
- assertNotVisible: "(tabs)"
- assertVisible:
    id: "completed-history-scroll"
- takeScreenshot: "04-data-runtime-smoke-success"
