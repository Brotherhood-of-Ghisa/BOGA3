appId: com.dinoderek.mobile
---
# maestro-ios-launch.sh has already opened the dev-client URL and blocks until
# Metro serves the entry bundle. Opening that URL again here races the harness
# navigation below: the delayed reload can replace an in-progress session with
# the initial Stats route and surface the one-time developer menu. The smoke lane
# owns explicit dev-client launch coverage; this data lane starts with its
# app-owned reset + teleport deep link.
# A fresh dev-client install can defer its one-time onboarding sheet until the
# first post-launch app interaction. Retry the whole cold-start handshake: iOS
# can occasionally remain on SpringBoard while the newly installed scheme is
# still registering. `Continue` advances into the developer menu, whose
# accessible `Close` control returns to the app.
- retry:
    maxRetries: 3
    commands:
      - openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "stats-history-screen"
          timeout: 30000
- takeScreenshot: "03-data-runtime-smoke-start"
# Train's Start opens the session view on a new, empty session.
- tapOn:
    id: "top-level-tab-train"
- extendedWaitUntil:
    visible:
      id: "train-start-empty-button"
    timeout: 15000
- tapOn:
    id: "train-start-empty-button"
- extendedWaitUntil:
    visible:
      id: "session-view-add-exercise"
    timeout: 30000
- tapOn:
    id: "session-view-add-exercise"
- tapOn: "Exercise picker options"
- tapOn: "Turn grouping off"
- tapOn: "Exercise picker options"
- tapOn: "Exercise filter input"
- inputText: "Barbell Back Squat"
- hideKeyboard:
    optional: true
- tapOn: "Select Exercise"
# Pick the seeded "Barbell Back Squat" exercise by its accessibility label
# ("Select exercise <name>", exercise-picker.tsx) rather than a fragile
# coordinate tap. On a cold sim the picker list can render a beat later than on
# a warm one, so a coordinate tap raced the row layout and landed on empty
# space. Filtering by the exact seeded name yields a deterministic seeded row.
# This smoke flow turns grouping off explicitly above; grouped collapse/search
# behavior is covered by focused tests.
- extendedWaitUntil:
    visible:
      text: "Select exercise Barbell Back Squat"
    timeout: 15000
- tapOn:
    text: "Select exercise Barbell Back Squat"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- extendedWaitUntil:
    visible:
      text: "Barbell Back Squat, 0 of 1 sets done"
    timeout: 15000
# The card links to the exercise page, whose logger sits on the empty set.
- tapOn:
    text: "Barbell Back Squat, 0 of 1 sets done"
- extendedWaitUntil:
    visible:
      id: "exercise-set-logger"
    timeout: 15000
# A new exercise's first set starts as a warm-up (the effort cycle itself is
# covered by exercise-page.yaml).
- assertVisible:
    id: "exercise-set-logger-effort"
    text: "Change effort, currently W-Up"
- takeScreenshot: "set-logger-empty"
- tapOn:
    id: "exercise-set-logger-weight"
- inputText: "135"
- tapOn:
    id: "exercise-set-logger-reps"
- inputText: "8"
- hideKeyboard:
    optional: true
- tapOn:
    id: "exercise-set-logger-commit"
- extendedWaitUntil:
    visible:
      id: "exercise-set-1-toggle"
      text: "Mark set 1 not performed"
    timeout: 10000
- assertVisible:
    id: "exercise-set-1-values"
    text: "135.0 × 8"
- takeScreenshot: "set-logger-confirmed"
- tapOn:
    id: "exercise-page-back"
- extendedWaitUntil:
    visible:
      text: "Barbell Back Squat, 1 of 1 sets done"
    timeout: 15000
# The session has one explicitly confirmed set, so Finish goes straight through
# with no incomplete, unconfirmed, or empty-row confirmation dialog.
- tapOn:
    id: "session-view-finish-button"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
# M24 makes completion a mandatory post-submit presentation. Exercise the
# explicit Done exit before continuing this lane's history persistence checks.
- tapOn:
    id: "session-completion-done"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
# The workout this flow just logged through the session view and exercise page
# must show up in the Stats exercise list. This is the only on-device check of
# the session-write -> exercise-analytics read-back path: stats-screen-ux.yaml
# covers the same list, but from fixture rows inserted straight into SQLite,
# which bypass the session screens entirely. A change to how sets or session-exercises are persisted would leave
# that flow green and break this one.
- extendedWaitUntil:
    visible:
      id: "stats-exercise-list"
    timeout: 15000
- assertVisible:
    id: "stats-exercise-row-seed_barbell_back_squat"
- assertNotVisible:
    id: "stats-exercise-list-empty"
- takeScreenshot: "05-data-runtime-smoke-exercise-list"
- tapOn:
    id: "stats-card-sessions"
- extendedWaitUntil:
    visible:
      id: "sessions-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "session-list-loading-state"
    timeout: 10000
- assertVisible: "Sessions"
- assertNotVisible: "(tabs)"
- assertVisible:
    id: "completed-history-scroll"
- takeScreenshot: "04-data-runtime-smoke-success"
