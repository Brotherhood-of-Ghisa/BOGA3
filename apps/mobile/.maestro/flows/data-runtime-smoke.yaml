appId: com.dinoderek.mobile
---
# maestro-ios-launch.sh has already opened the dev-client URL and blocks until
# Metro serves the entry bundle. Opening that URL again here races the harness
# navigation below: the delayed reload can replace an in-progress recorder with
# the initial Stats route and surface the one-time developer menu. The smoke lane
# owns explicit dev-client launch coverage; this data lane starts with its
# app-owned reset + teleport deep link.
- openLink: "boga3://maestro-harness?reset=data&teleport=session-list"
# A fresh dev-client install can defer its one-time onboarding sheet until the
# first post-launch app interaction. `Continue` advances into the developer
# menu, whose accessible `Close` control returns to the app; the accepted state
# then persists for the recorder teleport below.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- takeScreenshot: "03-data-runtime-smoke-start"
- openLink: "boga3://maestro-harness?reset=data&teleport=session-recorder"
- extendedWaitUntil:
    visible:
      id: "start-session-button"
    timeout: 30000
- tapOn:
    id: "start-session-button"
- extendedWaitUntil:
    visible:
      id: "session-recorder-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "No exercises logged yet."
    timeout: 30000
- tapOn: "Log new exercise"
- tapOn: "Exercise picker options"
- tapOn: "Turn grouping off"
- tapOn: "Exercise picker options"
- tapOn: "Exercise filter input"
- inputText: "Barbell Back Squat"
- hideKeyboard:
    optional: true
- tapOn: "Select Exercise"
# Pick the seeded "Barbell Back Squat" exercise by its accessibility label
# ("Select exercise <name>", session-recorder.tsx) rather than a fragile
# `point: "50%,26%"` coordinate tap. On a cold sim the picker list can render a
# beat later than on a warm one, so a coordinate tap raced the row layout and
# landed on empty space — leaving no exercise selected and failing the later
# "Weight for exercise 1 set 1" step. Filtering by the exact seeded name yields a
# deterministic seeded row. This smoke flow turns grouping off explicitly above;
# grouped collapse/search behavior is covered by focused tests.
- extendedWaitUntil:
    visible:
      text: "Select exercise Barbell Back Squat"
    timeout: 15000
- tapOn:
    text: "Select exercise Barbell Back Squat"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- takeScreenshot: "set-performance-normal-invalid"
- tapOn: "Weight for exercise 1 set 1"
- inputText: "135"
- tapOn: "Reps for exercise 1 set 1"
- inputText: "8"
- hideKeyboard:
    optional: true
- takeScreenshot: "set-performance-normal-unconfirmed"
- tapOn:
    id: "set-performance-control-1-1"
- takeScreenshot: "set-performance-normal-confirmed"
# The session has one explicitly confirmed set, so Submit goes straight through
# with no incomplete, unconfirmed, or empty-row confirmation dialog.
- tapOn: "Submit Session"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- tapOn:
    id: "stats-card-sessions"
- extendedWaitUntil:
    visible:
      id: "sessions-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "session-list-loading-state"
    timeout: 10000
- assertVisible: "Sessions"
- assertNotVisible: "(tabs)"
- assertVisible:
    id: "completed-history-scroll"
- takeScreenshot: "04-data-runtime-smoke-success"
