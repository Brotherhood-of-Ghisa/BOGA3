appId: com.dinoderek.mobile
---
# Group-exercise linking end to end (M25-T07; product E0.1, E0.3; lane
# ios-groups-e2e). The device signs in as fixture user_e and drives the real UI
# against local Supabase:
#
#   1. catalogue ⋮ "Link to group exercise…" → Link screen → Link (the group
#      exercise is suggested: it was copied from the standard exercise the
#      member's seeded "Barbell Bench Press" is);
#   2. the session view's picker (Train → Start → + Add exercise) search finds
#      the group exercise under "From your groups" as "linked: Barbell Bench
#      Press";
#   3. picking it adds the member's own exercise to the session;
#   4. that exercise's page ⋮ "Link to group exercise…" opens the same Link
#      screen, showing the link made in step 1.
#
# Server setup runs as user_e itself over HTTP (../scripts/groups-link-setup.js:
# group_create + group_exercise_create), the same RPCs an admin's app calls.
#
# ISOLATION: user_e is dedicated to this flow (docs/specs/11, enforced by
# scripts/tests/maestro-fixture-users.test.sh). The lane runner's
# groups-fixture-reset.sh hard-deletes user_e's groups and sync rows (links
# included) and sets its username before every run.

# --- Boot + sign in as user_e (pattern: groups-two-user-stream.yaml) ----------
- launchApp:
    clearState: true
- openLink: "${MAESTRO_IOS_DEV_CLIENT_URL}"
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Continue"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Close"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-email-input"
- inputText: "${MAESTRO_GROUPS_LINK_DEVICE_EMAIL}"
- tapOn:
    id: "sign-in-password-input"
- inputText: "${MAESTRO_GROUPS_LINK_DEVICE_PASSWORD}"
- tapOn:
    id: "sign-in-submit-button"
- assertNotVisible:
    id: "sign-in-screen"
# Lift the first-sync gate (the seeded catalogue is local by now) and land on a
# normal route in one harness link.
- openLink: "boga3://maestro-harness?bootstrap=complete&teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 60000
- runScript:
    file: ../scripts/groups-link-setup.js
    env:
      SUPABASE_URL: ${MAESTRO_GROUPS_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${MAESTRO_GROUPS_SUPABASE_ANON_KEY}
      EMAIL: ${MAESTRO_GROUPS_LINK_DEVICE_EMAIL}
      PASSWORD: ${MAESTRO_GROUPS_LINK_DEVICE_PASSWORD}

# --- 1. Catalogue ⋮ → Link screen → Link --------------------------------------
- openLink: "boga3://maestro-harness?teleport=exercise-catalog"
- extendedWaitUntil:
    visible:
      text: "Exercise catalog options"
    timeout: 30000
# The grouping preference is shared by the catalogue and the picker; a flat list
# makes every search result a direct row (grouped sections start collapsed).
#
# Every step below retries until its effect is visible, not merely until the tap
# lands: right after the teleport the screen is still settling (iOS 26 AX churn),
# and a tap Maestro reports as done can be swallowed — the sheet never opens and
# the flow fails later. Each tap is guarded by `when` so a retry never re-taps
# once the effect happened (a second ⋮ tap would hit the Filters sheet's
# backdrop; a second grouping tap would turn grouping back on). The Filters
# sheet (DLM-T07) is present while its date-range control is.
- extendedWaitUntil:
    visible:
      text: "Exercise filter input"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: "exercise-list-date-range-row"
          commands:
            - tapOn: "Exercise catalog options"
      - extendedWaitUntil:
          visible:
            id: "exercise-list-date-range-row"
          timeout: 5000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "Turn grouping off"
          commands:
            - tapOn: "Turn grouping off"
      - extendedWaitUntil:
          visible:
            text: "Turn grouping on"
          timeout: 5000
# The sheet has no Done (G5): tap the dimmed page above it. Its backdrop is
# hidden from VoiceOver while the sheet is modal, so it is tapped by point.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "exercise-list-date-range-row"
          commands:
            - tapOn:
                point: "50%,12%"
      - extendedWaitUntil:
          notVisible:
            id: "exercise-list-date-range-row"
          timeout: 5000
- tapOn: "Exercise filter input"
- inputText: "Barbell Bench Press"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Exercise actions Barbell Bench Press"
    timeout: 15000
- tapOn: "Exercise actions Barbell Bench Press"
- tapOn:
    id: "exercise-action-link-group"
# The Link screen loads my groups' exercises online; the copy of the same
# standard exercise is offered under Suggested.
- extendedWaitUntil:
    visible:
      id: "exercise-link-link-${output.linkGroupExerciseId}"
    timeout: 30000
- takeScreenshot: "groups-link-01-link-screen"
- tapOn:
    id: "exercise-link-link-${output.linkGroupExerciseId}"
- extendedWaitUntil:
    visible:
      id: "exercise-link-linked-row-${output.linkGroupExerciseId}"
    timeout: 15000
- assertVisible:
    text: "Your past Barbell Bench Press sets shared with Link Crew will count."
- takeScreenshot: "groups-link-02-linked"

# --- 2. Session view picker search → From your groups → add ------------------
# Train's Start opens the session view; `+ Add exercise` opens the picker.
- openLink: "boga3://maestro-harness?teleport=session-list"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "top-level-tab-train"
      - extendedWaitUntil:
          visible:
            id: "train-start-empty-button"
          timeout: 15000
- tapOn:
    id: "train-start-empty-button"
- extendedWaitUntil:
    visible:
      id: "session-view-add-exercise"
    timeout: 30000
- tapOn:
    id: "session-view-add-exercise"
- tapOn: "Exercise filter input"
- inputText: "Comp Bench"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "exercise-picker-group-row-${output.linkGroupExerciseId}"
    timeout: 30000
# The row is one accessible press target, so iOS exposes its label, not the
# child texts; Maestro matches the whole label.
- assertVisible:
    text: "Group exercise Comp Bench in Link Crew, linked: Barbell Bench Press"
- takeScreenshot: "groups-link-03-picker-search"
- tapOn:
    id: "exercise-picker-group-row-${output.linkGroupExerciseId}"
# My own exercise (not the group exercise's name) was added to the session.
- extendedWaitUntil:
    visible:
      text: "Barbell Bench Press, 0 of 1 sets done"
    timeout: 15000
- assertNotVisible:
    text: ".*Comp Bench.*"
- takeScreenshot: "groups-link-04-added"

# --- 4. Exercise page ⋮ → Link screen -----------------------------------------
# The session view's card opens the exercise page.
- tapOn:
    text: "Barbell Bench Press, .*"
- extendedWaitUntil:
    visible:
      id: "exercise-page-options"
    timeout: 15000
- tapOn:
    id: "exercise-page-options"
- extendedWaitUntil:
    visible:
      id: "exercise-options-link-group"
    timeout: 10000
- takeScreenshot: "groups-link-05-exercise-options"
- tapOn:
    id: "exercise-options-link-group"
- extendedWaitUntil:
    visible:
      id: "exercise-link-linked-row-${output.linkGroupExerciseId}"
    timeout: 30000
- takeScreenshot: "groups-link-06-exercise-page-link-screen"
