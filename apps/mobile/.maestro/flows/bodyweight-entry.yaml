appId: com.dinoderek.mobile
---
# One dated reading changes a bodyweight exercise's added-weight RM and total-load volume.
- openLink: "boga3://maestro-harness?reset=data&fixture=bodyweight-rm-volume&teleport=exercise-page&sessionId=maestro_bw_active&sessionExerciseId=maestro_bw_exercise"
- tapOn: { text: "Open", optional: true }
- tapOn: { text: "Continue", optional: true }
- tapOn: { text: "Close", optional: true }
- extendedWaitUntil:
    visible: { id: "exercise-page" }
    timeout: 30000
- scrollUntilVisible:
    element: { id: "exercise-set-logger-preview" }
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "exercise-set-logger-preview"
    text: "Added 1RM — · VOL —"
- takeScreenshot: "bodyweight-before-reading"
- scrollUntilVisible:
    element: { id: "session-body-weight-add-reading" }
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: { id: "session-body-weight-add-reading" }
- extendedWaitUntil:
    visible: { id: "weight-entry-value" }
    timeout: 30000
- tapOn: { id: "weight-entry-value" }
- inputText: "82"
- hideKeyboard: { optional: true }
- scrollUntilVisible:
    element: { id: "weight-entry-save" }
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: { id: "weight-entry-save" }
- extendedWaitUntil:
    notVisible: { id: "weight-entry-sheet" }
    timeout: 15000
- scrollUntilVisible:
    element: { id: "exercise-set-logger-preview" }
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "exercise-set-logger-preview"
    text: "Added 1RM 48.2 · VOL 816"
- takeScreenshot: "bodyweight-after-reading"
