appId: com.dinoderek.mobile
---
# Ordinary logging by default, private opt-in, kg-only reading management,
# silent bodyweight-aware recalculation and the concise contribution editor.
- openLink: "boga3://maestro-harness?reset=data&fixture=bodyweight-rm-volume&teleport=exercise-page&sessionId=maestro_bw_active&sessionExerciseId=maestro_bw_exercise"
- tapOn: { text: "Open", optional: true }
- tapOn: { text: "Continue", optional: true }
- tapOn: { text: "Close", optional: true }
- extendedWaitUntil:
    visible: { id: "exercise-page" }
    timeout: 30000
- tapOn: { id: "exercise-set-1-open" }
- scrollUntilVisible:
    element: { id: "exercise-set-logger-preview" }
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "exercise-set-logger-preview"
    text: "1RM 0.0 · VOL 0"
- assertVisible: "Weight · kg"
- assertNotVisible: "Added"
- assertNotVisible: "Effective load"
- assertNotVisible: { id: "exercise-set-unit-lb" }
- assertNotVisible: "Body weight"
- takeScreenshot: "bodyweight-recorder-mode-off"

- openLink: "boga3://settings"
- extendedWaitUntil:
    visible: { id: "settings-bodyweight-calculations-row" }
    timeout: 30000
- assertVisible: { id: "settings-bodyweight-calculations-toggle" }
- assertVisible: "Bodyweight calculations off"
- assertVisible: { id: "settings-body-weight-row" }
- takeScreenshot: "bodyweight-settings-mode-off"
- tapOn: { id: "settings-bodyweight-calculations-toggle" }
- extendedWaitUntil:
    visible: "Bodyweight calculations on"
    timeout: 10000
- assertVisible: { id: "settings-body-weight-row" }
- takeScreenshot: "bodyweight-settings-mode-on"
- tapOn: { id: "settings-body-weight-row" }
- extendedWaitUntil:
    visible: { id: "body-weight-screen" }
    timeout: 30000
- tapOn: { id: "body-weight-add" }
- extendedWaitUntil:
    visible: { id: "weight-entry-value" }
    timeout: 30000
- tapOn: { id: "weight-entry-value" }
- inputText: "82"
- assertNotVisible:
    id: "weight-entry-unit-lb"
- hideKeyboard: { optional: true }
- scrollUntilVisible:
    element: { id: "weight-entry-save" }
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: { id: "weight-entry-save" }
- extendedWaitUntil:
    visible: { id: "body-weight-reading-.*" }
    timeout: 15000
- takeScreenshot: "bodyweight-weight-history-kg"

- openLink: "boga3://maestro-harness?bodyweightCalculations=on&teleport=exercise-page&sessionId=maestro_bw_active&sessionExerciseId=maestro_bw_exercise"
- extendedWaitUntil:
    visible: { id: "exercise-page" }
    timeout: 30000
- tapOn: { id: "exercise-set-1-open" }
- scrollUntilVisible:
    element: { id: "exercise-set-logger-preview" }
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "exercise-set-logger-preview"
    text: "1RM 28.5 · VOL 820"
- assertVisible: "Weight · kg"
- assertNotVisible: "Added"
- assertNotVisible: "Effective load"
- assertNotVisible: "Body weight"
- takeScreenshot: "bodyweight-recorder-mode-on"

# The session view uses exactly the ordinary row vocabulary and geometry.
# Bodyweight changes only the computed 1RM and volume behind that row.
- openLink: "boga3://maestro-harness?bodyweightCalculations=on&teleport=session-view&sessionId=maestro_bw_active"
- extendedWaitUntil:
    visible: { id: "session-view-screen" }
    timeout: 30000
- assertVisible:
    id: "session-view-exercise-maestro_bw_exercise-set-1-values"
    text: "0.0 × 10"
- assertVisible:
    id: "session-view-exercise-maestro_bw_exercise-set-1-1rm"
    text: "1RM 28.5"
- assertVisible:
    id: "session-view-exercise-maestro_bw_exercise-set-1-vol"
    text: "Vol 820"
- assertNotVisible: "Added 1RM"
- assertNotVisible: "BW +"
- takeScreenshot: "bodyweight-session-view"
- openLink: "boga3://maestro-harness?bodyweightCalculations=on&teleport=exercise-page&sessionId=maestro_bw_active&sessionExerciseId=maestro_bw_exercise"
- extendedWaitUntil:
    visible: { id: "exercise-page" }
    timeout: 30000

- tapOn: { id: "exercise-page-options" }
- tapOn: { id: "exercise-options-edit" }
- extendedWaitUntil:
    visible: { id: "exercise-editor" }
    timeout: 30000
- assertVisible: { id: "exercise-editor-bodyweight-percentage" }
- assertNotVisible: { id: "exercise-editor-movement-standard" }
- assertNotVisible: { id: "exercise-editor-loading-method" }
- takeScreenshot: "bodyweight-exercise-editor"
