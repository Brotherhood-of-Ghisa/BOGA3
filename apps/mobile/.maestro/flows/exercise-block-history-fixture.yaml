appId: com.dinoderek.mobile
---
- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-block-history&teleport=session-recorder&maestroShare=fail-once"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-recorder-empty-state"
    timeout: 30000
- tapOn:
    id: "start-session-button"
- extendedWaitUntil:
    visible:
      id: "session-recorder-screen"
    timeout: 30000
- tapOn: "Log new exercise"
- tapOn: "Exercise picker options"
- tapOn: "Turn grouping off"
- tapOn: "Exercise picker options"
- tapOn: "Exercise filter input"
- inputText: "back squat"
- hideKeyboard:
    optional: true
- extendedWaitUntil:
    visible:
      text: "Select exercise Barbell Back Squat"
    timeout: 15000
- tapOn:
    text: "Select exercise Barbell Back Squat"
- tapOn:
    id: "exercise-picker-append-plan-button"
- extendedWaitUntil:
    visible:
      id: "planned-set-row-1-1"
    timeout: 15000
- takeScreenshot: "set-performance-appended-plan-unconfirmed"
- tapOn:
    id: "set-performance-control-1-1"
- takeScreenshot: "set-performance-appended-plan-confirmed"
- extendedWaitUntil:
    visible:
      id: "exercise-block-history-panel-1-collapsed"
    timeout: 30000
- takeScreenshot: "exercise-block-comparison-start-collapsed"
- tapOn:
    id: "exercise-block-history-panel-1-collapsed"
- extendedWaitUntil:
    visible:
      id: "exercise-block-history-panel-1"
    timeout: 10000
- assertVisible: "Current"
- assertVisible: "Working sets"
- tapOn:
    id: "set-row-pressable-1-1"
- tapOn: "Weight for exercise 1 set 1"
- eraseText
- inputText: "300"
- tapOn: "Reps for exercise 1 set 1"
- eraseText
- inputText: "5"
- tapOn:
    id: "set-quality-button-1-1"
- hideKeyboard:
    optional: true
- tapOn:
    id: "set-performance-control-1-1"
- tapOn:
    id: "set-performance-control-1-1"
- scrollUntilVisible:
    element:
      id: "exercise-expanded-pr-1"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "exercise-expanded-pr-1"
- assertVisible: "New PR"
- assertVisible: "300 kg × 5 reps · est. 1RM 350 kg"
- takeScreenshot: "exercise-block-comparison-expanded"
- tapOn: "Share PR for Barbell Back Squat"
- extendedWaitUntil:
    visible:
      id: "exercise-expanded-pr-1-share-error"
    timeout: 10000
- takeScreenshot: "exercise-pr-share-error"
- tapOn: "Share PR for Barbell Back Squat"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- takeScreenshot: "exercise-pr-platform-share-sheet"
# Swipe the system sheet down; no share destination is selected.
- swipe:
    start: "50%,55%"
    end: "50%,95%"
    duration: 500
- extendedWaitUntil:
    notVisible: "Copy"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "exercise-expanded-pr-1"
    direction: UP
    visibilityPercentage: 80
    centerElement: true
- scrollUntilVisible:
    element:
      id: "exercise-collapse-toggle-1"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "exercise-collapse-toggle-1"
- extendedWaitUntil:
    visible:
      id: "exercise-collapsed-summary-1-counts"
    timeout: 10000
- assertVisible: "1 set · 0 w/sets"
- assertVisible:
    id: "exercise-collapsed-summary-1-new-pr"
- takeScreenshot: "exercise-card-summary-new-pr"
- scrollUntilVisible:
    element:
      text: "Log new exercise"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn: "Log new exercise"
- tapOn: "Exercise filter input"
- eraseText
- inputText: "Barbell Bench Press"
- extendedWaitUntil:
    visible:
      text: "Select exercise Barbell Bench Press"
    timeout: 15000
- tapOn:
    text: "Select exercise Barbell Bench Press"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- extendedWaitUntil:
    visible:
      id: "exercise-block-history-panel-2-collapsed"
    timeout: 30000
- tapOn: "Weight for exercise 2 set 1"
- inputText: "300"
- tapOn: "Reps for exercise 2 set 1"
- inputText: "5"
- hideKeyboard:
    optional: true
- tapOn:
    id: "set-performance-control-2-1"
- scrollUntilVisible:
    element:
      id: "exercise-expanded-pr-2"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- assertVisible: "Barbell Bench Press"
- assertVisible: "300 kg × 5 reps · est. 1RM 350 kg"
- scrollUntilVisible:
    element:
      id: "exercise-collapse-toggle-2"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "exercise-collapse-toggle-2"
- extendedWaitUntil:
    visible:
      id: "exercise-collapsed-summary-2-new-pr"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "exercise-collapsed-summary-1-new-pr"
    direction: UP
    visibilityPercentage: 100
- assertVisible:
    id: "exercise-collapsed-summary-2-new-pr"
- takeScreenshot: "exercise-card-summary-two-prs"
- scrollUntilVisible:
    element:
      text: "Log new exercise"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn: "Log new exercise"
- tapOn: "Exercise filter input"
- eraseText
- inputText: "low cable one-arm"
- extendedWaitUntil:
    visible:
      text: "Select exercise Low Cable One-Arm Lateral Raise"
    timeout: 15000
- tapOn:
    text: "Select exercise Low Cable One-Arm Lateral Raise"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- extendedWaitUntil:
    visible:
      id: "exercise-block-history-panel-3-empty-collapsed"
    timeout: 30000
- tapOn:
    id: "exercise-collapse-toggle-3"
- extendedWaitUntil:
    visible:
      id: "exercise-collapsed-summary-3-counts"
    timeout: 10000
- assertVisible: "0 sets · 0 w/sets"
- assertNotVisible:
    id: "exercise-collapsed-summary-3-new-pr"
- takeScreenshot: "exercise-card-summary-empty-history"
- scrollUntilVisible:
    element:
      id: "session-recorder-submit-button"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "session-recorder-submit-button"
- extendedWaitUntil:
    visible: "Remove incomplete sets and submit?"
    timeout: 10000
- tapOn: "Remove incomplete sets and submit"
- extendedWaitUntil:
    visible: "Remove exercises with no sets and submit?"
    timeout: 10000
- tapOn: "Remove empty exercises and submit"
- extendedWaitUntil:
    visible:
      id: "session-completion-presentation"
    timeout: 30000
- assertVisible: "Session complete"
- assertVisible: "Personal records"
- assertVisible:
    id: "session-completion-pr-position"
- assertVisible: "Barbell Back Squat"
- takeScreenshot: "session-completion-multiple-prs-first"
- tapOn: "Share PR for Barbell Back Squat"
- extendedWaitUntil:
    visible:
      id: "session-completion-pr-seed_barbell_back_squat-share-error"
    timeout: 10000
- takeScreenshot: "session-completion-share-error"
- tapOn: "Share PR for Barbell Back Squat"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- takeScreenshot: "session-completion-platform-share-sheet"
# Dismiss without selecting a destination; this proves launch/cancel only.
- swipe:
    start: "50%,55%"
    end: "50%,95%"
    duration: 500
- extendedWaitUntil:
    notVisible: "Copy"
    timeout: 10000
- tapOn: "Next personal record"
- assertVisible:
    id: "session-completion-pr-position"
- assertVisible: "Barbell Bench Press"
- takeScreenshot: "session-completion-multiple-prs-second"
- scrollUntilVisible:
    element:
      id: "session-muscle-load-row"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "session-muscle-load-row"
- extendedWaitUntil:
    visible: "Close session muscle load"
    timeout: 10000
- takeScreenshot: "session-completion-muscle-load"
- tapOn: "Close session muscle load"
- scrollUntilVisible:
    element:
      id: "session-completion-view-muscle-load"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "session-completion-view-muscle-load"
- extendedWaitUntil:
    visible:
      id: "stats-history-screen"
    timeout: 30000
- assertVisible:
    id: "stats-period-chip-7"
- assertVisible:
    id: "stats-view-mode-chip-muscle"
- takeScreenshot: "session-completion-seven-day-muscle-handoff"
