appId: com.dinoderek.mobile
---
- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-block-history&teleport=session-recorder"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "session-recorder-empty-state"
    timeout: 30000
- tapOn:
    id: "start-session-button"
- extendedWaitUntil:
    visible:
      id: "session-recorder-screen"
    timeout: 30000
- tapOn: "Log new exercise"
- tapOn: "Exercise picker options"
- tapOn: "Turn grouping off"
- tapOn: "Exercise picker options"
- tapOn: "Exercise filter input"
- inputText: "back squat"
- hideKeyboard:
    optional: true
- tapOn: "Select Exercise"
- extendedWaitUntil:
    visible:
      text: "Select exercise Barbell Back Squat"
    timeout: 15000
- tapOn:
    text: "Select exercise Barbell Back Squat"
- tapOn:
    id: "exercise-picker-append-plan-button"
- extendedWaitUntil:
    visible:
      id: "planned-set-row-1-1"
    timeout: 15000
- takeScreenshot: "set-performance-appended-plan-unconfirmed"
- tapOn:
    id: "set-performance-control-1-1"
- takeScreenshot: "set-performance-appended-plan-confirmed"
- extendedWaitUntil:
    visible:
      id: "exercise-block-history-panel-1-collapsed"
    timeout: 30000
- takeScreenshot: "exercise-block-comparison-start-collapsed"
- tapOn:
    id: "exercise-block-history-panel-1-collapsed"
- extendedWaitUntil:
    visible:
      id: "exercise-block-history-panel-1"
    timeout: 10000
- assertVisible: "Current"
- assertVisible: "Working sets"
- tapOn:
    id: "set-row-pressable-1-1"
- tapOn: "Weight for exercise 1 set 1"
- eraseText
- inputText: "300"
- tapOn: "Reps for exercise 1 set 1"
- eraseText
- inputText: "5"
- tapOn:
    id: "set-quality-button-1-1"
- hideKeyboard:
    optional: true
- tapOn:
    id: "set-performance-control-1-1"
- tapOn:
    id: "set-performance-control-1-1"
- assertVisible:
    id: "exercise-expanded-pr-1"
- assertVisible: "PR: 300 kg × 5 reps · est. 1RM 350 kg"
- takeScreenshot: "exercise-block-comparison-expanded"
- tapOn:
    id: "exercise-collapse-toggle-1"
- extendedWaitUntil:
    visible:
      id: "exercise-collapsed-summary-1-counts"
    timeout: 10000
- assertVisible: "1 set · 1 w/set"
- assertVisible:
    id: "exercise-collapsed-summary-1-new-pr"
- assertVisible: "PR: 300 kg × 5 reps · est. 1RM 350 kg"
- takeScreenshot: "exercise-card-summary-new-pr"
- tapOn:
    id: "exercise-collapse-toggle-1"
- assertVisible:
    id: "exercise-block-history-panel-1"
- scrollUntilVisible:
    element:
      text: "Log new exercise"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn: "Log new exercise"
- tapOn: "Exercise filter input"
- inputText: "low cable one-arm"
- hideKeyboard:
    optional: true
- tapOn: "Select Exercise"
- extendedWaitUntil:
    visible:
      text: "Select exercise Low Cable One-Arm Lateral Raise"
    timeout: 15000
- tapOn:
    text: "Select exercise Low Cable One-Arm Lateral Raise"
- tapOn:
    id: "exercise-picker-add-empty-set-button"
- extendedWaitUntil:
    visible:
      id: "exercise-block-history-panel-2-empty-collapsed"
    timeout: 30000
- tapOn:
    id: "exercise-collapse-toggle-2"
- extendedWaitUntil:
    visible:
      id: "exercise-collapsed-summary-2-counts"
    timeout: 10000
- assertVisible: "0 sets · 0 w/sets"
- assertNotVisible:
    id: "exercise-collapsed-summary-2-new-pr"
- takeScreenshot: "exercise-card-summary-empty-history"
