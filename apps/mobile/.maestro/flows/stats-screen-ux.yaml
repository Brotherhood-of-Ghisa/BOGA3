appId: com.dinoderek.mobile
---
# Stats over on-device data (ios-ui-regression lane, infra-free).
#
# Proves:
#   1. the harness seeds the exercise-block-history fixture into the device's
#      SQLite and Stats renders it: the seeded exercise row, and the 7-day sets
#      card `10 (8)` computed by the stats queries on that database;
#   2. tapping the row opens its history sheet, and a tap on the dimmed page
#      above the sheet dismisses it.
# Why device:
#   1. the on-device expo-sqlite runtime, reached through the harness deep link;
#   2. a real sheet: modal presentation and the backdrop tap.
# Jest counterpart: app/__tests__/stats-screen-local-data.test.tsx (the same
#   fixture over the in-memory database: empty state, both period totals and the
#   invalid-set drop, the muscle breakdown, both history sheets),
#   app/__tests__/stats-screen.test.tsx (controls, local sorting, metric chips,
#   Daily/Weekly, week banner, backdrop dismissal),
#   app/__tests__/heatmap-marks.test.tsx (today and selected cells).
#
# The fixture's sessions are seeded relative to now (daysAgo), so `10 (8)` holds
# on any run date: 6 sessions in the last 7 days, 10 sets of which 8 are working
# sets. Change src/maestro/exercise-block-history-fixture.ts ⇒ update it here.

- openLink: "boga3://maestro-harness?reset=data&fixture=exercise-block-history&teleport=session-list"
# Wait for the seeded list, not the screen: an empty Stats screen is also
# `stats-history-screen`, so that wait could pass before the harness has seeded
# and navigated (spec 06 rule 4).
- extendedWaitUntil:
    visible:
      id: "stats-exercise-list"
    timeout: 30000
- assertVisible:
    id: "stats-exercise-row-seed_barbell_back_squat"
# The card's Stat is one accessible element whose label is "<legend> <value>".
- assertVisible: "Sets \\(W/Sets\\) 10 \\(8\\)"
- takeScreenshot: "01-exercise-view-default"

- tapOn:
    id: "stats-exercise-row-seed_barbell_back_squat"
- extendedWaitUntil:
    visible:
      id: "stats-exercise-history-title"
    timeout: 15000
- assertVisible: "Weekly training load"
- takeScreenshot: "05b-exercise-heatmap-weekly"
# The sheet is modal to VoiceOver, which hides its backdrop from the
# accessibility tree Maestro reads, so tap a point above the sheet instead.
- tapOn:
    point: "50%,10%"
- extendedWaitUntil:
    notVisible:
      id: "stats-exercise-history-title"
    timeout: 5000
- assertVisible:
    id: "stats-exercise-list"
